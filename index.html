function safeText(value){if(value===undefined||value===null||value==='')return'';return String(value).trim()}
function normalizeStatus(status){const s=safeText(status);if(s.includes('跟播')||s.includes('播放中')||s.toLowerCase().includes('airing'))return'正在跟播';if(s.includes('待播')||s.includes('未播')||s.toLowerCase().includes('upcoming'))return'待播中';if(s.includes('完結')||s.includes('已完')||s.toLowerCase().includes('completed'))return'已完結';return s||'未分類'}
function statusClass(status){if(status==='正在跟播')return'bg-emerald-100 text-emerald-700';if(status==='待播中')return'bg-blue-100 text-blue-700';if(status==='已完結')return'bg-stone-100 text-stone-600';return'bg-rose-100 text-rose-600'}
function parseNumber(value){if(value===undefined||value===null||value==='')return 0;const n=parseInt(String(value).replace(/[^\d]/g,''),10);return Number.isNaN(n)?0:n}
function parseDate(value){if(!value)return null;const text=String(value).trim();const match=text.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(!match)return null;const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));return Number.isNaN(date.getTime())?null:date}
function formatDate(date){if(!date)return'-';return`${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`}
function formatMonthDay(date){if(!date)return'-';return`${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')}`}
function getWeekDayNumber(text){if(!text)return null;const s=String(text);const map={'週一':1,'周一':1,'星期一':1,'週二':2,'周二':2,'星期二':2,'週三':3,'周三':3,'星期三':3,'週四':4,'周四':4,'星期四':4,'週五':5,'周五':5,'星期五':5,'週六':6,'周六':6,'星期六':6,'週日':0,'周日':0,'星期日':0};for(const k in map)if(s.includes(k))return map[k];return null}
function calculateEpisodeDate(premiereDate,episode,airDay){if(!premiereDate)return null;const date=new Date(premiereDate);const target=getWeekDayNumber(airDay);if(target!==null&&episode===1){let diff=target-date.getDay();if(diff<0)diff+=7;date.setDate(date.getDate()+diff)}if(episode>1)date.setDate(date.getDate()+(episode-1)*7);return date}
function calculateNextAirDate(drama){if(normalizeStatus(drama.ststus_type)!=='正在跟播')return null;const premiere=parseDate(drama.premiere_date);if(!premiere)return null;const total=parseNumber(drama.total_episodes);const my=parseNumber(drama.my_progress||drama.my_propress);const friend=parseNumber(drama.friend_progress);const progress=Math.max(my,friend);if(total&&progress>=total)return null;return calculateEpisodeDate(premiere,progress+1,drama.air_day_of_week)}
function generateEpisodeSchedule(drama){const premiere=parseDate(drama.premiere_date);const total=parseNumber(drama.total_episodes);if(!premiere||!total)return[];return Array.from({length:total},(_,i)=>({episode:i+1,date:calculateEpisodeDate(premiere,i+1,drama.air_day_of_week)}))}

/* OST：只讀 song_N_name / song_N_link，不讀 song_N_type */
function getOSTs(drama){const songs=[];Object.keys(drama||{}).forEach(key=>{const m=key.match(/^song_(\d+)_(name|title|link|url)$/i);if(!m)return;const num=Number(m[1]);const field=m[2].toLowerCase();if(!songs[num])songs[num]={};if(field==='name'||field==='title')songs[num].name=safeText(drama[key]);if(field==='link'||field==='url')songs[num].link=safeText(drama[key])});return songs.filter(Boolean).filter(s=>s.name||s.link)}

function ImageWithFallback({src,fallback,alt,className}){const[currentSrc,setCurrentSrc]=useState(src||fallback);useEffect(()=>setCurrentSrc(src||fallback),[src,fallback]);return <img src={currentSrc} alt={alt||''} className={className} loading="lazy" onError={()=>{if(currentSrc!==fallback)setCurrentSrc(fallback)}}/>}

/* =========================================================
   Wishlist / Google Apps Script 同步
========================================================= */

/*
  你的 Apps Script Web App URL
  需要部署成「網頁應用程式」
  執行身分：我
  存取權限：依你的部署設定
*/
const GAS_URL =
    'https://script.google.com/macros/s/AKfycby5IWKfG-X7-M-xvIri5LgWAf4IBz6ISIB9sIM8BzmsQ20CqGUAy9FBwcT6rBp3I6BY/exec';

/*
  Google Apps Script Web App 的跨來源 POST：
  使用 no-cors + text/plain，避免 JSON content-type 觸發預檢請求。
  Apps Script 仍然可以從 e.postData.contents 取得 JSON 字串。
*/
async function syncWishlistToGoogleSheet(payload) {

    const body = JSON.stringify(payload);

    try {

        await fetch(
            GAS_URL,
            {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body
            }
        );

        return {
            success: true,
            message: '已送出 Google Sheet 更新'
        };

    } catch (error) {

        console.error(
            'Google Sheet Wishlist 同步失敗',
            error
        );

        return {
            success: false,
            message: error.message || '同步失敗'
        };
    }
}


/* =========================================================
   Google Sheet 真正同步：通用 CRUD
========================================================= */

async function syncToGoogleSheet(payload) {

    const body = JSON.stringify(payload);

    try {

        await fetch(
            GAS_URL,
            {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body
            }
        );

        /*
          Apps Script Web App 的跨來源回應在 no-cors 模式下無法直接讀取。
          因此送出後由前端重新讀取公開 CSV 驗證資料是否已同步。
        */

        return {
            success: true,
            message: '已送出 Google Sheet 更新'
        };

    } catch (error) {

        console.error(
            'Google Sheet 同步失敗',
            error
        );

        return {
            success: false,
            message:
                error.message ||
                'Google Sheet 同步失敗'
        };
    }
}

function addCacheBust(url) {

    const separator =
        url.includes('?') ? '&' : '?';

    return `${url}${separator}cb=${Date.now()}_${Math.random().toString(36).slice(2)}`;
}

function parseSheet(url) {

    return new Promise((resolve,reject) => {

        Papa.parse(
            addCacheBust(url),
            {
                download: true,
                header: true,
                skipEmptyLines: true,

                complete: result => {

                    resolve({
                        data: result.data || [],
                        headers:
                            result.meta &&
                            result.meta.fields
                            ? result.meta.fields
                            : []
                    });
                },

                error: error => {
                    reject(error);
                }
            }
        );
    });
}

function isHiddenEditableField(field) {

    const key =
        safeText(field).toLowerCase();

    if (key === 'trailer_link') {
        return true;
    }

    if (
        /^song_\d+_type$/i.test(key)
    ) {
        return true;
    }

    return false;
}

function fieldLabel(field) {

    const map = {
        id: 'ID',
        drama_id: '劇集 ID',
        title_zh: '中文劇名',
        title_th: '泰文劇名',
        cp_name: 'CP 名稱',
        poster_url: '海報圖片網址',
        premiere_date: '首播日期',
        total_episodes: '總集數',
        ststus_type: '播放狀態',
        status_type: '播放狀態',
        air_day_of_week: '播出星期',
        air_time: '播出時間',
        synopsis: '劇情簡介',
        description: '劇情描述',
        my_progress: '遙追劇進度',
        my_propress: '遙追劇進度',
        friend_progress: '錢追劇進度',
        my_rating: '遙評分',
        friend_rating: '錢評分',
        my_review: '遙心得',
        friend_review: '錢心得',
        ott_link: '觀看平台連結',
        ott_platform: '觀看平台',
        ott_plaform: '觀看平台',
        source_link: '資料來源',
        owner: '提議者',
        my_want: '遙想看',
        friend_want: '錢想看',
        priority: '優先級',
        wishlist_status: 'Wishlist 狀態',
        added_date: '加入日期',
        planned_watch_date: '預計觀看日期',
        note: '備註',
        actor_1: '成員 1',
        actor_2: '成員 2',
        photo_url: '照片網址',
        my_favorite: '遙喜歡',
        friend_favorite: '錢喜歡'
    };

    if (map[field]) {
        return map[field];
    }

    const songMatch =
        safeText(field).match(
            /^song_(\d+)_(name|title|link|url)$/i
        );

    if (songMatch) {
        const n = songMatch[1];
        const type = songMatch[2].toLowerCase();

        if (type === 'name' || type === 'title') {
            return `OST ${n} 歌曲名稱`;
        }

        return `OST ${n} 連結`;
    }

    return field;
}

function getPrimaryField(sheetType,headers) {

    if (sheetType === 'wishlist') {
        return headers.includes('drama_id')
            ? 'drama_id'
            : headers[0] || 'drama_id';
    }

    if (headers.includes('id')) {
        return 'id';
    }

    if (sheetType === 'actors' && headers.includes('cp_name')) {
        return 'cp_name';
    }

    if (headers.includes('title_zh')) {
        return 'title_zh';
    }

    return headers[0] || 'id';
}

function isBooleanField(field) {

    return [
        'my_want',
        'friend_want',
        'my_favorite',
        'friend_favorite'
    ].includes(
        safeText(field).toLowerCase()
    );
}

function isDateField(field) {

    const key =
        safeText(field).toLowerCase();

    return (
        key.includes('date') &&
        !key.includes('updated_at')
    );
}

function isLongTextField(field) {

    const key =
        safeText(field).toLowerCase();

    return [
        'synopsis',
        'description',
        'note',
        'my_review',
        'friend_review'
    ].includes(key);
}

function defaultValueForField(field,sheetType) {

    if (isBooleanField(field)) {
        return 'FALSE';
    }

    if (sheetType === 'wishlist') {

        if (field === 'priority') {
            return '想看';
        }

        if (field === 'wishlist_status') {
            return '待看';
        }
    }

    return '';
}

function isWishlistYes(value) {

    return [
        'true',
        '1',
        'yes',
        'y',
        '是',
        '有',
        '想看',
        '喜歡'
    ].includes(
        safeText(value).toLowerCase()
    );
}

function normalizeWishlistPriority(value) {

    const s = safeText(value);

    if (
        s.includes('超') ||
        s.includes('高') ||
        s.includes('🔥')
    ) {
        return '超想看';
    }

    if (
        s.includes('低') ||
        s.includes('有空')
    ) {
        return '有空再看';
    }

    return '想看';
}

function normalizeWishlistStatus(value) {

    const s = safeText(value);

    if (
        s.includes('完') ||
        s.includes('看完') ||
        s.toLowerCase().includes('completed')
    ) {
        return '已看完';
    }

    if (
        s.includes('放棄') ||
        s.includes('棄坑')
    ) {
        return '暫時放棄';
    }

    if (
        s.includes('一半') ||
        s.includes('途中')
    ) {
        return '看到一半';
    }

    if (
        s.includes('開始') ||
        s.includes('追劇中')
    ) {
        return '已開始';
    }

    return '待看';
}

function wishlistPriorityClass(priority) {

    if (priority === '超想看') {
        return 'bg-rose-100 text-rose-600';
    }

    if (priority === '有空再看') {
        return 'bg-stone-100 text-stone-500';
    }

    return 'bg-amber-100 text-amber-600';
}

function wishlistStatusClass(status) {

    if (status === '已看完') {
        return 'bg-emerald-100 text-emerald-700';
    }

    if (status === '已開始') {
        return 'bg-blue-100 text-blue-700';
    }

    if (status === '看到一半') {
        return 'bg-violet-100 text-violet-700';
    }

    if (status === '暫時放棄') {
        return 'bg-stone-200 text-stone-500';
    }

    return 'bg-rose-100 text-rose-600';
}

function toDateInputValue(value) {

    if (!value) return '';

    const d = parseDate(value);

    if (!d) {

        const raw = safeText(value);

        return /^\d{4}-\d{2}-\d{2}$/.test(raw)
            ? raw
            : '';
    }

    return `${
        d.getFullYear()
    }-${
        String(d.getMonth()+1).padStart(2,'0')
    }-${
        String(d.getDate()).padStart(2,'0')
    }`;
}

function formatWishlistDate(value) {

    const d = parseDate(value);

    return d
        ? formatDate(d)
        : safeText(value);
}

function App(){

    const [activeTab,setActiveTab] =
        useState('dramas');

    const [dramas,setDramas] = useState([]);
    const [wishlist,setWishlist] = useState([]);
    const [actors,setActors] = useState([]);

    const [headers,setHeaders] = useState({
        dramas: [],
        wishlist: [],
        actors: []
    });

    const [loading,setLoading] = useState(true);
    const [errors,setErrors] = useState([]);

    const [searchTerm,setSearchTerm] =
        useState('');

    const [selectedYear,setSelectedYear] =
        useState('全部');

    const [selectedStatus,setSelectedStatus] =
        useState('全部');

    const [viewMode,setViewMode] =
        useState('cards');

    const [selectedDrama,setSelectedDrama] =
        useState(null);

    const [toast,setToast] = useState('');
    const [refreshing,setRefreshing] = useState(false);


    async function loadAllData(showLoading = false){

        if (showLoading) {
            setLoading(true);
        }

        setRefreshing(true);

        const results = {};
        const newErrors = [];

        const jobs = [
            ['dramas','劇集資料讀取失敗',SHEET_URLS.dramas],
            ['wishlist','Wishlist 讀取失敗',SHEET_URLS.wishlist],
            ['actors','CP 資料讀取失敗',SHEET_URLS.actors]
        ];

        await Promise.all(
            jobs.map(
                async ([key,errorText,url]) => {

                    try {

                        results[key] =
                            await parseSheet(url);

                    } catch (error) {

                        console.error(
                            errorText,
                            error
                        );

                        results[key] = {
                            data: [],
                            headers: []
                        };

                        newErrors.push(errorText);
                    }
                }
            )
        );

        setDramas(
            results.dramas
                ? results.dramas.data
                : []
        );

        setWishlist(
            results.wishlist
                ? results.wishlist.data
                : []
        );

        setActors(
            results.actors
                ? results.actors.data
                : []
        );

        setHeaders({
            dramas:
                results.dramas
                ? results.dramas.headers
                : [],
            wishlist:
                results.wishlist
                ? results.wishlist.headers
                : [],
            actors:
                results.actors
                ? results.actors.headers
                : []
        });

        setErrors(newErrors);
        setLoading(false);
        setRefreshing(false);

        return newErrors.length === 0;
    }


    useEffect(() => {
        loadAllData(true);
    },[]);


    const years =
        useMemo(() => {

            const set = new Set();

            dramas.forEach(d => {

                const date =
                    parseDate(
                        d.premiere_date
                    );

                if (date) {
                    set.add(
                        date.getFullYear()
                    );
                }
            });

            return [
                '全部',
                ...Array.from(set)
                    .sort((a,b) => b-a)
                    .map(String)
            ];

        },[dramas]);


    const filteredDramas =
        useMemo(() => {

            const s =
                searchTerm
                    .trim()
                    .toLowerCase();

            return dramas.filter(d => {

                const zh =
                    safeText(
                        d.title_zh
                    ).toLowerCase();

                const th =
                    safeText(
                        d.title_th
                    ).toLowerCase();

                const cp =
                    safeText(
                        d.cp_name
                    ).toLowerCase();

                const matchSearch =
                    !s ||
                    zh.includes(s) ||
                    th.includes(s) ||
                    cp.includes(s);

                const date =
                    parseDate(
                        d.premiere_date
                    );

                const year =
                    date
                    ? String(
                        date.getFullYear()
                    )
                    : '未知年份';

                const matchYear =
                    selectedYear === '全部' ||
                    year === selectedYear;

                const status =
                    normalizeStatus(
                        d.ststus_type
                    );

                const matchStatus =
                    selectedStatus === '全部' ||
                    status === selectedStatus;

                return (
                    matchSearch &&
                    matchYear &&
                    matchStatus
                );
            });

        },[
            dramas,
            searchTerm,
            selectedYear,
            selectedStatus
        ]);


    const groupedByYear =
        useMemo(() => {

            const groups = {};

            filteredDramas.forEach(d => {

                const date =
                    parseDate(
                        d.premiere_date
                    );

                const y =
                    date
                    ? date.getFullYear()
                    : '未知年份';

                (groups[y] ||
                    (groups[y] = [])).push(d);
            });

            return Object.entries(groups)
                .sort((a,b) =>
                    a[0] === '未知年份'
                    ? 1
                    : b[0] === '未知年份'
                    ? -1
                    : Number(b[0]) - Number(a[0])
                );

        },[filteredDramas]);


    function openDrama(d){
        setSelectedDrama(d);
        document.body.classList.add('no-scroll');
    }


    function closeDrama(){
        setSelectedDrama(null);
        document.body.classList.remove('no-scroll');
    }


    useEffect(() => {

        if (errors.length) {

            setToast(
                errors.join('、')
            );

            const t =
                setTimeout(
                    () => setToast(''),
                    5000
                );

            return () => clearTimeout(t);
        }

    },[errors]);


    return <div className="min-h-screen pb-20">

ction className="mt-7"><SectionTitle>🔗 相關連結</SectionTitle><div className="flex flex-wrap gap-2">{drama.ott_link&&<ExternalLink href={drama.ott_link}>▶ {drama.ott_platform||drama.ott_plaform||'觀看平台'}</ExternalLink>}{drama.source_link&&<ExternalLink href={drama.source_link}>🔗 資料來源</ExternalLink>}</div></section><div className="h-5"/></div></div></div>}

/* =========================================================
   Wishlist
   Google Sheet：只管理 drama_id + Wishlist 自己的欄位
   Dramas：提供劇名、海報、CP、首播日、集數、連結等
========================================================= */
function Wishlist({
    wishlist,
    dramas,
    onOpenDrama
}) {

    const [edits,setEdits] =
        useState({});

    const [searchTerm,setSearchTerm] =
        useState('');

    const [statusFilter,setStatusFilter] =
        useState('全部');

    const [ownerFilter,setOwnerFilter] =
        useState('全部');

    const [priorityFilter,setPriorityFilter] =
        useState('全部');

    const [randomPick,setRandomPick] =
        useState(null);

    const [randomAnimating,setRandomAnimating] =
        useState(false);

    const [syncMessage,setSyncMessage] =
        useState('');


    /* -----------------------------------------------------
       Dramas 索引
    ----------------------------------------------------- */

    const dramaMap =
        useMemo(() => {

            const map = {};

            dramas.forEach(
                (drama,index) => {

                    const id =
                        safeText(drama.id);

                    if (id) {
                        map[id] = drama;
                    }

                    const dramaId =
                        safeText(drama.drama_id);

                    if (dramaId) {
                        map[dramaId] = drama;
                    }

                    map[`__row_${index+1}`] =
                        drama;
                }
            );

            return map;

        },[dramas]);


    /* -----------------------------------------------------
       Wishlist + Dramas
       Google Sheet 是主資料來源
    ----------------------------------------------------- */

    const mergedWishlist =
        useMemo(() => {

            return wishlist
                .map((item,index) => {

                    const key =
                        String(
                            item.id ||
                            `${item.drama_id || ''}|${item.owner || ''}|${index}`
                        );

                    const localEdits =
                        edits[key] || {};

                    const dramaId =
                        safeText(item.drama_id);

                    const drama =
                        dramaMap[dramaId];

                    return {
                        ...item,
                        ...localEdits,
                        _wishlistKey: key,
                        _drama: drama || null
                    };

                })
                .filter(
                    item => item._drama
                );

        },[
            wishlist,
            dramas,
            edits,
            dramaMap
        ]);


    /* -----------------------------------------------------
       搜尋＋篩選
    ----------------------------------------------------- */

    const filteredWishlist =
        useMemo(() => {

            const search =
                searchTerm
                    .trim()
                    .toLowerCase();

            return mergedWishlist.filter(
                item => {

                    const drama =
                        item._drama;

                    const titleZh =
                        safeText(
                            drama.title_zh
                        ).toLowerCase();

                    const titleTh =
                        safeText(
                            drama.title_th
                        ).toLowerCase();

                    const cp =
                        safeText(
                            drama.cp_name
                        ).toLowerCase();

                    const note =
                        safeText(
                            item.note
                        ).toLowerCase();

                    const owner =
                        safeText(item.owner);

                    const status =
                        normalizeWishlistStatus(
                            item.wishlist_status
                        );

                    const priority =
                        normalizeWishlistPriority(
                            item.priority
                        );

                    const matchesSearch =
                        !search ||
                        titleZh.includes(search) ||
                        titleTh.includes(search) ||
                        cp.includes(search) ||
                        note.includes(search);

                    const matchesStatus =
                        statusFilter === '全部' ||
                        status === statusFilter;

                    const matchesOwner =
                        ownerFilter === '全部' ||
                        owner === ownerFilter;

                    const matchesPriority =
                        priorityFilter === '全部' ||
                        priority === priorityFilter;

                    return (
                        matchesSearch &&
                        matchesStatus &&
                        matchesOwner &&
                        matchesPriority
                    );

                }
            );

        },[
            mergedWishlist,
            searchTerm,
            statusFilter,
            ownerFilter,
            priorityFilter
        ]);


    /* -----------------------------------------------------
       寫回 Google Sheet
    ----------------------------------------------------- */

    async function updateWishlistItem(
        item,
        patch
    ) {

        const key =
            item._wishlistKey;

        const dramaId =
            safeText(item.drama_id);

        if (!dramaId) {

            setSyncMessage(
                '⚠️ 這筆 Wishlist 沒有 drama_id，無法同步'
            );

            return;
        }


        /* 先更新畫面，讓操作立即有反應 */

        setEdits(previous => ({
            ...previous,
            [key]: {
                ...(previous[key] || {}),
                ...patch
            }
        }));


        setSyncMessage('☁️ 正在同步 Google Sheet...');


        const result =
            await syncWishlistToGoogleSheet({

function DataManager({

    onRefresh,
    onOpenDrama,
    showToast
}) {

    const [managerTab,setManagerTab] =
        useState('dramas');

    const [search,setSearch] =
        useState('');

    const [editing,setEditing] =
        useState(null);

    const [busy,setBusy] =
        useState(false);


    const config = {
        dramas: {
            label: '📺 Dramas',
            icon: '📺',
            addText: '＋ 新增劇集'
        },
        wishlist: {
            label: '🎁 Wishlist',
            icon: '🎁',
            addText: '＋ 新增待看'
        },
        actors: {
            label: '👩‍❤️‍👩 Actors / CP',
            icon: '👩‍❤️‍👩',
            addText: '＋ 新增 CP'
        }
    };


    const currentRows =
        data[managerTab] || [];

    const currentHeaders =
        headers[managerTab] || [];


    const dramaMap =
        useMemo(() => {

            const map = {};

            (data.dramas || []).forEach(
                drama => {

                    const id =
                        safeText(drama.id);

                    if (id) {
                        map[id] = drama;
                    }
                }
            );

            return map;

        },[data.dramas]);


    const filteredRows =
        useMemo(() => {

            const q =
                search
                    .trim()
                    .toLowerCase();

            if (!q) {
                return currentRows;
            }

            return currentRows.filter(row => {

                return Object.values(row).some(
                    value =>
                        safeText(value)
                            .toLowerCase()
                            .includes(q)
                );
            });

        },[currentRows,search]);


    function getRowTitle(row,index) {

        if (managerTab === 'dramas') {
            return (
                row.title_zh ||
                row.title_th ||
                `劇集 ${index + 1}`
            );
        }

        if (managerTab === 'wishlist') {

            const drama =
                dramaMap[
                    safeText(row.drama_id)
                ];

            return (
                drama && drama.title_zh
                    ? drama.title_zh
                    : `劇集 ID：${row.drama_id || '-'}`
            );
        }

        return (
            row.cp_name ||
            `${row.actor_1 || ''} × ${row.actor_2 || ''}` ||
            `CP ${index + 1}`
        );
    }


    function getKeyField() {
        return getPrimaryField(
            managerTab,
            currentHeaders
        );
    }


    function getKeyValue(row) {
        const key = getKeyField();
        return safeText(row[key]);
    }


    async function saveRecord(
        record,
        mode
    ) {

        setBusy(true);

        try {

            const keyField =
                getKeyField();

            const keyValue =
                mode === 'update'
                ? getKeyValue(record)
                : '';

            const action =
                mode === 'create'
                ? 'createRecord'
                : 'updateRecord';

            const payload = {
                action,
                sheet: managerTab,
                keyField,
                keyValue,
                record
            };

            const result =
                await syncToGoogleSheet(
                    payload
                );

            if (!result.success) {
                throw new Error(
                    result.message
                );
            }

            setEditing(null);

            showToast(
                mode === 'create'
                ? '✅ 已送出新增資料，正在重新同步...'
                : '✅ 已送出修改資料，正在重新同步...'
            );

            /*
              等待 Apps Script 寫入後重新讀取 CSV。
            */
            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1000
                    )
            );

            await onRefresh();

        } catch (error) {

            console.error(
                '資料儲存失敗',
                error
            );

            showToast(
                `❌ 儲存失敗：${error.message || '未知錯誤'}`
            );

        } finally {
            setBusy(false);
        }
    }


    async function deleteRecord(row) {

        const title =
            getRowTitle(
                row,
                currentRows.indexOf(row)
            );

        const confirmed =
            window.confirm(
                `確定要刪除「${title}」嗎？\n\n刪除後會直接從 Google Sheet 移除。`
            );

        if (!confirmed) {
            return;
        }

        setBusy(true);

        try {

            const keyField =
                getKeyField();

            const keyValue =
                getKeyValue(row);

            if (!keyValue) {
                throw new Error(
                    `找不到 ${keyField}，無法刪除`
                );
            }

            const result =
                await syncToGoogleSheet({
                    action: 'deleteRecord',
                    sheet: managerTab,
                    keyField,
                    keyValue
                });

            if (!result.success) {
                throw new Error(
                    result.message
                );
            }

            showToast(
                '🗑️ 已送出刪除，正在重新同步...'
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1000
                    )
            );

            await onRefresh();

        } catch (error) {

            console.error(
                '資料刪除失敗',
                error
            );

            showToast(
                `❌ 刪除失敗：${error.message || '未知錯誤'}`
            );

        } finally {
            setBusy(false);
        }
    }


    return (

        <section
            className="
                glass-card
                rounded-3xl
                p-5 md:p-7
                soft-shadow
            "
        >

            {/* Header */}

            <div
                className="
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    md:justify-between
                    gap-4
                    mb-6
                "
            >

                <div>

                    <h2
                        className="
                            text-xl md:text-2xl
                            font-bold
                            text-[#5C4033]
                        "
                    >
                        ⚙️ 網頁資料管理
                    </h2>

                    <p
                        className="
                            text-xs
                            text-stone-400
                            mt-1
                        "
                    >
                        在這裡直接新增、修改、刪除 Google Sheet 裡的資料
                    </p>

                </div>

                <button
                    disabled={busy}
                    onClick={async () => {

                        showToast(
                            '☁️ 正在重新讀取 Google Sheet...'
                        );

                        await onRefresh();

                    }}
                    className="
                        bg-stone-800
                        hover:bg-stone-700
                        disabled:opacity-50
                        text-white
                        px-4 py-2.5
                        rounded-xl
                        text-xs
                        transition
                    "
                >
                    🔄 重新同步
                </button>

            </div>


            {/* Tabs */}

            <div
                className="
                    flex
                    gap-2
                    overflow-x-auto
                    mb-5
                "
            >

                {Object.entries(config).map(
                    ([key,item]) => (

                        <button
                            key={key}
                            onClick={() => {
                                setManagerTab(key);
                                setSearch('');
                            }}
                            className={`
                                px-4 py-2.5
                                rounded-full
                                text-xs
                                whitespace-nowrap
                                border
                                transition
                                ${
                                    managerTab === key
                                    ? 'bg-[#D88A8A] text-white border-[#D88A8A]'
                                    : 'bg-white/70 text-stone-600 border-rose-100'
                                }
                            `}
                        >
                            {item.label}
                            <span className="ml-1 opacity-70">
                                ({(data[key] || []).length})
                            </span>
                        </button>

                    )
                )}

            </div>


            {/* Search + add */}

            <div
                className="
                    flex
                    flex-col
                    sm:flex-row
                    gap-2
                    mb-5
                "
            >

                <input
                    type="text"
                    value={search}
                    onChange={e =>
                        setSearch(
                            e.target.value
                        )
                    }
                    placeholder="🔍 搜尋目前資料..."
                    className="
                        flex-1
                        px-4 py-3
                        rounded-2xl
                        bg-white/80
                        border
                        border-rose-100
                        text-sm
                        focus:outline-none
                        focus:ring-2
                        focus:ring-rose-200
                    "
                />

                <button
                    disabled={busy}
                    onClick={() =>
                        setEditing({
                            sheet: managerTab,
                            mode: 'create',
                            record: {}
                        })
                    }
                    className="
                        bg-[#D88A8A]
                        hover:bg-[#c97878]
                        disabled:opacity-50
                        text-white
                        px-5 py-3
                        rounded-2xl
                        text-sm
                        font-medium
                        whitespace-nowrap
                        transition
                    "
                >
                    {config[managerTab].addText}
                </button>

            </div>


            {/* Data list */}

            {!filteredRows.length ? (

                <EmptyState
                    text="目前沒有符合條件的資料"
                />

            ) : (

                <div className="space-y-3">

                    {filteredRows.map(
                        (row,index) => {

                            const title =
                                getRowTitle(
                                    row,
                                    index
                                );

                            const keyField =
                                getKeyField();

                            const keyValue =
                                safeText(
                                    row[keyField]
                                );

                            const drama =
                                managerTab === 'wishlist'
                                ? dramaMap[
                                    safeText(
                                        row.drama_id
                                    )
                                ]
                                : null;

                            return (

                                <div
                                    key={
                                        keyValue ||
                                        index
                                    }
                                    className="
                                        bg-white/90
                                        border
                                        border-rose-100
                                        rounded-2xl
                                        p-4
                                    "
                                >

                                    <div
                                        className="
                                            flex
                                            flex-col
                                            md:flex-row
                                            md:items-center
                                            md:justify-between
                                            gap-3
                                        "
                                    >

                                        <div
                                            className="
                                                flex
                                                items-center
                                                gap-3
                                                min-w-0
                                            "
                                        >

                                            {managerTab === 'dramas' && (

                                                <ImageWithFallback
                                                    src={safeText(row.poster_url)}
                                                    fallback={DEFAULT_POSTER}
                                                    alt={title}
                                                    className="
                                                        w-14 h-20
                                                        object-cover
                                                        rounded-xl
                                                        flex-shrink-0
                                                    "
                                                />

                                            )}

                                            {managerTab === 'actors' && (

                                                <ImageWithFallback
                                                    src={safeText(row.photo_url)}
                                                    fallback={DEFAULT_ACTOR}
                                                    alt={title}
                                                    className="
                                                        w-14 h-14
                                                        object-cover
                                                        rounded-full
                                                        flex-shrink-0
                                                    "
                                                />

                                            )}

                                            {managerTab === 'wishlist' && (

                                                <ImageWithFallback
                                                    src={
                                                        drama
                                                        ? safeText(drama.poster_url)
                                                        : ''
                                                    }
                                                    fallback={DEFAULT_POSTER}
                                                    alt={title}
                                                    className="
                                                        w-14 h-20
                                                        object-cover
                                                        rounded-xl
                                                        flex-shrink-0
                                                    "
                                                />

                                            )}

                                            <div className="min-w-0">

                                                <div
                                                    className="
                                                        font-bold
                                                        text-[#5C4033]
                                                        truncate
                                                    "
                                                >
                                                    {title}
                                                </div>

                                                <div
                                                    className="
                                                        text-[10px]
                                                        text-stone-400
                                                        mt-1
                                                    "
                                                >
                                                    {keyField}：
                                                    {keyValue || '-'}
                                                </div>

                                                {managerTab === 'dramas' && (

                                                    <div
                                                        className="
                                                            text-xs
                                                            text-stone-500
                                                            mt-1
                                                        "
                                                    >
                                                        {row.cp_name || '未設定 CP'}
                                                        {' · '}
                                                        {normalizeStatus(row.ststus_type)}
                                                    </div>

                                                )}

                                                {managerTab === 'wishlist' && (

                                                    <div
                                                        className="
                                                            flex
                                                            flex-wrap
                                                            gap-1.5
                                                            mt-2
                                                        "
                                                    >

                                                        <span className={`text-[10px] px-2 py-1 rounded-full ${wishlistStatusClass(normalizeWishlistStatus(row.wishlist_status))}`}>
                                                            {normalizeWishlistStatus(row.wishlist_status)}
                                                        </span>

                                                        <span className={`text-[10px] px-2 py-1 rounded-full ${wishlistPriorityClass(normalizeWishlistPriority(row.priority))}`}>
                                                            {normalizeWishlistPriority(row.priority)}
                                                        </span>

                                                    </div>

                                                )}

                                                {managerTab === 'actors' && (

                                                    <div
                                                        className="
                                                            text-xs
                                                            text-stone-500
                                                            mt-1
                                                        "
                                                    >
                                                        {row.actor_1 || '-'}
                                                        {' × '}
                                                        {row.actor_2 || '-'}
                                                    </div>

                                                )}

                                            </div>

                                        </div>


                                        <div
                                            className="
                                                flex
                                                flex-wrap
                                                gap-2
                                            "
                                        >

                                            {managerTab === 'dramas' && (

                                                <button
                                                    onClick={() =>
                                                        onOpenDrama(row)
                                                    }
                                                    className="
                                                        px-3 py-2
                                                        rounded-xl
                                                        bg-rose-50
                                                        text-rose-600
                                                        text-xs
                                                        transition
                                                        hover:bg-rose-100
                                                    "
                                                >
                                                    👁️ 查看
                                                </button>

                                            )}

                                            {managerTab === 'wishlist' && drama && (

                                                <button
                                                    onClick={() =>
                                                        onOpenDrama(drama)
                                                    }
                                                    className="
                                                        px-3 py-2
                                                        rounded-xl
                                                        bg-rose-50
                                                        text-rose-600
                                                        text-xs
                                                        transition
                                                        hover:bg-rose-100
                                                    "
                                                >
                                                    👁️ 查看劇集
                                                </button>

                                            )}

                                            <button
                                                disabled={busy}
                                                onClick={() =>
                                                    setEditing({
                                                        sheet: managerTab,
                                                        mode: 'update',
                                                        record: {...row}
                                                    })
                                                }
                                                className="
                                                    px-3 py-2
                                                    rounded-xl
                                                    bg-indigo-50
                                                    text-indigo-600
                                                    text-xs
                                                    transition
                                                    hover:bg-indigo-100
                                                    disabled:opacity-50
                                                "
                                            >
                                                ✏️ 編輯
                                            </button>

                                            <button
                                                disabled={busy}
                                                onClick={() =>
                                                    deleteRecord(row)
                                                }
                                                className="
                                                    px-3 py-2
                                                    rounded-xl
                                                    bg-stone-100
                                                    text-stone-600
                                                    text-xs
                                                    transition
                                                    hover:bg-stone-200
                                                    disabled:opacity-50
                                                "
                                            >
                                                🗑️ 刪除
                                            </button>

                                        </div>

                                    </div>

                                </div>
                            );
                        }
                    )}

                </div>

            )}


            {busy && (

                <div
                    className="
                        mt-5
                        bg-rose-50
                        border
                        border-rose-100
                        rounded-2xl
                        p-3
                        text-xs
                        text-rose-600
                        text-center
                    "
                >
                    ☁️ 正在與 Google Sheet 同步，請不要連續按送出。
                </div>

            )}

        </section>


        {editing && (

            <RecordEditorModal
                sheet={editing.sheet}
                mode={editing.mode}
                record={editing.record}
                headers={headers[editing.sheet] || []}
                dramas={data.dramas || []}
                busy={busy}
                onClose={() => {
                    if (!busy) {
                        setEditing(null);
                    }
                }}
                onSave={saveRecord}
            />

        )}

        </>

    );
}


/* =========================================================
   Record Editor Modal
   依照 Google Sheet 目前欄位自動建立表單
========================================================= */

function RecordEditorModal({
    sheet,
    mode,
    record,
    headers,
    dramas,
    busy,
    onClose,
    onSave
}) {

    const visibleHeaders =
        headers.filter(
            field =>
                !isHiddenEditableField(field)
        );


    const [form,setForm] =
        useState(() => {

            const initial = {};

            visibleHeaders.forEach(
                field => {

                    const value =
                        record &&
                        record[field] !== undefined
                        ? record[field]
                        : defaultValueForField(
                            field,
                            sheet
                        );

                    initial[field] =
                        value === null ||
                        value === undefined
                        ? ''
                        : String(value);
                }
            );

            return initial;
        });


    function updateField(
        field,
        value
    ) {

        setForm(previous => ({
            ...previous,
            [field]: value
        }));
    }


    function handleSubmit(event) {

        event.preventDefault();

        const finalRecord = {
            ...record
        };

        visibleHeaders.forEach(
            field => {
                finalRecord[field] =
                    form[field] ?? '';
            }
        );

        if (
            sheet === 'wishlist' &&
            !safeText(finalRecord.drama_id)
        ) {

            window.alert(
                'Wishlist 必須選擇一部 Dramas 裡已存在的劇。'
            );

            return;
        }

        if (
            sheet === 'dramas' &&
            mode === 'create' &&
            !safeText(finalRecord.title_zh) &&
            !safeText(finalRecord.title_th)
        ) {

            window.alert(
                '新增劇集至少請填寫中文劇名或泰文劇名。'
            );

            return;
        }

        onSave(
            finalRecord,
            mode
        );
    }


    function renderField(field) {

        const value =
            form[field] ?? '';

        const isPrimary =
            field ===
            getPrimaryField(
                sheet,
                headers
            );

        const isLocked =
            mode === 'update' &&
            isPrimary;

        /* Wishlist drama_id 用 Dramas 下拉 */
        if (
            sheet === 'wishlist' &&
            field === 'drama_id'
        ) {

            return (

                <div
                    key={field}
                    className="md:col-span-2"
                >

                    <label
                        className="
                            block
                            text-xs
                            font-medium
                            text-stone-600
                            mb-1.5
                        "
                    >
                        {fieldLabel(field)}
                        <span className="text-rose-500 ml-1">
                            *
                        </span>
                    </label>

                    <select
                        value={value}
                        disabled={isLocked || busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="
                            w-full
                            px-3 py-2.5
                            rounded-xl
                            bg-white
                            border
                            border-rose-100
                            text-sm
                            outline-none
                        "
                    >

                        <option value="">
                            請選擇 Dramas 裡的劇集
                        </option>

                        {dramas.map(
                            (drama,index) => (

                                <option
                                    key={
                                        drama.id ||
                                        index
                                    }
                                    value={
                                        drama.id ||
                                        ''
                                    }
                                >
                                    {
                                        drama.title_zh ||
                                        drama.title_th ||
                                        drama.id
                                    }
                                    {' ['}
                                    {drama.id || '-'}
                                    {']'}
                                </option>

                            )
                        )}

                    </select>

                    <p
                        className="
                            text-[10px]
                            text-stone-400
                            mt-1
                        "
                    >
                        劇名、海報、CP、首播等資料會由 Dramas 自動帶入。
                    </p>

                </div>
            );
        }


        /* Boolean */
        if (isBooleanField(field)) {

            const checked =
                isWishlistYes(value);

            return (

                <label
                    key={field}
                    className="
                        flex
                        items-center
                        justify-between
                        gap-3
                        bg-white
                        border
                        border-rose-100
                        rounded-xl
                        px-3 py-3
                        cursor-pointer
                    "
                >

                    <span
                        className="
                            text-xs
                            font-medium
                            text-stone-600
                        "
                    >
                        {fieldLabel(field)}
                    </span>

                    <input
                        type="checkbox"
                        checked={checked}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.checked
                                ? 'TRUE'
                                : 'FALSE'
                            )
                        }
                        className="
                            w-4 h-4
                            accent-rose-400
                        "
                    />

                </label>
            );
        }


        /* Date */
        if (isDateField(field)) {

            return (

                <div key={field}>

                    <label
                        className="
                            block
                            text-xs
                            font-medium
                            text-stone-600
                            mb-1.5
                        "
                    >
                        {fieldLabel(field)}
                    </label>

                    <input
                        type="date"
                        value={toDateInputValue(value)}
                        disabled={isLocked || busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="
                            w-full
                            px-3 py-2.5
                            rounded-xl
                            bg-white
                            border
                            border-rose-100
                            text-sm
                            outline-none
                        "
                    />

                </div>
            );
        }


        /* Known selects */

        if (
            field === 'ststus_type' ||
            field === 'status_type'
        ) {

            return (

                <div key={field}>

                    <label
                        className="
                            block
                            text-xs
                            font-medium
                            text-stone-600
                            mb-1.5
                        "
                    >
                        {fieldLabel(field)}
                    </label>

                    <select
                        value={value}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="
                            w-full
                            px-3 py-2.5
                            rounded-xl
                            bg-white
                            border
                            border-rose-100
                            text-sm
                            outline-none
                        "
                    >

                        <option value="">
                            未分類
                        </option>

                        <option value="正在跟播">
                            正在跟播
                        </option>

                        <option value="待播中">
                            待播中
                        </option>

                        <option value="已完結">
                            已完結
                        </option>

                    </select>

                </div>
            );
        }


        if (field === 'wishlist_status') {

            return (

                <div key={field}>

                    <label className="block text-xs font-medium text-stone-600 mb-1.5">
                        {fieldLabel(field)}
                    </label>

                    <select
                        value={value}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="w-full px-3 py-2.5 rounded-xl bg-white border border-rose-100 text-sm outline-none"
                    >
                        <option value="待看">待看</option>
                        <option value="已開始">已開始</option>
                        <option value="看到一半">看到一半</option>
                        <option value="已看完">已看完</option>
                        <option value="暫時放棄">暫時放棄</option>
                    </select>

                </div>
            );
        }


        if (field === 'priority') {

            return (

                <div key={field}>

                    <label className="block text-xs font-medium text-stone-600 mb-1.5">
                        {fieldLabel(field)}
                    </label>

                    <select
                        value={value}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="w-full px-3 py-2.5 rounded-xl bg-white border border-rose-100 text-sm outline-none"
                    >
                        <option value="超想看">🔥 超想看</option>
                        <option value="想看">💗 想看</option>
                        <option value="有空再看">🌱 有空再看</option>
                    </select>

                </div>
            );
        }


        if (field === 'owner') {

            return (

                <div key={field}>

                    <label className="block text-xs font-medium text-stone-600 mb-1.5">
                        {fieldLabel(field)}
                    </label>

                    <select
                        value={value}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        className="w-full px-3 py-2.5 rounded-xl bg-white border border-rose-100 text-sm outline-none"
                    >
                        <option value="">未設定</option>
                        <option value="遙">遙</option>
                        <option value="錢">錢</option>
                        <option value="我">我</option>
                    </select>

                </div>
            );
        }


        /* Long text */
        if (isLongTextField(field)) {

            return (

                <div
                    key={field}
                    className="md:col-span-2"
                >

                    <label className="block text-xs font-medium text-stone-600 mb-1.5">
                        {fieldLabel(field)}
                    </label>

                    <textarea
                        value={value}
                        disabled={busy}
                        onChange={e =>
                            updateField(
                                field,
                                e.target.value
                            )
                        }
                        rows={4}
                        className="w-full px-3 py-2.5 rounded-xl bg-white border border-rose-100 text-sm outline-none resize-y"
                    />

                </div>
            );
        }


        let inputType = 'text';

        const lower =
            safeText(field).toLowerCase();

        if (lower.includes('url') || lower.includes('link')) {
            inputType = 'url';
        }

        if (
            lower.includes('progress') ||
            lower.includes('rating') ||
            lower === 'total_episodes'
        ) {
            inputType = 'number';
        }


        return (

            <div key={field}>

                <label className="block text-xs font-medium text-stone-600 mb-1.5">
                    {fieldLabel(field)}
                    {isLocked && (
                        <span className="ml-1 text-stone-300">
                            🔒
                        </span>
                    )}
                </label>

                <input
                    type={inputType}
                    value={value}
                    disabled={isLocked || busy}
                    onChange={e =>
                        updateField(
                            field,
                            e.target.value
                        )
                    }
                    className={`
                        w-full
                        px-3 py-2.5
                        rounded-xl
                        border
                        text-sm
                        outline-none
                        ${
                            isLocked
                            ? 'bg-stone-100 border-stone-100 text-stone-400'
                            : 'bg-white border-rose-100'
                        }
                    `}
                />

            </div>
        );
    }


    return (

        <div
            className="
                fixed inset-0 z-[90]
                modal-backdrop
                flex items-end md:items-center
                justify-center
                p-0 md:p-5
            "
        >

            <div
                className="
                    modal-panel
                    w-full
                    md:max-w-4xl
                    max-h-[100vh]
                    md:max-h-[92vh]
                    bg-[#FDFBF7]
                    md:rounded-3xl
                    shadow-2xl
                    overflow-hidden
                    flex flex-col
                "
            >

                {/* Header */}

                <div
                    className="
                        sticky top-0 z-10
                        bg-white/95
                        backdrop-blur
                        border-b
                        border-rose-100
                        px-4 md:px-6
                        py-3
                        flex
                        items-center
                        justify-between
                    "
                >

                    <div>

                        <h2
                            className="
                                text-lg
                                font-bold
                                text-[#5C4033]
                            "
                        >
                            {mode === 'create'
                                ? '＋ 新增'
                                : '✏️ 編輯'
                            }
                            {' '}
                            {
                                sheet === 'dramas'
                                ? '劇集'
                                : sheet === 'wishlist'
                                ? 'Wishlist'
                                : 'CP / Actors'
                            }
                        </h2>

                        <p
                            className="
                                text-[10px]
                                text-stone-400
                                mt-0.5
                            "
                        >
                            {mode === 'create'
                                ? '填寫後直接新增到 Google Sheet'
                                : '修改後直接更新 Google Sheet'
                            }
                        </p>

                    </div>

                    <button
                        onClick={onClose}
                        disabled={busy}
                        className="w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 disabled:opacity-50 flex items-center justify-center text-lg"
                    >
                        ×
                    </button>

                </div>


                {/* Body */}

                <form
                    onSubmit={handleSubmit}
                    className="overflow-y-auto p-4 md:p-6"
                >

                    <div
                        className="
                            grid
                            grid-cols-1
                            md:grid-cols-2
                            gap-3
                        "
                    >

                        {visibleHeaders.map(
                            renderField
                        )}

                    </div>

                    {!visibleHeaders.length && (

                        <EmptyState
                            text="Google Sheet 沒有可編輯欄位"
                        />

                    )}


                    <div
                        className="
                            mt-6
                            flex
                            flex-col
                            sm:flex-row
                            justify-end
                            gap-2
                            border-t
                            border-rose-100
                            pt-4
                        "
                    >

                        <button
                            type="button"
                            onClick={onClose}
                            disabled={busy}
                            className="
                                px-5 py-2.5
                                rounded-xl
                                bg-stone-100
                                text-stone-600
                                text-sm
                                disabled:opacity-50
                            "
                        >
                            取消
                        </button>

                        <button
                            type="submit"
                            disabled={busy}
                            className="
                                px-6 py-2.5
                                rounded-xl
                                bg-[#D88A8A]
                                hover:bg-[#c97878]
                                text-white
                                text-sm
                                font-medium
                                disabled:opacity-50
                            "
                        >
                            {busy
                                ? '☁️ 同步中...'
                                : mode === 'create'
                                ? '＋ 新增並同步'
                                : '💾 儲存並同步'
                            }
                        </button>

                    </div>

                </form>

            </div>

        </div>
    );
}


function Actors({actors}){return <section><div className="mb-5"><h2 className="text-xl font-bold text-[#5C4033]">👩‍❤️‍👩 CP 專區</h2><p className="text-xs text-stone-400 mt-1">泰百 CP 與雙人收藏</p></div>{!actors.length?<EmptyState text="目前沒有 CP 資料"/>:<div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">{actors.map((a,i)=>{const mine=String(a.my_favorite||'').toUpperCase()==='TRUE',friend=String(a.friend_favorite||'').toUpperCase()==='TRUE';return <div key={i} className="glass-card rounded-3xl overflow-hidden shadow-sm text-center p-5"><ImageWithFallback src={safeText(a.photo_url)} fallback={DEFAULT_ACTOR} alt={a.cp_name} className="w-28 h-28 mx-auto rounded-full object-cover shadow-md border-2 border-white"/><h3 className="text-lg font-bold text-[#5C4033] mt-4">{a.cp_name}</h3><p className="text-xs text-stone-500 mt-1">{a.actor_1} & {a.actor_2}</p><div className="mt-5 grid grid-cols-2 gap-2"><span className={`px-2 py-2 rounded-xl text-[10px] font-medium ${mine?'bg-rose-100 text-rose-600':'bg-stone-100 text-stone-400'}`}>{mine?'💖 遙喜歡':'🤍 遙未加入'}</span><span className={`px-2 py-2 rounded-xl text-[10px] font-medium ${friend?'bg-indigo-100 text-indigo-600':'bg-stone-100 text-stone-400'}`}>{friend?'💙 錢喜歡':'🤍 錢未加入'}</span></div></div>})}</div>}</section>}
function MobileNav({icon,label,active,onClick}){return <button onClick={onClick} className={`flex flex-col items-center justify-center gap-0.5 px-5 py-1.5 rounded-xl ${active?'text-rose-500':'text-stone-400'}`}><span className="text-lg">{icon}</span><span className="text-[10px]">{label}</span></button>}
function EmptyState({text}){return <div className="glass-card rounded-3xl p-12 text-center text-stone-400">🌸 {text}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
