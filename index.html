/* ===== Final visual polish ===== */
:root{--radius:20px;--shadow:0 10px 28px rgba(92,64,51,.08)}
.shell{max-width:1320px;padding:28px 22px 90px}
.topbar{padding:4px 2px 2px;margin-bottom:20px}
.brand-mark{width:50px;height:50px;border-radius:17px}
.brand h1{font-size:23px;letter-spacing:.01em}
.nav{gap:8px;margin-bottom:22px}
.nav-btn{padding:10px 16px;background:rgba(255,255,255,.88);border-color:#ecdede}
.nav-btn.active{box-shadow:0 6px 18px rgba(216,138,138,.18)}
.section-head{margin:10px 0 16px}
.section-head h2{font-size:25px;letter-spacing:-.02em;color:var(--text)}
.section-head p{color:var(--muted);font-size:13px}
.card,.panel,.modal-card{border:1px solid rgba(232,213,213,.72);box-shadow:var(--shadow)}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(92,64,51,.11);border-color:#e7caca}
.grid{gap:16px}
.cp-grid{gap:18px}
.cp-card{overflow:hidden}
.cp-card .cp-avatar-wrap{margin:18px auto 10px}
.cp-card .cp-name{font-size:18px;font-weight:900;color:var(--text)}
.cp-card .cp-meta{line-height:1.65}
.badge{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
.btn{border-radius:12px;font-weight:800;transition:.16s}
.btn:hover{transform:translateY(-1px)}
.modal{backdrop-filter:blur(7px);background:rgba(54,40,35,.38)}

<body>
<div id="app"><div class="shell"><section class="panel loading"><div class="spinner"></div><div class="muted">🌸 泰百追劇宇宙正在啟動…</div></section></div></div>
<div id="toastWrap" aria-live="polite" aria-atomic="true"></div>
<script>
(function(){
'use strict';

const GAS_URL='https://script.google.com/macros/s/AKfycby5IWKfG-X7-M-xvIri5LgWAf4IBz6ISIB9sIM8BzmsQ20CqGUAy9FBwcT6rBp3I6BY/exec';
const H_COLOR='#F37021',Q_COLOR='#777777';
const STATUS=['已完結','正在跟播','待播中'];
const CP_STATUS=['活躍','暫停','已結束','其他'];
const WATCH_STATUS=['未開始','追劇中','已看完','暫停','棄坑'];
const PRIORITY=['高','中','低','想看'];
const WISHLIST_STATUS=['待看','已看','取消','規劃中'];
const WEEK=['週日','週一','週二','週三','週四','週五','週六'];
const H_WEEK=['週一','週二','週三','週四','週五','週六','週日'];
const SHEETS=['dramas','wishlist','actors','members','dolls'];
const LABELS={home:'總覽',dramas:'劇集',wishlist:'Wishlist',actors:'CP',dolls:'娃娃',timeline:'時間軸',members:'成員'};
const SCHEMA={
 dramas:['id','title_zh','title_th','cp_name','ststus_type','premiere_date','air_day_of_week','air_time','total_episodes','synopsis','ott_platform','ott_link','poster_url','my_status','my_progress','my_rating','my_review','friend_status','friend_progress','friend_rating','friend_review','song_1_name','song_1_link','song_2_name','song_2_link','song_3_name','song_3_link','song_4_name','song_4_link','song_5_name','song_5_link','source_link'],
 wishlist:['drama_id','owner','my_want','friend_want','priority','wishlist_status','added_date','planned_watch_date','note'],
 actors:['cp_name','actor_1','actor_2','photo_url','my_favorite','friend_favorite','cp_name_th','cp_name_en','cp_status','cp_start_date','cp_anniversary','first_work','representative_work','cp_description','cp_color','cp_note','member_1_id','member_2_id','id','actor_1_th','actor_2_th','status','start_date','anniversary','description','note'],
 members:['member_id','display_name','name_zh','name_th','name_en','nickname','birth_date','birth_place','nationality','zodiac','height','weight','occupation','debut_year','company','agency','brand','bio','representative_works','representative_roles','awards','hobby','skill','favorite_food','disliked_food','favorite_color','favorite_music','favorite_movie','pet','personality','photo_url','photo_url_2','photo_url_3','instagram','x','tiktok','facebook','youtube','website','my_favorite','favorite_date','my_note','support_color','id','works_roles','hobbies_skills','pets','photo_1','photo_2','photo_3'],
 dolls:['doll_id','doll_name','owner_member_id','doll_type','doll_color','photo_url','birth_date','description','favorite','note']
};
const LABEL={
 id:'ID',drama_id:'劇集 ID',owner:'建立者',title_zh:'中文劇名',title_th:'泰文／英文劇名',cp_name:'CP 英文名稱',ststus_type:'劇集狀態',premiere_date:'首播日期',air_day_of_week:'播出星期',air_time:'播出時間（泰國時間）',total_episodes:'總集數',synopsis:'劇情簡介',ott_platform:'OTT 平台',ott_link:'OTT 連結',poster_url:'海報圖片 URL',source_link:'來源連結',my_status:'我的觀看狀態',my_progress:'我的進度',my_rating:'我的評分',my_review:'我的心得',friend_status:'朋友觀看狀態',friend_progress:'朋友進度',friend_rating:'朋友評分',friend_review:'朋友心得',
 song_1_name:'主題曲名稱',song_1_link:'主題曲連結',song_2_name:'插曲 2 名稱',song_2_link:'插曲 2 連結',song_3_name:'插曲 3 名稱',song_3_link:'插曲 3 連結',song_4_name:'插曲 4 名稱',song_4_link:'插曲 4 連結',song_5_name:'插曲 5 名稱',song_5_link:'插曲 5 連結',
 my_want:'我想看',friend_want:'朋友想看',priority:'優先度',wishlist_status:'清單狀態',added_date:'加入日期',planned_watch_date:'預計觀看日期',note:'備註',
 actor_1:'第一位成員英文名',actor_2:'第二位成員英文名',actor_1_th:'第一位成員泰文名',actor_2_th:'第二位成員泰文名',photo_url:'照片 URL',my_favorite:'我喜歡',friend_favorite:'朋友喜歡',cp_name_th:'CP 泰文名（Sheet）',cp_name_en:'CP 英文名',cp_status:'CP 現況',cp_start_date:'CP 開始日期',cp_anniversary:'CP 紀念日',first_work:'首次合作作品',representative_work:'代表作品',cp_description:'CP 描述',cp_color:'CP 顏色',cp_note:'CP 備註',member_1_id:'第一位成員 ID',member_2_id:'第二位成員 ID',status:'狀態（相容欄）',start_date:'開始日期（相容欄）',anniversary:'紀念日（相容欄）',description:'描述（相容欄）',
 member_id:'成員 ID',display_name:'顯示名稱（Sheet）',name_zh:'中文名（Sheet）',name_th:'泰文名（Sheet）',name_en:'英文名',nickname:'暱稱',birth_date:'出生日期',birth_place:'出生地',nationality:'國籍',zodiac:'星座',height:'身高',weight:'體重',occupation:'職業',debut_year:'出道年份',company:'公司',agency:'經紀公司',brand:'品牌',bio:'個人介紹',representative_works:'代表作品',representative_roles:'代表角色',awards:'得獎',hobby:'興趣',skill:'專長',favorite_food:'喜歡的食物',disliked_food:'不喜歡的食物',favorite_color:'喜歡的顏色',favorite_music:'喜歡的音樂',favorite_movie:'喜歡的電影',pet:'寵物',personality:'個性',quote:'名言／語錄',personal_note:'個人備註',photo_url_2:'照片 2',photo_url_3:'照片 3',instagram:'Instagram',x:'X',facebook:'Facebook',youtube:'YouTube',tiktok:'TikTok',website:'Website',my_favorite:'我的收藏',favorite_date:'收藏日期',my_rating:'我的評分',my_note:'我的備註',support_color:'應援色',works_roles:'作品／角色（相容欄）',hobbies_skills:'興趣／專長（相容欄）',pets:'寵物（相容欄）',photo_1:'照片 1（相容欄）',photo_2:'照片 2（相容欄）',photo_3:'照片 3（相容欄）',
 doll_id:'娃娃 ID',doll_name:'娃娃名稱',owner_member_id:'所屬成員 ID',doll_type:'娃娃類型',doll_color:'娃娃顏色',favorite:'收藏'
};
const LONG_FIELDS=new Set(['synopsis','source_link','my_review','friend_review','description','note','bio','representative_works','representative_roles','awards','hobby','skill','favorite_music','favorite_movie','pets','personality','quote','personal_note','my_note']);
const state={data:{dramas:[],wishlist:[],actors:[],members:[],dolls:[]},loading:true,active:'home',search:'',year:'全部',status:'全部',modal:null,calendar:new Date(),calendarSelected:null,randomDrama:null,adminSheet:'dramas',errors:[],lastSync:null};
let refreshPromise=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function text(v){return v===null||v===undefined?'':String(v);}
function clean(v){return text(v).trim();}
function has(v){return clean(v)!=='';}
function num(v){const n=Number(text(v).replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0;}
function bool(v){const s=clean(v).toLowerCase();return v===true||['true','1','yes','y','是','有','想看','喜歡'].includes(s);}
function uid(prefix){return prefix+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100);}
function dateObj(v){if(!has(v))return null;if(v instanceof Date)return Number.isNaN(v.getTime())?null:new Date(v);let s=clean(v);let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(!m)m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})/);if(!m)return null;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return Number.isNaN(d.getTime())?null:d;}
function iso(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function fmt(d){return d?d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):'—';}
function fmtMD(d){return d?String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):'—';}
function status(v){const s=clean(v);if(s.includes('完')||s.toLowerCase().includes('completed'))return'已完結';if(s.includes('待')||s.toLowerCase().includes('upcoming'))return'待播中';if(s.includes('播')||s.toLowerCase().includes('airing'))return'正在跟播';return s||'未分類';}
function statusBadge(v){const s=status(v);return '<span class="badge '+(s==='正在跟播'?'b-airing':s==='待播中'?'b-upcoming':s==='已完結'?'b-ended':'b-pink')+'">'+esc(s)+'</span>';}
function weekdayNum(v){const s=clean(v);for(let i=0;i<7;i++){if(s.includes(WEEK[i])||s.includes('星期'+['日','一','二','三','四','五','六'][i])||s.includes('週'+['日','一','二','三','四','五','六'][i])||s.includes('周'+['日','一','二','三','四','五','六'][i]))return i;}return null;}
function episodeDate(drama,ep){const p=dateObj(drama.premiere_date);if(!p)return null;const d=new Date(p);d.setDate(d.getDate()+(Math.max(1,ep)-1)*7);return d;}
function schedule(drama){const total=num(drama.total_episodes);if(!total||!dateObj(drama.premiere_date))return[];return Array.from({length:total},function(_,i){return{episode:i+1,date:episodeDate(drama,i+1),time:clean(drama.air_time)};});}
function nextAir(drama){const s=status(drama.ststus_type);if(s==='已完結')return null;const total=num(drama.total_episodes);if(!total)return null;const progress=Math.max(num(drama.my_progress),num(drama.my_propress),num(drama.friend_progress),num(drama.friend_propress));if(progress>=total)return null;let ep=Math.max(1,progress+1),d=episodeDate(drama,ep),today=new Date();today.setHours(0,0,0,0);if(d&&progress===0&&d<today){const all=schedule(drama);const found=all.find(x=>x.date>=today);if(found){ep=found.episode;d=found.date;}}return d?{episode:ep,date:d,time:clean(drama.air_time)}:null;}
function titleOf(d){return clean(d.title_zh)||clean(d.title_th)||'未命名劇集';}
function findMember(id){const key=clean(id);if(!key)return null;return state.data.members.find(function(m){return clean(m.member_id||m.id)===key;})||null;}
function findDrama(id){const key=clean(id);if(!key)return null;return state.data.dramas.find(function(d){return clean(d.id||d.drama_id)===key;})||null;}

// GAS API
async function api(action,payload={}){
  try{
    const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
    const json=await res.json();
    if(!json.success)throw new Error(json.message||'操作失敗');
    return json;
  }catch(err){
    console.error('API Error:',err);
    throw err;
  }
}

async function fetchData(){
  if(refreshPromise)return refreshPromise;
  state.loading=true;
  render();
  refreshPromise=(async()=>{
    try{
      const res=await fetch(GAS_URL+'?action=getAll');
      const json=await res.json();
      if(json.success && json.data){
        SHEETS.forEach(s=>{if(json.data[s])state.data[s]=json.data[s];});
        state.lastSync=new Date();
      }
    }catch(err){
      console.error('Fetch Error:',err);
    }finally{
      state.loading=false;
      refreshPromise=null;
      render();
    }
  })();
  return refreshPromise;
}

function render(){
  const app=document.getElementById('app');
  if(!app)return;
  if(state.loading && !state.lastSync){
    app.innerHTML=`<div class="shell"><section class="panel loading"><div class="spinner"></div><div class="muted">🌸 泰百追劇宇宙正在啟動…</div></section></div>`;
    return;
  }
  
  let navHtml=Object.keys(LABELS).map(k=>`<button class="nav-btn ${state.active===k?'active':''}" onclick="switchTab('${k}')">${LABELS[k]}</button>`).join('');
  let bottomNavHtml=Object.keys(LABELS).map(k=>`<button class="${state.active===k?'active':''}" onclick="switchTab('${k}')">${LABELS[k]}</button>`).join('');

  app.innerHTML=`
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">🌸</div>
          <div>
            <h1>泰百劇宇宙</h1>
            <p>GL Drama Universe & Tracker</p>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-light" onclick="fetchData()"><span class="refresh-text">重新整理</span> 🔄</button>
        </div>
      </div>
      <div class="nav">${navHtml}</div>
      <main id="mainContent">${renderContent()}</main>
    </div>
    <div class="bottom-nav">${bottomNavHtml}</div>
    ${state.modal?renderModal():''}
  `;
}

function switchTab(tab){
  state.active=tab;
  render();
}

function renderContent(){
  switch(state.active){
    case 'home': return renderHome();
    case 'dramas': return renderDramas();
    case 'wishlist': return renderWishlist();
    case 'actors': return renderActors();
    case 'dolls': return renderDolls();
    case 'timeline': return renderTimeline();
    case 'members': return renderMembers();
    default: return renderHome();
  }
}

function renderHome(){
  const totalDramas=state.data.dramas.length;
  const airingDramas=state.data.dramas.filter(d=>status(d.ststus_type)==='正在跟播').length;
  const totalCP=state.data.actors.length;
  const totalMembers=state.data.members.length;
  const totalDolls=state.data.dolls.length;

  return `
    <section class="panel hero">
      <div class="hero-row">
        <div>
          <h2>歡迎來到泰百劇宇宙 ✨</h2>
          <p>追劇進度、CP 動態、成員與周邊娃娃全方位記錄！</p>
        </div>
      </div>
    </section>
    <div class="stats-grid" style="margin-bottom:18px;">
      <div class="stat"><span>總劇集數</span><b>${totalDramas}</b></div>
      <div class="stat"><span>正在跟播</span><b>${airingDramas}</b></div>
      <div class="stat"><span>CP 組合</span><b>${totalCP}</b></div>
      <div class="stat"><span>成員資料</span><b>${totalMembers}</b></div>
      <div class="stat"><span>官方娃娃</span><b>${totalDolls}</b></div>
    </div>
    ${renderAiringSchedule()}
  `;
}

function renderAiringSchedule(){
  const airingList=state.data.dramas.filter(d=>status(d.ststus_type)==='正在跟播');
  if(!airingList.length) return `<div class="card panel schedule"><div class="section-title"><h3>本週跟播日程</h3></div><div class="empty">目前沒有正在跟播的劇集</div></div>`;

  return `
    <div class="card panel schedule">
      <div class="section-title"><h3>本週跟播日程</h3></div>
      <div class="week-grid">
        ${H_WEEK.map(dayName=>{
          const matched=airingList.filter(d=>(d.air_day_of_week||'').includes(dayName.replace('週','')));
          return `
            <div class="day">
              <div class="day-head"><span>${dayName}</span></div>${matched.map(d=>`
                <button class="show-mini" onclick="openDetail('dramas','${d.id}')">
                  <b>${esc(titleOf(d))}</b>
                  <span>${esc(d.air_time||'已更新')}</span>
                </button>
              `).join('')}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderDramas(){
  let list=state.data.dramas;
  if(state.search){
    const q=state.search.toLowerCase();
    list=list.filter(d=>titleOf(d).toLowerCase().includes(q)||(d.cp_name||'').toLowerCase().includes(q));
  }

  return `
    <div class="toolbar">
      <input type="text" class="input" placeholder="搜尋劇名、CP..." value="${esc(state.search)}" oninput="state.search=this.value;render();">
    </div>
    <div class="drama-grid">
      ${list.map(d=>`
        <div class="drama-card ${d.poster_url?'':'no-poster'}" onclick="openDetail('dramas','${d.id}')">
          ${d.poster_url?`<div class="poster"><img src="${esc(d.poster_url)}" alt="poster"></div>`:''}
          <div>
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <h4 style="margin:0;font-size:16px;">${esc(titleOf(d))}</h4>${statusBadge(d.ststus_type)}
            </div>
            <div class="meta-line">CP：${esc(d.cp_name||'無')}</div>
            <div class="meta-line">首播：${esc(fmt(dateObj(d.premiere_date)))}</div>
            <div class="progress-grid">
              <div class="progress-box h-box">
                <div class="progress-label">我</div>
                <div class="progress-number">EP.${num(d.my_progress)} /${num(d.total_episodes)||'?'}</div>
              </div>
              <div class="progress-box q-box">
                <div class="progress-label">朋友</div>
                <div class="progress-number">EP.${num(d.friend_progress)} /${num(d.total_episodes)||'?'}</div>
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderWishlist(){
  return `<div class="card panel" style="padding:20px;"><div class="section-title"><h3>追劇 Wishlist</h3></div><div class="empty">Wishlist 清單功能載入中...</div></div>`;
}

function renderActors(){
  return `
    <div class="cp-grid">
      ${state.data.actors.map(cp=>`
        <div class="cp-card" onclick="openDetail('actors','${cp.id||cp.cp_name}')">
          <div class="cp-top">
            <div class="cp-avatar-wrap">
              <div class="cp-avatar">
                ${cp.photo_url?`<img src="${esc(cp.photo_url)}" alt="cp">`:'<div style="padding:40px;text-align:center;color:#aaa;">無照片</div>'}
              </div>
            </div>
          </div>
          <div class="cp-body">
            <div class="cp-name">${esc(cp.cp_name||'CP 組合')}</div>
            <div class="sub">${esc(cp.actor_1\vert{}\vert{}'')} &${esc(cp.actor_2||'')}</div>
            <div class="two-status">
              <div class="favorite h-fav">我：${bool(cp.my_favorite)?'❤️ 喜愛':'—'}</div>
              <div class="favorite q-fav">朋友：${bool(cp.friend_favorite)?'❤️ 喜愛':'—'}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDolls(){
  return `
    <div class="doll-grid">
      ${state.data.dolls.map(doll=>`
        <div class="doll-card" onclick="openDetail('dolls','${doll.doll_id}')">
          <div class="doll-photo">
            ${doll.photo_url?`<img src="${esc(doll.photo_url)}" alt="doll">`:'<div style="padding:40px;text-align:center;color:#aaa;">無照片</div>'}
          </div>
          <div class="doll-body">
            <div class="doll-name">${esc(doll.doll_name||'官方娃娃')}</div>
            <div class="sub">類型：${esc(doll.doll_type||'週邊')}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTimeline(){
  return `<div class="card panel" style="padding:20px;"><div class="section-title"><h3>時間軸</h3></div><div class="empty">時間軸規劃中...</div></div>`;
}

function renderMembers(){
  return `
    <div class="grid grid-3">
      ${state.data.members.map(m=>`
        <div class="card member-card" onclick="openDetail('members','${m.member_id||m.id}')">
          <div class="member-head">
            <div class="avatar">
              ${m.photo_url?`<img src="${esc(m.photo_url)}" alt="member">`:'<div style="padding:20px;text-align:center;color:#aaa;">無照片</div>'}
            </div>
            <div>
              <div class="member-name">${esc(m.display_name||m.name_en||'成員')}</div>
              <div class="sub">${esc(m.nickname||'')}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function openDetail(sheet,id){
  let item=null;
  if(sheet==='dramas') item=findDrama(id);
  else if(sheet==='actors') item=state.data.actors.find(a=>(a.id||a.cp_name)===id);
  else if(sheet==='members') item=findMember(id);
  else if(sheet==='dolls') item=state.data.dolls.find(d=>d.doll_id===id);

  if(!item)return;
  state.modal={sheet,item};
  render();
}

function closeModal(){
  state.modal=null;
  render();
}

function renderModal(){
  if(!state.modal)return '';
  const {sheet,item}=state.modal;
  
  return `
    <div class="modal-root" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>${esc(item.title_zh||item.cp_name||item.display_name||item.doll_name||'詳細資訊')}</h3>
          <button class="close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="info-grid">
            ${Object.keys(item).map(k=>`
              <div class="info">
                <b>${esc(LABEL[k]||k)}</b>
                <span>${esc(text(item[k])||'—')}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" onclick="closeModal()">關閉</button>
        </div>
      </div>
    </div>
  `;
}

window.switchTab=switchTab;
window.fetchData=fetchData;
window.openDetail=openDetail;
window.closeModal=closeModal;

fetchData();
})();
</script>
</body>
</html>
