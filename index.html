<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>✨ 我們的泰百追劇宇宙</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                cream: '#FDFBF7',
                cardBg: 'rgba(255,255,255,.82)',
                accentPink: '#D88A8A',
                accentSoft: '#F9E4E4',
                textDark: '#4A403A'
            }
        }
    }
}
</script>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 10% 10%, rgba(249,228,228,.65), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(235,225,245,.45), transparent 25%),
        #FDFBF7;
    color: #4A403A;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
}

button, input, select {
    font: inherit;
}

.glass-card {
    background: rgba(255,255,255,.80);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(232,165,165,.25);
}

.soft-shadow {
    box-shadow: 0 8px 30px rgba(92,64,51,.06);
}

.poster {
    background: linear-gradient(135deg,#f3eeee,#e9e3e0);
}

/* =========================
   Scrollbar
========================= */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-thumb {
    background: #dfb2b2;
    border-radius: 999px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

/* =========================
   Modal
========================= */
.modal-backdrop {
    background: rgba(55,42,36,.55);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

.modal-panel {
    animation: modalIn .22s ease-out;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   Mobile Bottom Nav Display Control
========================= */
@media (max-width: 767px) {
    body {
        padding-bottom: 85px;
    }
    .mobile-bottom-nav {
        display: flex;
    }
    .desktop-nav {
        display: none;
    }
}

@media (min-width: 768px) {
    .mobile-bottom-nav {
        display: none;
    }
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useMemo } = React;

const SHEET_URLS = {
    dramas: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=0&single=true&output=csv',
    wishlist: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=216341491&single=true&output=csv',
    actors: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=832417858&single=true&output=csv'
};

const DEFAULT_POSTER = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800';
const DEFAULT_ACTOR = 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500';

function safeText(value) {
    if (value === undefined || value === null || value === '') return '';
    return String(value).trim();
}

function normalizeSheetHeader(header) {
    return safeText(header).toLowerCase().replace(/\s+/g, '_');
}

function firstFilledField(row, keys) {
    for (const key of keys) {
        if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
            return String(row[key]).trim();
        }
    }
    return '';
}

function normalizeStatus(status) {
    const s = safeText(status);
    if (s.includes('跟播') || s.includes('播放中') || s.toLowerCase().includes('airing')) return '正在跟播';
    if (s.includes('待播') || s.includes('未播') || s.toLowerCase().includes('upcoming')) return '待播中';
    if (s.includes('完結') || s.includes('已完') || s.toLowerCase().includes('completed')) return '已完結';
    return s || '未分類';
}

function statusClass(status) {
    if (status === '正在跟播') return 'bg-emerald-100 text-emerald-700';
    if (status === '待播中') return 'bg-blue-100 text-blue-700';
    if (status === '已完結') return 'bg-stone-100 text-stone-600';
    return 'bg-rose-100 text-rose-600';
}

function normalizeDramaImageFields(row) {
    const poster = firstFilledField(row, ['poster_url', 'poster', 'poster_link', 'poster_image', 'cover_url', 'cover_image', 'image_url', 'image', '封面', '海報', '海报']);
    return { ...row, poster_url: safeText(poster) };
}

function normalizeActorImageFields(row) {
    const photo = firstFilledField(row, ['photo_url', 'actor_photo_url', 'cp_photo_url', 'profile_image', 'avatar_url', 'image_url', 'photo', 'image', '照片', '頭像', '头像']);
    return { ...row, photo_url: safeText(photo) };
}

function getImageCandidates(value) {
    const original = safeText(value);
    if (!original) return [];
    const candidates = [original];
    let fileId = '';
    try {
        const parsed = new URL(original, window.location.href);
        const host = parsed.hostname.toLowerCase();
        if (host === 'drive.google.com') {
            const pathMatch = parsed.pathname.match(/\/file\/d\/([^/]+)/i) || parsed.pathname.match(/\/d\/([^/]+)/i);
            fileId = (parsed.searchParams.get('id') || (pathMatch && pathMatch[1]) || '').trim();
        }
    } catch (e) {}
    if (fileId) {
        candidates.push(`https://drive.google.com/thumbnail?id=${encodeURIComponent(fileId)}&sz=w1200`);
        candidates.push(`https://lh3.googleusercontent.com/d/${encodeURIComponent(fileId)}=w1200`);
    }
    return [...new Set(candidates)];
}

function ImageWithFallback({ src, fallback, alt, className }) {
    const [candidates, setCandidates] = useState(() => getImageCandidates(src));
    const [index, setIndex] = useState(0);
    const [currentSrc, setCurrentSrc] = useState(() => getImageCandidates(src)[0] || fallback);

    useEffect(() => {
        const list = getImageCandidates(src);
        setCandidates(list);
        setIndex(0);
        setCurrentSrc(list[0] || fallback);
    }, [src, fallback]);

    function handleError() {
        if (index + 1 < candidates.length) {
            const next = index + 1;
            setIndex(next);
            setCurrentSrc(candidates[next]);
            return;
        }
        if (currentSrc !== fallback) setCurrentSrc(fallback);
    }

    return <img src={currentSrc} alt={alt || ''} className={className} loading="lazy" onError={handleError} />;
}

function App() {
    const [activeTab, setActiveTab] = useState('dramas');
    const [dramas, setDramas] = useState([]);
    const [wishlist, setWishlist] = useState([]);
    const [actors, setActors] = useState([]);
    const [loading, setLoading] = useState(true);
    const [searchTerm, setSearchTerm] = useState('');
    const [selectedStatus, setSelectedStatus] = useState('全部');
    const [selectedDrama, setSelectedDrama] = useState(null);

    // Wishlist 互動專用 State
    const [randomPick, setRandomPick] = useState(null);
    const [wishlistLikes, setWishlistLikes] = useState({});

    useEffect(() => {
        let completed = 0;
        const results = { dramas: [], wishlist: [], actors: [] };

        function checkDone() {
            completed++;
            if (completed >= 3) {
                setDramas(Array.isArray(results.dramas) ? results.dramas : []);
                setWishlist(Array.isArray(results.wishlist) ? results.wishlist : []);
                setActors(Array.isArray(results.actors) ? results.actors : []);
                setLoading(false);
            }
        }

        Papa.parse(SHEET_URLS.dramas, {
            download: true, header: true, transformHeader: normalizeSheetHeader, skipEmptyLines: true,
            complete: res => { results.dramas = (res.data || []).map(normalizeDramaImageFields); checkDone(); },
            error: () => checkDone()
        });

        Papa.parse(SHEET_URLS.wishlist, {
            download: true, header: true, transformHeader: normalizeSheetHeader, skipEmptyLines: true,
            complete: res => { results.wishlist = res.data || []; checkDone(); },
            error: () => checkDone()
        });

        Papa.parse(SHEET_URLS.actors, {
            download: true, header: true, transformHeader: normalizeSheetHeader, skipEmptyLines: true,
            complete: res => { results.actors = (res.data || []).map(normalizeActorImageFields); checkDone(); },
            error: () => checkDone()
        });
    }, []);

    const filteredDramas = useMemo(() => {
        return dramas.filter(d => {
            const title = safeText(d.title || d.drama_title || d.name);
            const matchSearch = title.toLowerCase().includes(searchTerm.toLowerCase());
            const status = normalizeStatus(d.status || d.ststus_type);
            const matchStatus = selectedStatus === '全部' || status === selectedStatus;
            return matchSearch && matchStatus;
        });
    }, [dramas, searchTerm, selectedStatus]);

    // 隨機抽籤功能
    const handleRandomPick = () => {
        if (!wishlist || wishlist.length === 0) return;
        const randomIndex = Math.floor(Math.random() * wishlist.length);
        setRandomPick(wishlist[randomIndex]);
    };

    // 集氣點燈按鈕
    const handleBoost = (idx) => {
        setWishlistLikes(prev => ({
            ...prev,
            [idx]: (prev[idx] || 0) + 1
        }));
    };

    if (loading) {
        return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-cream text-textDark">
                <div className="w-12 h-12 border-4 border-accentPink border-t-transparent rounded-full animate-spin mb-4"></div>
                <p className="text-lg font-medium tracking-wide">正在載入泰百追劇宇宙...</p>
            </div>
        );
    }

    return (
        <div className="min-h-screen pb-12 text-textDark">
            {/* Header (Desktop) */}
            <header className="glass-card sticky top-0 z-30 border-b px-6 py-4 shadow-sm">
                <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                    <h1 className="text-2xl font-bold tracking-wide text-accentPink flex items-center gap-2">
                        <span>✨</span> 我們的泰百追劇宇宙
                    </h1>
                    <nav className="desktop-nav hidden md:flex gap-2 bg-accentSoft/50 p-1 rounded-full">
                        <button onClick={() => setActiveTab('dramas')} className={`px-5 py-2 rounded-full text-sm font-semibold transition ${activeTab === 'dramas' ? 'bg-accentPink text-white shadow' : 'hover:text-accentPink'}`}>劇集列表</button>
                        <button onClick={() => setActiveTab('wishlist')} className={`px-5 py-2 rounded-full text-sm font-semibold transition ${activeTab === 'wishlist' ? 'bg-accentPink text-white shadow' : 'hover:text-accentPink'}`}>許願池</button>
                        <button onClick={() => setActiveTab('actors')} className={`px-5 py-2 rounded-full text-sm font-semibold transition ${activeTab === 'actors' ? 'bg-accentPink text-white shadow' : 'hover:text-accentPink'}`}>CP 演員</button>
                    </nav>
                </div>
            </header>

            {/* Main Content */}
            <main className="max-w-6xl mx-auto px-4 py-8">
                {activeTab === 'dramas' && (
                    <div>
                        {/* 搜尋與篩選列 */}
                        <div className="flex flex-col sm:flex-row gap-4 mb-8">
                            <input
                                type="text"
                                placeholder="搜尋劇名..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="flex-1 px-4 py-2.5 rounded-xl border border-rose-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-accentPink"
                            />
                            <select
                                value={selectedStatus}
                                onChange={e => setSelectedStatus(e.target.value)}
                                className="px-4 py-2.5 rounded-xl border border-rose-200 bg-white/80 focus:outline-none focus:ring-2 focus:ring-accentPink"
                            >
                                <option value="全部">所有狀態</option>
                                <option value="正在跟播">正在跟播</option>
                                <option value="待播中">待播中</option>
                                <option value="已完結">已完結</option>
                            </select>
                        </div>

                        {/* 劇集清單格線 */}
                        {filteredDramas.length === 0 ? (
                            <div className="text-center py-16 text-stone-400">找不到符合條件的劇集。</div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                {filteredDramas.map((drama, idx) => {
                                    const title = safeText(drama.title || drama.drama_title || drama.name || `未命名劇集 ${idx+1}`);
                                    const status = normalizeStatus(drama.status || drama.ststus_type);
                                    return (
                                        <div
                                            key={idx}
                                            onClick={() => setSelectedDrama(drama)}
                                            className="glass-card rounded-2xl overflow-hidden soft-shadow cursor-pointer hover:scale-[1.02] transition transform duration-200 flex flex-col"
                                        >
                                            <div className="aspect-[3/4] w-full relative poster overflow-hidden">
                                                <ImageWithFallback
                                                    src={drama.poster_url}
                                                    fallback={DEFAULT_POSTER}
                                                    alt={title}
                                                    className="w-full h-full object-cover"
                                                />
                                                <span className={`absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-bold shadow ${statusClass(status)}`}>
                                                    {status}
                                                </span>
                                            </div>
                                            <div className="p-4 flex-1 flex flex-col justify-between">
                                                <h3 className="font-bold text-lg mb-1 line-clamp-1">{title}</h3>
                                                <p className="text-sm text-stone-500 line-clamp-2">{safeText(drama.synopsis || drama.description || '暫無劇情簡介...')}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                )}

                {activeTab === 'wishlist' && (
                    <div className="space-y-6">
                        {/* 趣味專區：隨機抽籤機 */}
                        <div className="glass-card p-6 rounded-2xl soft-shadow text-center bg-gradient-to-r from-rose-50 to-amber-50 border border-rose-200">
                            <h3 className="text-lg font-bold text-accentPink mb-1">🎲 選擇困難？讓命運決定今天看哪部！</h3>
                            <p className="text-sm text-stone-600 mb-4">隨機從許願池中抽取一部作品</p>
                            <button
                                onClick={handleRandomPick}
                                className="bg-accentPink hover:bg-rose-500 text-white px-6 py-2.5 rounded-full font-medium shadow-md transition transform active:scale-95"
                            >
                                抽盲盒，今天看這部 ✨
                            </button>

                            {randomPick && (
                                <div className="mt-4 p-4 bg-white/90 rounded-xl inline-block shadow-sm border border-rose-100 animate-fadeIn">
                                    <span className="text-xs text-accentPink font-bold">🎉 命運抽選結果：</span>
                                    <div className="font-bold text-textDark text-base mt-1">
                                        {safeText(randomPick.title || randomPick.wish_title || randomPick.name)}
                                    </div>
                                    <div className="text-xs text-stone-500 mt-0.5 line-clamp-1">
                                        {safeText(randomPick.description || randomPick.content || '')}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* 許願清單列表與集氣按鈕 */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {wishlist.length === 0 ? (
                                <div className="col-span-full text-center py-16 text-stone-400">目前許願池沒有資料。</div>
                            ) : (
                                wishlist.map((item, idx) => {
                                    const title = safeText(item.title || item.wish_title || `許願項目 ${idx+1}`);
                                    const desc = safeText(item.description || item.content || '暫無詳細內容');
                                    const likes = wishlistLikes[idx] || 0;
                                    return (
                                        <div key={idx} className="glass-card p-5 rounded-2xl soft-shadow flex justify-between items-center gap-4">
                                            <div className="flex-1">
                                                <h3 className="font-bold text-base text-accentPink mb-1">{title}</h3>
                                                <p className="text-sm text-stone-600 line-clamp-2">{desc}</p>
                                            </div>
                                            <button
                                                onClick={() => handleBoost(idx)}
                                                className="flex-shrink-0 flex items-center gap-1 bg-accentSoft/60 hover:bg-accentSoft text-accentPink px-3.5 py-2 rounded-xl text-xs font-bold transition transform active:scale-95 shadow-sm"
                                            >
                                                🔥 集氣 +1 <span className="text-stone-700">({likes})</span>
                                            </button>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                )}

                {activeTab === 'actors' && (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
                        {actors.length === 0 ? (
                            <div className="col-span-full text-center py-16 text-stone-400">目前沒有 CP 演員資料。</div>
                        ) : (
                            actors.map((actor, idx) => {
                                const name = safeText(actor.name || actor.actor_name || actor.cp_name || `CP / 演員 ${idx+1}`);
                                return (
                                    <div key={idx} className="glass-card rounded-2xl overflow-hidden soft-shadow p-4 text-center flex flex-col items-center">
                                        <div className="w-28 h-28 rounded-full overflow-hidden mb-3 poster border-2 border-accentPink/30">
                                            <ImageWithFallback
                                                src={actor.photo_url}
                                                fallback={DEFAULT_ACTOR}
                                                alt={name}
                                                className="w-full h-full object-cover"
                                            />
                                        </div>
                                        <h3 className="font-bold text-base mb-1">{name}</h3>
                                        <p className="text-xs text-stone-500 line-clamp-2">{safeText(actor.description || actor.bio || '')}</p>
                                    </div>
                                );
                            })
                        )}
                    </div>
                )}
            </main>

            {/* 手機版固定底部導覽列 (Mobile Bottom Navigation) */}
            <nav className="mobile-bottom-nav fixed bottom-0 left-0 right-0 glass-card border-t border-rose-200/60 py-3 px-6 flex justify-around items-center z-40 shadow-xl">
                <button
                    onClick={() => setActiveTab('dramas')}
                    className={`flex flex-col items-center gap-0.5 text-xs font-semibold transition ${activeTab === 'dramas' ? 'text-accentPink scale-105' : 'text-stone-400 hover:text-stone-600'}`}
                >
                    <span className="text-xl">🎬</span>
                    <span>劇集列表</span>
                </button>
                <button
                    onClick={() => setActiveTab('wishlist')}
                    className={`flex flex-col items-center gap-0.5 text-xs font-semibold transition ${activeTab === 'wishlist' ? 'text-accentPink scale-105' : 'text-stone-400 hover:text-stone-600'}`}
                >
                    <span className="text-xl">✨</span>
                    <span>許願池</span>
                </button>
                <button
                    onClick={() => setActiveTab('actors')}
                    className={`flex flex-col items-center gap-0.5 text-xs font-semibold transition ${activeTab === 'actors' ? 'text-accentPink scale-105' : 'text-stone-400 hover:text-stone-600'}`}
                >
                    <span className="text-xl">👥</span>
                    <span>CP 演員</span>
                </button>
            </nav>

            {/* 劇集詳細 Modal */}
            {selectedDrama && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
                    <div className="glass-card modal-panel w-full max-w-2xl rounded-3xl overflow-hidden shadow-2xl bg-white max-h-[90vh] flex flex-col">
                        <div className="p-6 overflow-y-auto flex-1">
                            <div className="flex justify-between items-start mb-4">
                                <h2 className="text-2xl font-bold text-textDark">
                                    {safeText(selectedDrama.title || selectedDrama.drama_title || selectedDrama.name)}
                                </h2>
                                <button
                                    onClick={() => setSelectedDrama(null)}
                                    className="p-2 rounded-full hover:bg-stone-100 text-stone-500 transition"
                                >
                                    ✕
                                </button>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-6">
                                <div className="w-full sm:w-1/3 aspect-[3/4] rounded-2xl overflow-hidden poster flex-shrink-0">
                                    <ImageWithFallback
                                        src={selectedDrama.poster_url}
                                        fallback={DEFAULT_POSTER}
                                        alt="海報"
                                        className="w-full h-full object-cover"
                                    />
                                </div>
                                <div className="flex-1 space-y-3 text-sm">
                                    <div>
                                        <span className="font-semibold text-accentPink">狀態：</span>
                                        {normalizeStatus(selectedDrama.status || selectedDrama.ststus_type)}
                                    </div>
                                    <div>
                                        <span className="font-semibold text-accentPink">集數：</span>
                                        {safeText(selectedDrama.total_episodes || '-')} 集
                                    </div>
                                    <div>
                                        <span className="font-semibold text-accentPink">首播日期：</span>
                                        {safeText(selectedDrama.premiere_date || '-')}
                                    </div>
                                    <div>
                                        <span className="font-semibold text-accentPink">劇情簡介：</span>
                                        <p className="mt-1 text-stone-600 leading-relaxed">
                                            {safeText(selectedDrama.synopsis || selectedDrama.description || '暫無簡介')}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
