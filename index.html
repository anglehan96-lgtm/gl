function jsonp(action,params){return new Promise(function(resolve,reject){const cb='GLU_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const q=new URLSearchParams(Object.assign({action:action},params||{}, {callback:cb,t:Date.now()}));let timer;window[cb]=function(data){clearTimeout(timer);delete window[cb];script.remove();if(data&&data.success===false)reject(new Error(data.message||'API 失敗'));else resolve(data||{});};script.onerror=function(){clearTimeout(timer);delete window[cb];script.remove();reject(new Error('無法載入 Google Apps Script'));};script.src=GAS_URL+'?'+q.toString();document.head.appendChild(script);timer=setTimeout(function(){delete window[cb];script.remove();reject(new Error('Google Apps Script 回應逾時'));},18000);});}
async function apiGet(action,params){
  return jsonp(action,Object.assign({},params||{},{cbust:Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}));
}
async function apiPost(payload){
  const body=JSON.stringify(Object.assign({},payload,{_client_ts:Date.now(),_nocache:uid('W')}));
  try{
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,keepalive:true});
    return {success:true,uncertain:true};
  }catch(e){
    try{
      if(navigator.sendBeacon && navigator.sendBeacon(GAS_URL,new Blob([body],{type:'text/plain;charset=utf-8'}))) return {success:true,uncertain:true,beacon:true};
    }catch(_e){}
    throw e;
  }
}
async function refreshData(initial){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async function(){
    if(initial){state.loading=true;state.errors=[];render();}
    const stamp=Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    try{
      const j=await apiGet('getAll',{cb:'fresh_'+stamp});
      if(!j||j.success===false||!j.data)throw new Error((j&&j.message)||'getAll 讀取失敗');
      const errors=[];
      SHEETS.forEach(function(sheet){
        if(Array.isArray(j.data[sheet])) state.data[sheet]=j.data[sheet].map(function(r){return normalizeRow(sheet,r);});
        else errors.push((LABELS[sheet]||sheet)+'：沒有收到資料');
      });
      state.loading=false;state.errors=errors;state.lastSync=new Date();render();
      return errors.length===0;
    }catch(allErr){
      const results=await Promise.all(SHEETS.map(async function(sheet){
        try{
          const j=await apiGet('getSheet',{sheet:sheet,cb:stamp+'_'+sheet});
          if(!j||j.success===false)throw new Error((j&&j.message)||'讀取失敗');
          return {sheet:sheet,rows:(Array.isArray(j.data)?j.data:[]).map(function(r){return normalizeRow(sheet,r);})};
        }catch(e){return {sheet:sheet,error:e};}
      }));
      const errors=[];
      results.forEach(function(x){if(x.error)errors.push((LABELS[x.sheet]||x.sheet)+'：'+(x.error.message||String(x.error)));else state.data[x.sheet]=x.rows;});
      state.loading=false;state.errors=errors;state.lastSync=new Date();render();
      return errors.length===0;
    }
  })();
  try{return await refreshPromise;}finally{refreshPromise=null;}
}
async function mutate(payload,message){
  try{
    await apiPost(payload);
    await new Promise(function(r){setTimeout(r,350);});
    const ok=await refreshData(false);
    if(ok)toast(message||'已同步');
    else toast('已送出變更，但重新讀取資料失敗；請按「同步最新資料」確認。',true);
  }catch(e){toast(e.message||String(e),true);throw e;}
}

function stats(){return{dramas:state.data.dramas.length,airing:state.data.dramas.filter(function(d){return status(d.ststus_type)==='正在跟播';}).length,upcoming:state.data.dramas.filter(function(d){return status(d.ststus_type)==='待播中';}).length,ended:state.data.dramas.filter(function(d){return status(d.ststus_type)==='已完結';}).length,wishlist:state.data.wishlist.length,actors:state.data.actors.length,dolls:state.data.dolls.length};}
function pageHome(){const st=stats();const latest=state.data.dramas.slice().sort(function(a,b){return (dateObj(b.premiere_date)||0)-(dateObj(a.premiere_date)||0);}).slice(0,6);const upcoming=state.data.dramas.map(function(d){return{d:d,next:nextAir(d)};}).filter(function(x){return x.next;}).sort(function(a,b){return a.next.date-b.next.date;}).slice(0,6);return viewHeader('✨ 泰百追劇宇宙','你的 Thai GL 劇集、CP、娃娃與「我／朋友」追劇紀錄，集中在同一個地方。','<button class="btn btn-primary" data-go="dramas">🎬 開始追劇</button><button class="btn btn-soft" data-open-calendar>📅 播出月曆</button>')+'<section class="stats-grid">'+[['劇集',st.dramas,'🎬'],['跟播',st.airing,'📺'],['待播',st.upcoming,'⏳'],['完結',st.ended,'✅'],['Wishlist',st.wishlist,'🎲'],['CP',st.actors,'👭'],['娃娃',st.dolls,'🧸']].map(function(x){return '<div class="stat"><div>'+x[2]+'</div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('')+'</section><div class="grid grid-2" style="margin-top:16px"><section class="panel" style="padding:16px"><div class="section-title"><div><h3>📺 近期播出</h3><div class="muted" style="font-size:11px">依我／朋友進度推算下一集</div></div></div>'+ (upcoming.length?upcoming.map(function(x){return '<button class="show-mini" data-drama="'+esc(recordKey('dramas',x.d))+'"><b>'+esc(titleOf(x.d))+'</b><span>EP'+x.next.episode+' · '+fmt(x.next.date)+(x.next.time?' · '+esc(x.next.time):'')+' 泰國時間</span></button>';}).join(''):'<div class="empty">目前沒有可計算的下一集。</div>')+'</section><section class="panel" style="padding:16px"><div class="section-title"><div><h3>🌸 最近首播</h3><div class="muted" style="font-size:11px">依 premiere_date</div></div></div>'+ (latest.length?latest.map(function(d){return '<button class="show-mini" data-drama="'+esc(recordKey('dramas',d))+'"><b>'+esc(titleOf(d))+'</b><span>'+fmt(dateObj(d.premiere_date))+' · '+esc(d.cp_name||'未填 CP')+'</span></button>';}).join(''):'<div class="empty">目前沒有劇集。</div>')+'</section></div>' ;}
function pageDramas(){const a=filteredDramas();return viewHeader('🎬 劇集資料庫','年份由 premiere_date 自動分類；EP1 使用首播日，之後每 7 天推算。','<button class="btn btn-soft" data-open-calendar>📅 查看播出月曆</button><button class="btn btn-primary" id="randomBtn">🎲 隨機一部</button><button class="btn btn-light" id="newDrama">＋ 新增劇集</button>')+'<div class="toolbar"><input id="search" class="input" value="'+esc(state.search)+'" placeholder="🔍 搜尋劇名、泰文名或 CP…"><select id="year" class="select">'+years().map(function(y){return '<option value="'+esc(y)+'" '+(state.year===y?'selected':'')+'>'+ (y==='全部'?'📅 全部年份':'📅 '+esc(y))+'</option>';}).join('')+'</select><select id="status" class="select"><option value="全部" '+(state.status==='全部'?'selected':'')+'>🎬 全部狀態</option>'+STATUS.map(function(s){return '<option '+(state.status===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select><button class="btn btn-light" id="clearFilters">清除</button></div><section class="panel schedule"><div class="section-title"><div><h3>📅 本週跟播</h3><div class="muted" style="font-size:11px">時間以 Google Sheet 的 air_time（泰國當地時間）呈現</div></div></div>'+weeklySchedule()+'</section>'+groupYears(a).map(function(pair){return '<section><div class="year-title"><h3>'+esc(pair[0])+(pair[0]==='未分類'?'':' 年')+'</h3><div class="line"></div><span>'+pair[1].length+' 部</span></div><div class="drama-grid">'+pair[1].map(dramaCard).join('')+'</div></section>';}).join('')+(a.length?'':'<div class="panel empty">找不到符合條件的劇集。</div>');}
function weeklySchedule(){const now=new Date();now.setHours(0,0,0,0);const dow=now.getDay(),monday=new Date(now);monday.setDate(now.getDate()+(dow===0?-6:1-dow));const days=Array.from({length:7},function(_,i){const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});return '<div class="week-grid">'+days.map(function(day,i){const ds=iso(day);const shows=state.data.dramas.filter(function(d){return status(d.ststus_type)==='正在跟播';}).flatMap(function(d){return schedule(d).filter(function(e){return iso(e.date)===ds;}).map(function(e){return{d:d,e:e};});});return '<div class="day '+(iso(now)===ds?'today':'')+'"><div class="day-head"><span>'+H_WEEK[i]+'</span><span>'+fmtMD(day)+'</span></div>'+(shows.length?shows.map(function(x){return '<button class="show-mini" data-drama="'+esc(recordKey('dramas',x.d))+'"><b>'+esc(titleOf(x.d))+'</b><span>EP'+x.e.episode+(x.d.air_time?' · '+esc(text(x.d.air_time).slice(0,5)):'')+'</span></button>';}).join(''):'<div class="muted" style="font-size:11px;margin-top:10px">—</div>')+'</div>';}).join('')+'</div>';}
function dramaCard(d){const total=num(d.total_episodes),h=num(d.my_progress||d.my_propress),q=num(d.friend_progress||d.friend_propress),next=nextAir(d),poster=img(d.poster_url,'poster','海報');return '<button class="drama-card '+(!poster?'no-poster':'')+'" data-drama="'+esc(recordKey('dramas',d))+'">'+poster+'<div style="min-width:0"><div class="badges"><span class="badge b-pink">'+esc(d.cp_name||'未設定 CP')+'</span>'+statusBadge(d.ststus_type)+'</div><div style="font-size:17px;font-weight:900;margin-top:6px">'+esc(titleOf(d))+'</div><div class="meta-line">'+esc(d.title_th||'')+'</div><div class="meta-line" style="margin-top:10px">📅 '+fmt(dateObj(d.premiere_date))+' · 🎬 '+(total||'-')+' 集</div>'+ (d.air_day_of_week||d.air_time?'<div class="meta-line">⏰ '+esc(d.air_day_of_week||'未設定星期')+(d.air_time?' · '+esc(text(d.air_time).slice(0,5))+' 泰國時間':'')+'</div>':'')+(next?'<div class="meta-line" style="color:#A45F66;font-weight:850">下一集 EP'+next.episode+'：'+fmt(next.date)+(next.time?' · '+esc(next.time):'')+'</div>':'')+'<div class="progress-grid"><div class="progress-box h-box"><div class="progress-label">H 我</div><div class="progress-number">'+h+'/'+(total||'?')+'</div></div><div class="progress-box q-box"><div class="progress-label">Q 朋友</div><div class="progress-number">'+q+'/'+(total||'?')+'</div></div></div></div></button>';}
function pageWishlist(){const rows=state.data.wishlist.map(function(w){return Object.assign({},w,{drama:findDrama(w.drama_id)});}).filter(function(w){return w.drama;});return viewHeader('🎲 Wishlist','Wishlist 以 drama_id 關聯 Dramas；owner 的 H＝我、Q＝朋友只用來辨識建立者；保留隨機抽劇與再抽一次。','<button class="btn btn-primary" id="randomBtn">🎲 隨機抽一部</button><button class="btn btn-light" id="newWish">＋ 新增</button>')+(state.randomDrama?'<div class="random-box panel" style="margin-bottom:14px"><div><div class="random-title">🎉 抽到了：'+esc(titleOf(state.randomDrama))+'</div><div class="muted" style="font-size:11px;margin-top:2px">再抽一次會換一部；也可以直接開啟劇集詳情。</div></div><div class="actions"><button class="btn btn-soft" data-drama="'+esc(recordKey('dramas',state.randomDrama))+'">開啟</button><button class="btn btn-primary" id="randomAgain">再抽一次</button></div></div>':'')+'<div class="grid grid-3">'+(rows.length?rows.map(wishRow).join(''):'<div class="panel empty" style="grid-column:1/-1">Wishlist 目前沒有資料。</div>')+'</div>';}
function wishRow(w){const d=w.drama;return '<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;gap:10px"><div><div style="font-weight:900">'+esc(titleOf(d))+'</div><div class="muted" style="font-size:11px">'+esc(d.cp_name||'')+'</div></div><div class="tag-row"><span class="pill">'+esc(w.owner==='Q'?'Q':'H')+'</span><span class="pill">優先度：'+esc(w.priority||'未設定')+'</span></div></div><div class="two-status"><div class="favorite h-fav">'+(bool(w.my_want)?'💗 H 想看':'🤍 H 不想看')+'</div><div class="favorite q-fav">'+(bool(w.friend_want)?'💜 Q 想看':'🤍 Q 不想看')+'</div></div><div class="muted" style="font-size:11px;margin-top:10px">'+esc(w.wishlist_status||'待看')+(w.planned_watch_date?' · 預計 '+esc(w.planned_watch_date):'')+(w.note?' · '+esc(w.note):'')+'</div><div class="actions" style="margin-top:11px"><button class="btn btn-light btn-small" data-drama="'+esc(recordKey('dramas',d))+'">查看劇集</button><button class="btn btn-soft btn-small" data-edit-wish="'+esc(recordKey('wishlist',w))+'">編輯</button><button class="btn btn-danger btn-small" data-remove-wish="'+esc(recordKey('wishlist',w))+'">刪除</button></div></div>';}
function pageCP(){return viewHeader('👭 CP 專區','CP 是網站的主體；兩位成員資料直接從 Members 互通，網站不另外建立成員頁。','<button class="btn btn-primary" id="newCP">＋ 新增 CP</button>')+'<div class="cp-grid">'+(state.data.actors.length?state.data.actors.map(cpCard).join(''):'<div class="panel empty" style="grid-column:1/-1">目前沒有 CP 資料。</div>')+'</div>';}
function cpCard(a){
  const m1=findMember(a.member_1_id),m2=findMember(a.member_2_id),name=clean(a.cp_name_en)||clean(a.cp_name)||'Unnamed CP';
  const av=img(a.photo_url,'cp-avatar',name);
  const n1=clean(m1?.name_en)||clean(a.actor_1),n2=clean(m2?.name_en)||clean(a.actor_2);
  const names=(n1&&n2)?esc(n1)+' × '+esc(n2):'';
  return '<button class="cp-card" data-cp="'+esc(recordKey('actors',a))+'"><div class="cp-top">'+(av?'<div class="cp-avatar-wrap">'+av+'</div>':'')+'</div><div class="cp-body"><div class="cp-name">'+esc(name)+'</div>'+(names?'<div class="sub">'+names+'</div>':'')+(a.cp_color?'<div class="sub">CP 顏色：'+esc(a.cp_color)+'</div>':'')+'<div class="two-status"><div class="favorite h-fav">'+(bool(a.my_favorite)?'💗 H 喜歡':'🤍 H 未加入')+'</div><div class="favorite q-fav">'+(bool(a.friend_favorite)?'💜 Q 喜歡':'🤍 Q 未加入')+'</div></div><div class="tag-row" style="margin-top:10px"><span class="pill">'+esc(a.cp_status||a.status||'未填現況')+'</span></div></div></button>';
}
function pageMembers(){return ''; }
function memberCard(){return ''; }
function cpForDoll(d){const owner=clean(d&&d.owner_member_id);if(!owner)return null;return state.data.actors.find(function(a){const ids=[a.id,a.cp_name,a.cp_name_en,a.cp_name_th,a.member_1_id,a.member_2_id].map(clean);return ids.includes(owner);})||null;}
function pageDolls(){return viewHeader('🧸 娃娃收藏','每隻娃娃都歸屬一組 CP；owner_member_id 欄位沿用現有 Sheet 欄位保存 CP ID。','<button class="btn btn-primary" id="newDoll">＋ 新增娃娃</button>')+'<div class="doll-grid">'+(state.data.dolls.length?state.data.dolls.map(dollCard).join(''):'<div class="panel empty" style="grid-column:1/-1">目前沒有娃娃。</div>')+'</div>';}
function dollCard(d){const cp=cpForDoll(d),photo=img(d.photo_url,'doll-photo',d.doll_name);return '<button class="doll-card" data-doll="'+esc(recordKey('dolls',d))+'">'+photo+'<div class="doll-body"><div class="doll-name">'+esc(d.doll_name||'未命名娃娃')+'</div><div class="sub">所屬 CP：'+esc(cp?(cp.cp_name_en||cp.cp_name):d.owner_member_id||'未綁定')+'</div><div class="tag-row" style="margin-top:8px">'+(d.doll_type?'<span class="pill">'+esc(d.doll_type)+'</span>':'')+(d.doll_color?'<span class="pill">'+esc(d.doll_color)+'</span>':'')+'</div>'+(d.description?'<div class="muted" style="font-size:11px;margin-top:8px">'+esc(d.description)+'</div>':'')+'</div></button>';}
function pageTimeline(){const a=state.data.dramas.map(function(d){return{d:d,date:dateObj(d.premiere_date)};}).filter(function(x){return x.date;}).sort(function(a,b){return a.date-b.date;});return viewHeader('🕰 時間軸','以 premiere_date 排列所有劇集歷程，點擊節點可以打開完整詳情。','<button class="btn btn-soft" data-open-calendar>📅 月曆</button>')+'<section class="panel" style="padding:18px"><div class="timeline">'+(a.length?a.map(function(x){return '<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-date">'+fmt(x.date)+' · '+esc(x.d.air_day_of_week||WEEK[x.date.getDay()])+'</div><button class="timeline-card" data-drama="'+esc(recordKey('dramas',x.d))+'"><div class="timeline-title">'+esc(titleOf(x.d))+'</div><div class="muted" style="font-size:11px">'+esc(x.d.cp_name||'')+' · '+esc(status(x.d.ststus_type))+'</div></button></div>';}).join(''):'<div class="empty">目前沒有可用的時間軸資料。</div>')+'</div></section>';}
function pageManage(){const sh=state.adminSheet,rows=state.data[sh]||[],tabs=['dramas','wishlist','actors','dolls'];return viewHeader('⚙️ 資料管理','網站可新增／編輯／刪除劇集、Wishlist、CP、娃娃；Members 只在 CP 編輯視窗裡互通管理。','<button class="btn btn-light" id="refreshBtn2">↻ 重新載入</button>')+'<div class="switchbar" style="margin-bottom:12px">'+tabs.map(function(s){return '<button class="switch '+(sh===s?'active':'')+'" data-admin-sheet="'+s+'">'+LABELS[s]+' ('+((state.data[s]||[]).length)+')</button>';}).join('')+'</div><section class="panel" style="padding:15px"><div class="section-title"><div><h3>'+LABELS[sh]+' 資料</h3><div class="muted" style="font-size:11px">'+rows.length+' 筆</div></div><button class="btn btn-primary btn-small" id="genericNew">＋ 新增</button></div>'+(rows.length?rows.map(function(r){return manageRow(sh,r);}).join(''):'<div class="empty">沒有資料。</div>')+'</section>';}
function manageRow(sh,r){let title=sh==='actors'?(r.cp_name_en||r.cp_name||'CP'):sh==='dolls'?(r.doll_name||'娃娃'):r.title_zh||r.drama_id||r.id||'資料';let sub=sh==='actors'?((r.actor_1||'')+' × '+(r.actor_2||'')+' · '+(r.cp_status||r.status||'')):sh==='wishlist'?r.drama_id+' · '+(r.owner||'H')+' · '+(r.wishlist_status||''):sh==='dolls'?((findMember(r.owner_member_id)?.name_en)||r.owner_member_id||'')+' · '+(r.doll_type||''):((r.title_th||'')+' · '+(r.cp_name||''));return '<div class="manage-row"><div style="min-width:0"><div class="manage-key">'+esc(title)+'</div><div class="manage-val">'+esc(sub)+'</div></div><div class="actions"><button class="btn btn-light btn-small" data-manage-edit="'+esc(recordKey(sh,r))+'">編輯</button><button class="btn btn-danger btn-small" data-manage-delete="'+esc(recordKey(sh,r))+'">刪除</button></div></div>';}
function page(){switch(state.active){case'home':return pageHome();case'dramas':return pageDramas();case'wishlist':return pageWishlist();case'actors':return pageCP();case'dolls':return pageDolls();case'timeline':return pageTimeline();default:return pageHome();}}
function render(){const app=document.getElementById('app');app.innerHTML='<div class="shell"><header class="topbar"><button style="border:0;background:transparent;padding:0" data-nav="home"><div class="brand"><div class="brand-mark">✨</div><div><h1>泰百追劇宇宙</h1><p>GL Universe · H＝我／Q＝朋友（只用來辨識我／朋友）</p></div></div></button><div class="actions"><div class="muted" style="font-size:10px;align-self:center">'+(state.lastSync?'最後同步 '+state.lastSync.getFullYear()+'/'+String(state.lastSync.getMonth()+1).padStart(2,'0')+'/'+String(state.lastSync.getDate()).padStart(2,'0')+' '+String(state.lastSync.getHours()).padStart(2,'0')+':'+String(state.lastSync.getMinutes()).padStart(2,'0')+':'+String(state.lastSync.getSeconds()).padStart(2,'0'):'尚未同步')+'</div><button class="btn btn-light" id="refreshBtn">↻ <span class="refresh-text">同步最新資料</span></button></div></header>'+navHtml()+(state.errors.length?'<div class="error-panel">資料同步有問題：\n'+esc(state.errors.join('\n'))+'\n\n仍可瀏覽已成功載入的資料。請確認 Apps Script 已重新部署、Web App 存取權為任何人，並已執行 setup()。</div>':'')+'<main>'+ (state.loading?'<div class="panel loading"><div class="spinner"></div><div class="muted">🌸 正在從 Google Sheets 同步資料…</div></div>':page())+'</main>'+mobileNavHtml()+'</div>';bind();}
function bind(){document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){state.active=b.dataset.nav;render();window.scrollTo({top:0,behavior:'smooth'});};});document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){state.active=b.dataset.go;render();};});document.querySelectorAll('[data-open-calendar]').forEach(function(b){b.onclick=calendarModal;});document.getElementById('refreshBtn')?.addEventListener('click',function(){refreshData(true);});document.getElementById('search')?.addEventListener('input',function(e){state.search=e.target.value;render();});document.getElementById('year')?.addEventListener('change',function(e){state.year=e.target.value;render();});document.getElementById('status')?.addEventListener('change',function(e){state.status=e.target.value;render();});document.getElementById('clearFilters')?.addEventListener('click',function(){state.search='';state.year='全部';state.status='全部';render();});document.getElementById('randomBtn')?.addEventListener('click',randomDrama);document.getElementById('randomAgain')?.addEventListener('click',randomDrama);document.getElementById('newDrama')?.addEventListener('click',function(){modalForm('dramas',null);});document.getElementById('newWish')?.addEventListener('click',function(){modalForm('wishlist',null);});document.getElementById('newCP')?.addEventListener('click',function(){cpForm(null);});document.getElementById('newDoll')?.addEventListener('click',function(){modalForm('dolls',null);});document.querySelectorAll('[data-drama]').forEach(function(b){b.onclick=function(){const d=findDrama(b.dataset.drama);if(d)dramaDetail(d);};});document.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){const a=findRow('actors',b.dataset.cp);if(a)cpDetail(a);};});document.querySelectorAll('[data-doll]').forEach(function(b){b.onclick=function(){const d=findRow('dolls',b.dataset.doll);if(d)dollDetail(d);};});}
async function deleteManaged(sheet,key){const r=findRow(sheet,key);if(!r)return;if(!confirm('確定刪除這筆 '+LABELS[sheet]+' 資料嗎？'))return;let payload;if(sheet==='wishlist')payload={action:'deleteRecord',sheet:sheet,keyField:'composite_drama_owner',keyValue:{drama_id:r.drama_id,owner:r.owner||'H'}};else{const keyField=sheet==='dolls'?'doll_id':(sheet==='actors'?(r.id?'id':(r.cp_name?'cp_name':'cp_name_en')):'id');const keyValue=r[keyField];payload={action:'deleteRecord',sheet:sheet,keyField:keyField,keyValue:keyValue};}try{await mutate(payload,'已刪除');}catch(e){}}
async function deleteWishlist(key){const w=state.data.wishlist.find(function(x){return recordKey('wishlist',x)===key;});if(!w)return;if(!confirm('確定刪除這筆 Wishlist 嗎？'))return;try{await mutate({action:'deleteRecord',sheet:'wishlist',keyField:'composite_drama_owner',keyValue:{drama_id:w.drama_id,owner:w.owner||'H'}},'Wishlist 已刪除');}catch(e){}}
function randomDrama(){const a=state.data.dramas;if(!a.length){toast('目前沒有劇集可抽',true);return;}let choices=a;if(state.randomDrama&&a.length>1)choices=a.filter(function(d){return clean(d.id)!==clean(state.randomDrama.id);});state.randomDrama=choices[Math.floor(Math.random()*choices.length)];state.active='wishlist';render();}

function calendarModal(){const base=new Date(state.calendar);base.setDate(1);const y=base.getFullYear(),m=base.getMonth();const first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();const all=state.data.dramas.flatMap(function(d){return schedule(d).map(function(e){return{drama:d,e:e};});});if(!state.calendarSelected||state.calendarSelected.slice(0,7)!==y+'-'+String(m+1).padStart(2,'0'))state.calendarSelected=iso(new Date(y,m,1));const dayRows=all.filter(function(x){return iso(x.e.date)===state.calendarSelected;}).sort(function(a,b){return clean(a.e.time).localeCompare(clean(b.e.time));});let cells='';for(let i=0;i<start;i++)cells+='<div class="cal-cell muted"></div>';for(let day=1;day<=last;day++){const d=new Date(y,m,day),ds=iso(d),items=all.filter(function(x){return iso(x.e.date)===ds;});cells+='<button class="cal-cell '+(iso(new Date())===ds?'today ':'')+(state.calendarSelected===ds?'" style="border-color:#D88A8A;background:#FFF4F4':'"')+' data-cal-day="'+ds+'"><div class="cal-date">'+day+'</div>'+items.slice(0,4).map(function(x){const s=status(x.drama.ststus_type);return '<div class="cal-chip '+(s==='待播中'?'upcoming':s==='已完結'?'ended':'')+'">EP'+x.e.episode+' · '+esc(titleOf(x.drama))+'</div>';}).join('')+(items.length>4?'<div class="muted" style="font-size:8px;margin-top:3px">+'+(items.length-4)+'</div>':'')+'</button>';}const ys=years().filter(function(x){return x!=='全部';});openModal('<div class="modal wide"><div class="modal-head"><h3>📅 播出月曆</h3><button class="close" data-close>×</button></div><div class="modal-body"><div class="calendar-top" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn btn-light btn-small" id="calPrev">‹ 上月</button><select class="select" style="width:auto;min-width:100px" id="calYear">'+(ys.includes(String(y))?ys.map(function(v){return '<option value="'+v+'" '+(String(y)===v?'selected':'')+'>'+v+'</option>';}).join(''):'<option>'+y+'</option>')+'</select><select class="select" style="width:auto;min-width:90px" id="calMonth">'+Array.from({length:12},function(_,i){return '<option value="'+i+'" '+(m===i?'selected':'')+'>'+(i+1)+' 月</option>';}).join('')+'</select><button class="btn btn-light btn-small" id="calToday">今天</button><button class="btn btn-primary btn-small" id="calNext">下月 ›</button></div><div class="legend" style="margin:10px 0"><span>🟢 正在跟播</span><span>🔵 待播中</span><span>⚪ 已完結</span><span>⏰ 時間＝泰國當地時間</span></div><div class="calendar-layout"><div><div class="calendar-grid">'+H_WEEK.map(function(x){return '<div class="calendar-week">'+x+'</div>';}).join('')+cells+'</div></div><aside class="calendar-side"><div style="font-weight:900">'+esc(state.calendarSelected.replace(/-/g,'/'))+' 播出</div><div style="margin-top:10px">'+(dayRows.length?dayRows.map(function(x){return '<button class="show-mini" data-drama="'+esc(recordKey('dramas',x.drama))+'"><b>'+esc(titleOf(x.drama))+'</b><span>EP'+x.e.episode+(x.e.time?' · '+esc(x.e.time)+' 泰國時間':'')+'</span></button>';}).join(''):'<div class="muted" style="padding:28px 0;text-align:center">這一天沒有播出。</div>')+'</div></aside></div></div><div class="modal-footer"><button class="btn btn-light" data-close>關閉</button></div></div>');document.querySelectorAll('[data-cal-day]').forEach(function(b){b.onclick=function(){state.calendarSelected=b.dataset.calDay;calendarModal();};});document.getElementById('calPrev').onclick=function(){state.calendar=new Date(y,m-1,1);state.calendarSelected=iso(state.calendar);calendarModal();};document.getElementById('calNext').onclick=function(){state.calendar=new Date(y,m+1,1);state.calendarSelected=iso(state.calendar);calendarModal();};document.getElementById('calToday').onclick=function(){state.calendar=new Date();state.calendarSelected=iso(new Date());calendarModal();};document.getElementById('calYear').onchange=function(e){state.calendar=new Date(Number(e.target.value),m,1);state.calendarSelected=iso(state.calendar);calendarModal();};document.getElementById('calMonth').onchange=function(e){state.calendar=new Date(y,Number(e.target.value),1);state.calendarSelected=iso(state.calendar);calendarModal();};}

function fieldInput(k,v,sheet,lock){
  const value=text(v),val=esc(value);
  if(k==='ststus_type')return '<select class="select" data-field="'+k+'" '+(lock?'disabled':'')+'><option value="">未設定</option>'+STATUS.map(function(s){return '<option '+(clean(value)===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(sheet==='actors'&&(k==='cp_status'||k==='status'))return '<select class="select" data-field="'+k+'"><option value="">未設定</option>'+CP_STATUS.map(function(s){return '<option '+(clean(value)===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(k==='air_day_of_week')return '<select class="select" data-field="'+k+'"><option value="">未設定</option>'+H_WEEK.map(function(s){return '<option '+(clean(value)===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(k==='owner')return '<select class="select" data-field="owner"><option value="H" '+(clean(value)!=='Q'?'selected':'')+'>H／我</option><option value="Q" '+(clean(value)==='Q'?'selected':'')+'>Q／朋友</option></select>';
  if(['my_want','friend_want','my_favorite','friend_favorite','favorite'].includes(k))return '<select class="select" data-field="'+k+'"><option value="">未設定</option><option value="true" '+(bool(value)?'selected':'')+'>是</option><option value="false" '+(!bool(value)&&has(value)?'selected':'')+'>否</option></select>';
  if(k==='air_time')return '<div><input class="input" type="time" data-field="air_time" value="'+esc(value.slice(0,5))+'"><small>請填劇集在泰國當地播出的時鐘時間，例如 22:30。</small></div>';
  if(sheet==='dolls'&&k==='owner_member_id')return '<select class="select" data-field="owner_member_id"><option value="">請選擇成員</option>'+state.data.members.map(function(m){return '<option value="'+esc(m.member_id||m.id)+'" '+(clean(value)===clean(m.member_id||m.id)?'selected':'')+'>'+esc(clean(m.name_en)||clean(m.member_id||m.id))+'</option>';}).join('')+'</select>';
  if(['birth_date','premiere_date','added_date','planned_watch_date','start_date','anniversary','favorite_date','cp_start_date','cp_anniversary'].includes(k)||k.endsWith('_date'))return '<input class="input" type="date" data-field="'+k+'" value="'+esc(dateObj(value)?iso(dateObj(value)):value.slice(0,10))+'">';
  if(k==='total_episodes'||k.includes('progress')||k.includes('rating')||k==='debut_year'||k==='height'||k==='weight')return '<input class="input" type="number" min="0" step="1" data-field="'+k+'" value="'+val+'">';
  if(LONG_FIELDS.has(k))return '<textarea class="textarea" data-field="'+k+'">'+val+'</textarea>';
  return '<input class="input" type="text" data-field="'+k+'" value="'+val+'" '+(lock?'disabled':'')+'>';
}

function collectFields(){const out={};document.querySelectorAll('.modal [data-field]').forEach(function(el){let v=el.value;if(['my_want','friend_want','my_favorite','friend_favorite'].includes(el.dataset.field)&&v!=='')v=v==='true';out[el.dataset.field]=v;});return out;}
async function saveGeneric(sheet,record){
  const rec=collectFields();
  if(sheet==='dramas'&&!record&&!has(rec.id))rec.id=uid('DRAMA');
  if(sheet==='wishlist'){if(!has(rec.drama_id)){toast('Wishlist 必須指定劇集',true);return;}if(!has(rec.owner))rec.owner='H';}
  if(sheet==='dolls'){if(!has(rec.doll_name)){toast('娃娃名稱不能空白',true);return;}if(!has(rec.owner_member_id)){toast('請指定所屬 CP',true);return;}if(!record&&!has(rec.doll_id))rec.doll_id=uid('DOLL');}
  if(sheet==='actors'){await cpSaveFromForm(record);return;}
  let payload,keyField,keyValue;
  if(sheet==='wishlist'){keyField='composite_drama_owner';keyValue={drama_id:record?.drama_id,owner:record?.owner||'H'};payload=record?{action:'updateRecord',sheet:sheet,keyField:keyField,keyValue:keyValue,record:Object.assign({},record,rec)}:{action:'createRecord',sheet:sheet,keyField:keyField,record:rec};}
  else {keyField=sheet==='dolls'?'doll_id':'id';keyValue=record?record[keyField]:null;payload=record?{action:'updateRecord',sheet:sheet,keyField:keyField,keyValue:keyValue,record:Object.assign({},record,rec)}:{action:'createRecord',sheet:sheet,keyField:keyField,record:rec};}
  try{await mutate(payload,record?'已更新並同步':'已新增並同步');closeModal();}catch(e){}
}

function fieldInputForPrefix(k,v,p){const value=text(v),val=esc(value);if(k==='support_color')return '<div class="color-input-row"><input class="color-picker" type="color" data-'+p+'="support_color" value="'+esc(pickerColor(value,'#D88A8A'))+'"><span class="muted">'+esc(value||'選擇應援色')+'</span></div>';if(k==='birth_date'||k==='favorite_date')return '<input class="input" type="date" data-'+p+'="'+k+'" value="'+esc(dateObj(value)?iso(dateObj(value)):value.slice(0,10))+'">';if(['height','weight','debut_year','my_rating'].includes(k))return '<input class="input" type="number" min="0" step="1" data-'+p+'="'+k+'" value="'+val+'">';if(LONG_FIELDS.has(k))return '<textarea class="textarea" data-'+p+'="'+k+'">'+val+'</textarea>';return '<input class="input" type="text" data-'+p+'="'+k+'" value="'+val+'">';}
function readPrefix(p){const o={};document.querySelectorAll('.modal [data-'+p+']').forEach(function(el){let v=el.value;if(el.dataset[p]==='my_favorite')v=v==='true';o[el.dataset[p]]=v;});return o;}
function memberSelectHtml(prefix,selectedId){return '<div class="field full"><label>'+(prefix==='m1'?'第 1 位成員':'第 2 位成員')+'（從 Members 既有資料選擇）</label><select class="select" data-'+prefix+'="member_id"><option value="">＋ 新建成員</option>'+state.data.members.map(function(m){const id=m.member_id||m.id,n=clean(m.name_en)||id;return '<option value="'+esc(id)+'" '+(clean(selectedId)===clean(id)?'selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select><small>選到既有成員後，下面資料會直接載入；CP 與 Members 共用同一個 member_id。</small></div>';}

function populateMemberFields(prefix,m){const x=m||{};document.querySelectorAll('.modal [data-'+prefix+']').forEach(function(el){const k=el.dataset[prefix];if(k==='member_id')return;if(k==='support_color'){el.value=pickerColor(x[k],'#D88A8A');return;}if(k==='my_favorite')el.value=bool(x[k])?'true':'false';else if(el.type==='date')el.value=dateObj(x[k])?iso(dateObj(x[k])):text(x[k]).slice(0,10);else el.value=text(x[k]);});}
function bindMemberSelector(prefix){const el=document.querySelector('.modal [data-'+prefix+'="member_id"]');if(!el)return;el.addEventListener('change',function(){populateMemberFields(prefix,findMember(el.value)||{});});}
function cpForm(actor){
  const base=actor||{},m1=actor?findMember(actor.member_1_id):null,m2=actor?findMember(actor.member_2_id):null;
  const cpName=clean(base.cp_name_en)||clean(base.cp_name);
  openModal('<div class="modal wide">'+commonModalHead((actor?'✏️ 編輯':'＋ 新增')+' CP ＋兩位成員')+'<div class="modal-body"><div class="notice">CP 只在網站顯示英文名稱。兩位成員不會獨立出現在網站，而是在 CP 裡直接管理；Members 資料用 member_id 與 CP 互通。你也可以從 Google Sheet 手動新增資料，下一次同步會直接讀進來。</div><section><div class="section-title" style="margin-top:14px"><h3>👭 CP 資料</h3></div><div class="form-grid"><div class="field"><label>CP 英文名稱</label><input class="input" data-cpfield="cp_name_en" value="'+esc(cpName)+'"><small>儲存時也會同步到 Actors.cp_name，方便現有資料使用。</small></div><div class="field"><label>CP 照片 URL</label><input class="input" data-cpfield="photo_url" value="'+esc(base.photo_url||'')+'"></div><div class="field"><label>我喜歡</label><select class="select" data-cpfield="my_favorite"><option value="false" '+(!bool(base.my_favorite)?'selected':'')+'>否</option><option value="true" '+(bool(base.my_favorite)?'selected':'')+'>是</option></select></div><div class="field"><label>朋友喜歡</label><select class="select" data-cpfield="friend_favorite"><option value="false" '+(!bool(base.friend_favorite)?'selected':'')+'>否</option><option value="true" '+(bool(base.friend_favorite)?'selected':'')+'>是</option></select></div><div class="field"><label>CP 現況</label><select class="select" data-cpfield="cp_status"><option value="">未設定</option>'+CP_STATUS.map(function(x){return '<option '+(clean(base.cp_status||base.status)===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select></div><div class="field"><label>首次合作作品（連動劇集）</label><select class="select" data-cpfield="first_work"><option value="">未設定</option>'+state.data.dramas.map(function(d){const t=titleOf(d);return '<option value="'+esc(t)+'" '+(clean(base.first_work)===clean(t)?'selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></div><div class="field"><label>代表作品（連動劇集）</label><select class="select" data-cpfield="representative_work"><option value="">未設定</option>'+state.data.dramas.map(function(d){const t=titleOf(d);return '<option value="'+esc(t)+'" '+(clean(base.representative_work)===clean(t)?'selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></div><div class="field full"><label>CP 描述</label><textarea class="textarea" data-cpfield="cp_description">'+esc(base.cp_description||base.description||'')+'</textarea></div></div></section><div class="separator"></div><section><div class="section-title"><h3>第 1 位成員</h3></div>'+memberSelectHtml('m1',m1?.member_id||m1?.id)+memberEditFields('m1',m1||{})+'</section><div class="separator"></div><section><div class="section-title"><h3>第 2 位成員</h3></div>'+memberSelectHtml('m2',m2?.member_id||m2?.id)+memberEditFields('m2',m2||{})+'</section></div><div class="modal-footer"><button class="btn btn-light" data-close>取消</button><button class="btn btn-primary" id="saveCP">儲存 CP＋兩位成員</button></div></div>');bindMemberSelector('m1');bindMemberSelector('m2');document.getElementById('saveCP').onclick=function(){saveCPBundle(actor,m1,m2);};
}
async function cpSaveFromForm(actor){
  const saveBtn=document.getElementById('saveCP');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='正在儲存…';}
  const cp={};document.querySelectorAll('.modal [data-cpfield]').forEach(function(el){let v=el.value;if(['my_favorite','friend_favorite'].includes(el.dataset.cpfield))v=v==='true';cp[el.dataset.cpfield]=v;});
  const raw1=readPrefix('m1'),raw2=readPrefix('m2');
  if(!has(cp.cp_name_en)){toast('CP 英文名稱不能空白',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  if(!has(raw1.name_en)||!has(raw2.name_en)){toast('兩位成員都必須填英文名',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  if(has(raw1.member_id)&&has(raw2.member_id)&&clean(raw1.member_id)===clean(raw2.member_id)){toast('第 1、2 位成員不能使用相同 member_id',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  const duplicate=state.data.actors.find(function(a){const same=clean(a.cp_name_en||a.cp_name).toLowerCase()===clean(cp.cp_name_en).toLowerCase();return same&&(!actor||recordKey('actors',a)!==recordKey('actors',actor));});
  if(duplicate){toast('已經有相同 CP 英文名稱，請不要重複建立。',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  const oldMember1=has(raw1.member_id)?findMember(raw1.member_id):null,oldMember2=has(raw2.member_id)?findMember(raw2.member_id):null;
  const m1Id=clean(raw1.member_id)||uid('MEM'),m2Id=clean(raw2.member_id)||uid('MEM');
  const m1=buildMemberPayload(raw1,m1Id,oldMember1),m2=buildMemberPayload(raw2,m2Id,oldMember2);
  m1.support_color=pickerColor(raw1.support_color,'#D88A8A');m2.support_color=pickerColor(raw2.support_color,'#D88A8A');
  const actorPayload=buildActorPayload(cp,actor,m1,m2); // 不顯示的舊欄位保留原值，避免編輯時意外清空 Sheet 資料。
  try{
    // Single bundled write prevents partial CP/member saves when requests race each other.
    await apiPost({action:'saveCPBundle',actor:actorPayload,cp:actorPayload,member1:m1,member2:m2});
    await new Promise(function(resolve){setTimeout(resolve,900);});
    const ok=await refreshData(false);
    if(ok){toast(actor?'CP 與成員已更新並同步':'CP 與成員已建立並同步');closeModal();}
    else toast('已送出儲存要求，但重新讀取失敗；請按「同步最新資料」確認。',true);
  }catch(e){toast('儲存失敗：'+(e.message||String(e)),true);}
  finally{const b=document.getElementById('saveCP');if(b){b.disabled=false;b.textContent='儲存 CP＋兩位成員';}}
}

function buildMemberPayload(form,id,old){const x=Object.assign({},old||{});Object.keys(form||{}).forEach(function(k){if(k!=='member_id')x[k]=form[k];});x.member_id=id;x.id=x.id||id;x.display_name=x.display_name||x.name_en||'';x.favorite_color=text(x.favorite_color);x.support_color=text(x.support_color);x.photo_url=x.photo_url||x.photo_1||'';x.photo_url_2=x.photo_url_2||x.photo_2||'';x.photo_url_3=x.photo_url_3||x.photo_3||'';x.photo_1=x.photo_url;x.photo_2=x.photo_url_2;x.photo_3=x.photo_url_3;x.pet=x.pet||x.pets||'';x.pets=x.pets||x.pet||'';return x;}
function buildActorPayload(cp,old,m1,m2){const x=Object.assign({},old||{});Object.keys(cp||{}).forEach(function(k){x[k]=cp[k];});x.id=x.id||uid('CP');x.cp_name=clean(cp.cp_name_en||cp.cp_name);x.cp_name_en=clean(cp.cp_name_en||cp.cp_name);x.member_1_id=m1.member_id;x.member_2_id=m2.member_id;x.actor_1=m1.name_en||'';x.actor_2=m2.name_en||'';x.actor_1_th=old?.actor_1_th||'';x.actor_2_th=old?.actor_2_th||'';x.cp_status=cp.cp_status||old?.cp_status||old?.status||'';x.status=x.cp_status;x.cp_description=cp.cp_description||old?.cp_description||old?.description||'';x.description=x.cp_description;return x;}

async function saveCPBundle(actor,old1,old2){await cpSaveFromForm(actor);} 

window.addEventListener('error',function(e){console.error(e.error||e.message);if(!state.loading){toast('頁面執行時發生錯誤：'+(e.message||'未知錯誤'),true);}});
window.addEventListener('unhandledrejection',function(e){console.error(e.reason);state.loading=false;const msg='資料處理失敗：'+(e.reason?.message||e.reason||'未知錯誤');state.errors=[msg];try{render();}catch(_e){toast(msg,true);}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!state.lastSync||Date.now()-state.lastSync.getTime()>30000))refreshData(false);});
window.addEventListener('focus',function(){if(!state.lastSync||Date.now()-state.lastSync.getTime()>30000)refreshData(false);});

try{render();}catch(e){state.loading=false;state.errors=['頁面啟動失敗：'+(e&&e.message?e.message:String(e))];try{render();}catch(_e){const app=document.getElementById('app');if(app)app.innerHTML='<div class="shell"><div class="error-panel">頁面啟動失敗：'+esc(e&&e.message?e.message:String(e))+'</div></div>';}}
refreshData(true).catch(function(e){state.loading=false;state.errors=['Google Sheet 同步失敗：'+(e&&e.message?e.message:String(e))];state.lastSync=null;try{render();}catch(_e){const app=document.getElementById('app');if(app)app.innerHTML='<div class="shell"><div class="error-panel">Google Sheet 同步失敗：'+esc(e&&e.message?e.message:String(e))+'</div></div>';}});
})();
</script>
</body>
