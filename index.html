<script type="text/babel">

const { useState, useEffect, useMemo } = React;


/* =========================================================
   Google 試算表
========================================================= */

const SHEET_URLS = {

    dramas:
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=0&single=true&output=csv',

    actors:
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=832417858&single=true&output=csv'
};


/* =========================================================
   預設圖片
   使用 SVG data URL，不依賴 Unsplash
========================================================= */

const DEFAULT_DRAMA_IMAGE =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">

                    <stop offset="100%" stop-color="#ECE2F2"/>
                </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#g)"/>
            <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle"
                  fill="#8C7369" font-size="34" font-family="Arial">
                📺
            </text>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
                  fill="#8C7369" font-size="22" font-family="Arial">
                暫無海報
            </text>
        </svg>
    `);

const DEFAULT_ACTOR_IMAGE =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#F9E4E4"/>
                    <stop offset="100%" stop-color="#ECE2F2"/>
                </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#g)"/>
            <circle cx="250" cy="190" r="90" fill="#ffffff" opacity="0.7"/>
            <path d="M105 440c25-100 105-140 145-140s120 40 145 140"
                  fill="#ffffff" opacity="0.7"/>
            <text x="50%" y="88%" dominant-baseline="middle" text-anchor="middle"
                  fill="#8C7369" font-size="22" font-family="Arial">
                暫無照片
            </text>
        </svg>
    `);


/* =========================================================
   欄位工具
   支援新舊欄位名稱
========================================================= */

function getField(row, ...names) {

    for (const name of names) {

        if (
            row &&
            Object.prototype.hasOwnProperty.call(row, name) &&
            row[name] !== undefined &&
            row[name] !== null &&
            String(row[name]).trim() !== ''
        ) {
            return String(row[name]).trim();
        }
    }

    return '';
}


/* =========================================================
   判斷 TRUE
========================================================= */

function isTrue(value) {

    const text = String(value || '')
        .trim()
        .toUpperCase();

    return [
        'TRUE',
        '1',
        'YES',
        'Y',
        '是'
    ].includes(text);
}


/* =========================================================
   清理 URL
========================================================= */

function cleanUrl(rawUrl) {

    if (!rawUrl) {
        return '';
    }

    let url = String(rawUrl).trim();

    /*
        Google Sheets:
        =HYPERLINK("https://xxx","名稱")
    */

    const hyperlinkMatch = url.match(
        /=HYPERLINK\(\s*["']([^"']+)["']/i
    );

    if (hyperlinkMatch) {
        url = hyperlinkMatch[1].trim();
    }

    /*
        [名稱](https://xxx)
    */

    const markdownMatch = url.match(
        /^\[[^\]]*\]\((https?:\/\/[^)]+)\)$/i
    );

    if (markdownMatch) {
        url = markdownMatch[1].trim();
    }

    /*
        <https://xxx>
    */

    if (
        url.startsWith('<') &&
        url.endsWith('>')
    ) {
        url = url.slice(1, -1).trim();
    }

    /*
        補 https://
    */

    if (
        url &&
        !url.startsWith('http://') &&
        !url.startsWith('https://') &&
        !url.startsWith('//') &&
        !url.startsWith('data:')
    ) {
        url = 'https://' + url;
    }

    return url;
}


/* =========================================================
   Google Drive File ID
========================================================= */

function getGoogleDriveFileId(rawUrl) {

    if (!rawUrl) {
        return '';
    }

    const url = String(rawUrl).trim();

    /*
        /file/d/FILE_ID/view
    */

    let match = url.match(
        /drive\.google\.com\/file\/d\/([^/?#]+)/i
    );

    if (match) {
        return match[1];
    }

    /*
        open?id=FILE_ID
    */

    match = url.match(
        /[?&]id=([^&#]+)/i
    );

    if (
        match &&
        /drive\.google\.com/i.test(url)
    ) {
        return match[1];
    }

    /*
        uc?id=FILE_ID
    */

    match = url.match(
        /drive\.google\.com\/uc\?[^#]*id=([^&#]+)/i
    );

    if (match) {
        return match[1];
    }

    return '';
}


/* =========================================================
   圖片網址轉換
========================================================= */

function getImageUrl(rawUrl) {

    if (!rawUrl) {
        return '';
    }

    const original = String(rawUrl).trim();

    const driveId = getGoogleDriveFileId(original);

    if (driveId) {

        /*
            Google Drive 分享圖片
            自動轉成縮圖
        */

        return (
            'https://drive.google.com/thumbnail' +
            '?id=' +
            encodeURIComponent(driveId) +
            '&sz=w1000'
        );
    }

    return cleanUrl(original);
}


/* =========================================================
   URL 是否可用
========================================================= */

function isHttpUrl(url) {

    if (!url) {
        return false;
    }

    return (
        url.startsWith('http://') ||
        url.startsWith('https://')
    );
}


/* =========================================================
   CSV 讀取
========================================================= */

function fetchCSV(url) {

    return new Promise((resolve, reject) => {

        Papa.parse(url, {

            download: true,

            header: true,

            skipEmptyLines: true,

            encoding: 'UTF-8',

            complete: function(results) {

                if (
                    results.errors &&
                    results.errors.length > 0
                ) {

                    console.error(
                        'CSV 解析錯誤:',
                        results.errors
                    );

                    reject(results.errors);
                    return;
                }

                resolve(results.data || []);
            },

            error: function(error) {

                console.error(
                    'CSV 載入錯誤:',
                    error
                );

                reject(error);
            }
        });
    });
}


/* =========================================================
   App
========================================================= */

function App() {

    const [activeTab, setActiveTab] = useState('dramas');

    const [dramas, setDramas] = useState([]);

    const [wishlist, setWishlist] = useState([]);

    const [actors, setActors] = useState([]);

    const [loading, setLoading] = useState(true);

    const [loadErrors, setLoadErrors] = useState([]);

    const [searchTerm, setSearchTerm] = useState('');

    const [lastUpdated, setLastUpdated] = useState(null);


    /* =====================================================
       載入資料
    ===================================================== */

    async function loadAllData() {

        setLoading(true);

        setLoadErrors([]);

        /*
            先清空舊資料
            避免重新同步時資料混在一起
        */

        setDramas([]);

        setWishlist([]);

        setActors([]);

        const errors = [];


        /*
            三份分開讀取
            一份失敗不影響其他
        */

        const dramaPromise = fetchCSV(SHEET_URLS.dramas)
            .then(data => {
                setDramas(data);
            })
            .catch(error => {
                console.error('Dramas 載入失敗:', error);

                errors.push(
                    '劇集總表'
                );
            });


        const wishlistPromise = fetchCSV(SHEET_URLS.wishlist)
            .then(data => {
                setWishlist(data);
            })
            .catch(error => {
                console.error('Wishlist 載入失敗:', error);

                errors.push(
                    'Wishlist'
                );
            });


        const actorsPromise = fetchCSV(SHEET_URLS.actors)
            .then(data => {
                setActors(data);
            })
            .catch(error => {
                console.error('CP 專區載入失敗:', error);

                errors.push(
                    'CP 專區'
                );
            });


        /*
            等三份都完成
        */

        await Promise.all([
            dramaPromise,
            wishlistPromise,
            actorsPromise
        ]);


        if (errors.length > 0) {

            setLoadErrors(errors);
        }


        setLastUpdated(
            new Date()
        );


        /*
            不管怎樣一定結束 Loading
        */

        setLoading(false);
    }


    useEffect(() => {

        loadAllData();

    }, []);


    /* =====================================================
       搜尋劇集
    ===================================================== */

    const filteredDramas = useMemo(() => {

        const keyword =
            searchTerm
                .trim()
                .toLowerCase();

        if (!keyword) {
            return dramas;
        }

        return dramas.filter(drama => {

            const titleZh =
                getField(
                    drama,
                    'title_zh',
                    '中文劇名',
                    '劇名'
                ).toLowerCase();

            const titleTh =
                getField(
                    drama,
                    'title_th',
                    '泰文劇名'
                ).toLowerCase();

            const cpName =
                getField(
                    drama,
                    'cp_name',
                    'CP名稱',
                    'CP 名稱'
                ).toLowerCase();

            return (
                titleZh.includes(keyword) ||
                titleTh.includes(keyword) ||
                cpName.includes(keyword)
            );
        });

    }, [
        dramas,
        searchTerm
    ]);


    /* =====================================================
       格式化更新時間
    ===================================================== */

    function formatTime(date) {

        if (!date) {
            return '';
        }

        return date.toLocaleTimeString(
            'zh-TW',
            {
                hour: '2-digit',
                minute: '2-digit'
            }
        );
    }


    /* =====================================================
       圖片載入失敗
    ===================================================== */

    function handleDramaImageError(event) {

        event.currentTarget.onerror = null;

        event.currentTarget.src =
            DEFAULT_DRAMA_IMAGE;
    }


    function handleActorImageError(event) {

        event.currentTarget.onerror = null;

        event.currentTarget.src =
            DEFAULT_ACTOR_IMAGE;
    }


    /* =====================================================
       Render
    ===================================================== */

    return (

        <div className="min-h-screen pb-16">


            {/* =================================================
                Header
            ================================================= */}

            <header
                className="
                    glass-card
                    sticky
                    top-0
                    z-50
                    border-b
                    border-rose-100
                    shadow-sm
                    px-4
                    md:px-6
                    py-4
                "
            >

                <div
                    className="
                        max-w-7xl
                        mx-auto
                        flex
                        flex-col
                        lg:flex-row
                        justify-between
                        items-center
                        gap-4
                    "
                >

                    {/* 標題 */}

                    <div className="flex items-center gap-3">

                        <span className="text-3xl">
                            ✨
                        </span>

                        <div>

                            <h1
                                className="
                                    text-xl
                                    font-bold
                                    tracking-wide
                                    text-[#5C4033]
                                "
                            >
                                我們的泰百追劇宇宙
                            </h1>

                            <p
                                className="
                                    text-xs
                                    text-rose-400
                                    mt-0.5
                                "
                            >
                                雙人進度同步・Google 試算表資料庫
                            </p>

                        </div>

                    </div>


                    {/* Tabs */}

                    <div
                        className="
                            flex
                            bg-rose-50/80
                            p-1
                            rounded-full
                            border
                            border-rose-200
                            max-w-full
                            overflow-x-auto
                            scrollbar-hide
                        "
                    >

                        <button
                            onClick={() =>
                                setActiveTab('dramas')
                            }
                            className={`
                                px-4
                                md:px-5
                                py-2
                                rounded-full
                                text-sm
                                font-medium
                                transition-all
                                whitespace-nowrap
                                ${
                                    activeTab === 'dramas'
                                    ? 'bg-[#D88A8A] text-white shadow-sm'
                                    : 'text-[#7C6359] hover:text-[#5C4033]'
                                }
                            `}
                        >
                            📺 劇集總表 ({dramas.length})
                        </button>


                        <button
                            onClick={() =>
                                setActiveTab('wishlist')
                            }
                            className={`
                                px-4
                                md:px-5
                                py-2
                                rounded-full

                                transition-all
                                whitespace-nowrap

                        <button

                {/* 同步狀態 */}

                {!loading && (

                    <div

                            flex-col
                            sm:flex-row

                        "
                    >

                        <span>
                            {loadErrors.length === 0

                        {lastUpdated && (

            </header>


            {/* =================================================
                Main
            ================================================= */}

            <main

                    mx-auto
                    px-4
                    mt-8
                "
            >


                {/* =================================================

                ================================================= */}

                {loading && (

                        "

                        🌸 正在從 Google 試算表同步資料中，請稍候...

                    </div>
                )}


                {/* =================================================
                    完成載入
                ================================================= */}

                {!loading && (

                    <div className="fade-in">


                        {/* =================================================
                            部分載入錯誤
                        ================================================= */}

                        {loadErrors.length > 0 && (

                            <div
                                className="
                                    mb-6
                                    rounded-2xl
                                    border
                                    border-amber-200
                                    bg-amber-50
                                    px-4
                                    py-3
                                    flex
                                    flex-col
                                    md:flex-row
                                    justify-between
                                    items-start
                                    md:items-center
                                    gap-3
                                "
                            >

                                <div>

                                    </div>

                                            mt-1

                                    </div>

                                <button

                                    🔄 重新同步
                                </button>

                            </div>
                        )}


                        {/* =================================================
                            劇集
                        ================================================= */}

                        {activeTab === 'dramas' && (

                                                text-stone-400
                                            "
                                        >
                                            Schedule
                                        </span>

                                    </div>


                                    <div
                                        className="
                                            grid
                                            grid-cols-7
                                            gap-2
                                            min-w-[700px]
                                        "
                                    >

                                        {[
                                            '週一',

                                                dramas.filter(drama => {

                                                        getField(
                                                            drama,

                                                            'air_day',

                                                    return (

                                                        airDay.includes(day)
                                                    );
                                                });


                                            return (

                                                <div

                                                        bg-white/70

                                                        text-center
                                                        min-h-[90px]
                                                    "
                                                >

                                                    <div

                                                        "
                                                    >
                                                        {day}

                                                    <div
                                                        className="

                                                            text-[#6C5349]
                                                            mt-1

                                                    >

                                                        {dayDramas.length > 0
                                                            ? dayDramas.map(
                                                                (drama, i) => {
