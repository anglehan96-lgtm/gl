/* 1. 全域深色文字與手機版強制繼承，解決 iOS 系統預設覆蓋顏色的問題 */
body, button, input, select, textarea {
  color: var(--text) !important;
  -webkit-text-fill-color: initial;
}

/* 2. 手機版色彩全端統一與 iOS 覆蓋修復 */
@media(max-width: 767px) {
  body {
    color: var(--text) !important;
  }
  .brand h1, .hero h2, .cp-card-member-name {
    color: var(--text) !important;
  }
}

/* 3. 月曆與卡片樣式強制統一背景與文字顏色 */
.cal-cell {
  background: #fff !important;
  border-color: #F1E1E1 !important;
  color: var(--text) !important;
}
.cal-chip {
  background: #F9ECEC !important;
  color: var(--text) !important;
}
.cal-chip.upcoming {
  background: #EDF4FC !important;
  color: #4B79A8 !important;
}
.cal-chip.ended {
  background: #F1EEEB !important;
  color: #71655E !important;
}

/* 4. 彈出視窗（Modal）強制不透明與對齊統一 */
.modal {
  background: #fff !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  color: var(--text) !important;
}
.modal-head {
  background: #fff !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
.modal-body, .modal-footer {
  background: #fff;
}
.section-title h3, .cp-name, .member-name, .doll-name {
  color: var(--text) !important;
}

 dramas:['id','title_zh','title_th','cp_name','ststus_type','premiere_date','air_day_of_week','air_time','total_episodes','synopsis','ott_platform','ott_link','poster_url','my_status','my_progress','my_rating','my_review','friend_status','friend_progress','friend_rating','friend_review','song_1_name','song_1_link','song_2_name','song_2_link','song_3_name','song_3_link','song_4_name','song_4_link','song_5_name','song_5_link','source_link'],

function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function text(v){return v===null||v===undefined?'':String(v);}
function clean(v){return text(v).trim();}
function has(v){return clean(v)!=='';}
function num(v){const n=Number(text(v).replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0;}
function bool(v){const s=clean(v).toLowerCase();return v===true||['true','1','yes','y','是','有','想看','喜歡'].includes(s);}
function uid(prefix){return prefix+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100);}
function dateObj(v){if(!has(v))return null;if(v instanceof Date)return Number.isNaN(v.getTime())?null:new Date(v);let s=clean(v);let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(!m)m=s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})/);if(!m)return null;const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return Number.isNaN(d.getTime())?null:d;}
function iso(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function fmt(d){return d?d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):'—';}
function fmtMD(d){return d?String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):'—';}
function status(v){const s=clean(v);if(s.includes('完')||s.toLowerCase().includes('completed'))return'已完結';if(s.includes('待')||s.toLowerCase().includes('upcoming'))return'待播中';if(s.includes('播')||s.toLowerCase().includes('airing'))return'正在跟播';return s||'未分類';}
function statusBadge(v){const s=status(v);return '<span class="badge '+(s==='正在跟播'?'b-airing':s==='待播中'?'b-upcoming':s==='已完結'?'b-ended':'b-pink')+'">'+esc(s)+'</span>';}
function weekdayNum(v){const s=clean(v);for(let i=0;i<7;i++){if(s.includes(WEEK[i])||s.includes('星期'+['日','一','二','三','四','五','六'][i])||s.includes('週'+['日','一','二','三','四','五','六'][i])||s.includes('周'+['日','一','二','三','四','五','六'][i]))return i;}return null;}
function episodeDate(drama,ep){const p=dateObj(drama.premiere_date);if(!p)return null;const d=new Date(p);d.setDate(d.getDate()+(Math.max(1,ep)-1)*7);return d;}
function schedule(drama){const total=num(drama.total_episodes);if(!total||!dateObj(drama.premiere_date))return[];return Array.from({length:total},function(_,i){return{episode:i+1,date:episodeDate(drama,i+1),time:clean(drama.air_time)};});}
function nextAir(drama){const s=status(drama.ststus_type);if(s==='已完結')return null;const total=num(drama.total_episodes);if(!total)return null;const progress=Math.max(num(drama.my_progress),num(drama.my_propress),num(drama.friend_progress),num(drama.friend_propress));if(progress>=total)return null;let ep=Math.max(1,progress+1),d=episodeDate(drama,ep),today=new Date();today.setHours(0,0,0,0);if(d&&progress===0&&d<today){const all=schedule(drama);const found=all.find(x=>x.date>=today);if(found){ep=found.episode;d=found.date;}}return d?{episode:ep,date:d,time:clean(drama.air_time)}:null;}
function titleOf(d){return clean(d.title_zh)||clean(d.title_th)||'未命名劇集';}
function findMember(id){const key=clean(id);if(!key)return null;return state.data.members.find(function(m){return clean(m.member_id||m.id)===key;})||null;}
function findDrama(id){return state.data.dramas.find(function(d){return clean(d.id)===clean(id);});}
function cpByName(name){return state.data.actors.find(function(a){return clean(a.cp_name)===clean(name);});}
function recordKey(sheet,r){if(sheet==='wishlist')return clean(r.drama_id)+'::'+clean(r.owner||'H');if(sheet==='dolls')return clean(r.doll_id);if(sheet==='members')return clean(r.member_id||r.id);return clean(r.id)||clean(r.cp_name)||clean(r.title_zh);}
function findRow(sheet,key){return state.data[sheet].find(function(r){return recordKey(sheet,r)===clean(key);});}
function normalizeRow(sheet,row){
  const r=Object.assign({},row||{});
  if(sheet==='dramas'){
    if(!has(r.my_progress)&&has(r.my_propress))r.my_progress=r.my_propress;
    if(!has(r.friend_progress)&&has(r.friend_propress))r.friend_progress=r.friend_propress;
    if(!has(r.source_link)&&has(r.ource_link))r.source_link=r.ource_link;
  }
  if(sheet==='actors'){
    if(!has(r.id)&&has(r.cp_id))r.id=r.cp_id;
    if(!has(r.cp_name_en)&&has(r.cp_name))r.cp_name_en=r.cp_name;
    if(!has(r.cp_status)&&has(r.status))r.cp_status=r.status;
    if(!has(r.status)&&has(r.cp_status))r.status=r.cp_status;
    if(!has(r.actor_1)&&has(r.actor_1_name))r.actor_1=r.actor_1_name;
    if(!has(r.actor_2)&&has(r.actor_2_name))r.actor_2=r.actor_2_name;
  }
  if(sheet==='members'){
    if(!has(r.member_id)&&has(r.id))r.member_id=r.id;
    if(!has(r.display_name)&&has(r.nickname))r.display_name=r.nickname;
    if(!has(r.photo_url)&&has(r.photo_1))r.photo_url=r.photo_1;
    if(!has(r.photo_url_2)&&has(r.photo_2))r.photo_url_2=r.photo_2;
    if(!has(r.photo_url_3)&&has(r.photo_3))r.photo_url_3=r.photo_3;
  }
  
  return r;
}
function color(v,fallback){return /^#[0-9A-Fa-f]{6}$/.test(clean(v))?clean(v):fallback;}
function pickerColor(v,fallback){const x=text(v).trim();if(/^#[0-9a-fA-F]{6}$/.test(x))return x;const named={orange:'#F37021',purple:'#662D91',pink:'#FF85A2',red:'#E45B67',blue:'#5B8DEF',green:'#48A878',yellow:'#E9C84A',black:'#333333',white:'#FFFFFF',grey:'#888888',gray:'#888888',brown:'#9B6A4A'};return named[x.toLowerCase()]||fallback||'#D88A8A';}
function cpColor(member,fallback){return color(member?.support_color,color(member?.favorite_color,fallback));}
function cands(url){const s=clean(url);if(!s)return[];const out=[s];let m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/);if(m){const id=m[1];out.push('https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200');out.push('https://drive.usercontent.google.com/download?id='+encodeURIComponent(id)+'&export=view');}m=s.match(/[?&]id=([^&]+)/);if(m)out.push('https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1200');return Array.from(new Set(out));}
function img(url,cls,alt){const list=cands(url);if(!list.length)return'';return '<div class="'+esc(cls||'')+'" data-image-box="1"><img loading="lazy" src="'+esc(list[0])+'" data-image-list="'+esc(JSON.stringify(list))+'" data-image-index="0" alt="'+esc(alt||'')+'"></div>';}
function handleImageError(im){try{const list=JSON.parse(im.getAttribute('data-image-list')||'[]');let i=Number(im.getAttribute('data-image-index')||0)+1;if(i<list.length){im.setAttribute('data-image-index',String(i));im.src=list[i];}else{const box=im.parentElement;if(box)box.classList.add('no-image');}}catch(e){const box=im.parentElement;if(box)box.classList.add('no-image');}}
window.handleImageError=handleImageError;

document.addEventListener('error',function(e){if(e.target&&e.target.matches&&e.target.matches('img[data-image-list]'))handleImageError(e.target);},true);
function toast(msg,error){const wrap=document.getElementById('toastWrap'),el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;right:16px;bottom:20px;z-index:1200;max-width:min(420px,calc(100vw - 32px));padding:12px 15px;border-radius:15px;background:'+(error?'#9B555C':'#51453F')+';color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.18);font-size:13px';wrap.appendChild(el);setTimeout(function(){el.remove();},3200);}
function openModal(html){closeModal(false);const root=document.createElement('div');root.className='modal-root';root.innerHTML=html;document.body.appendChild(root);document.body.style.overflow='hidden';root.addEventListener('mousedown',function(e){if(e.target===root)closeModal();});root.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeModal;});bindRoot(root);}
function closeModal(renderAgain){document.querySelectorAll('.modal-root').forEach(function(x){x.remove();});document.body.style.overflow='';state.modal=null;if(renderAgain!==false)render();}
function bindRoot(root){root.querySelectorAll('[data-drama]').forEach(function(b){b.onclick=function(){const d=findDrama(b.dataset.drama);if(d)dramaDetail(d);};});root.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){const a=findRow('actors',b.dataset.cp);if(a)cpDetail(a);};});root.querySelectorAll('[data-doll]').forEach(function(b){b.onclick=function(){const d=findRow('dolls',b.dataset.doll);if(d)dollDetail(d);};});root.querySelectorAll('[data-edit-drama]').forEach(function(b){b.onclick=function(){const d=findDrama(b.dataset.editDrama);if(d){closeModal(false);modalForm('dramas',d);}};});root.querySelectorAll('[data-edit-wish]').forEach(function(b){b.onclick=function(){const w=state.data.wishlist.find(function(x){return recordKey('wishlist',x)===b.dataset.editWish;});if(w){closeModal(false);modalForm('wishlist',w);}};});root.querySelectorAll('[data-edit-cp]').forEach(function(b){b.onclick=function(){const a=findRow('actors',b.dataset.editCp);if(a){closeModal(false);cpForm(a);}};});root.querySelectorAll('[data-edit-doll]').forEach(function(b){b.onclick=function(){const d=findRow('dolls',b.dataset.editDoll);if(d){closeModal(false);modalForm('dolls',d);}};});root.querySelectorAll('[data-open-cp-name]').forEach(function(b){b.onclick=function(){const cp=cpByName(b.dataset.openCpName);if(cp){closeModal(false);cpDetail(cp);}};});root.querySelectorAll('[data-cp-work]').forEach(function(b){b.onclick=function(){const title=clean(b.dataset.cpWork);const d=state.data.dramas.find(function(x){return clean(titleOf(x))===title||clean(x.title_zh)===title||clean(x.title_th)===title;});if(d){closeModal(false);dramaDetail(d);}else toast('這部作品目前尚未出現在劇集資料中。',true);};});root.querySelectorAll('[data-new-doll-cp]').forEach(function(b){b.onclick=function(){const cp=findRow('actors',b.dataset.newDollCp);if(cp){closeModal(false);modalForm('dolls',{owner_member_id:cp.id||cp.cp_name||cp.cp_name});}};});root.querySelectorAll('[data-open-member-id]').forEach(function(b){b.onclick=function(){const m=findMember(b.dataset.openMemberId);if(m){closeModal(false);memberDetail(m);}};});root.querySelectorAll('[data-new-doll-owner]').forEach(function(b){b.onclick=function(){const m=findMember(b.dataset.newDollOwner);if(m){closeModal(false);modalForm('dolls',{owner_member_id:m.id});}};});root.querySelectorAll('[data-remove-wish]').forEach(function(b){b.onclick=function(){deleteWishlist(b.dataset.removeWish);};});}

function jsonp(action,params){return new Promise(function(resolve,reject){const cb='GLU_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const q=new URLSearchParams(Object.assign({action:action},params||{}, {callback:cb,t:Date.now()}));let timer;window[cb]=function(data){clearTimeout(timer);delete window[cb];script.remove();if(data&&data.success===false)reject(new Error(data.message||'API 失敗'));else resolve(data||{});};script.onerror=function(){clearTimeout(timer);delete window[cb];script.remove();reject(new Error('無法載入 Google Apps Script'));};script.src=GAS_URL+'?'+q.toString();document.head.appendChild(script);timer=setTimeout(function(){delete window[cb];script.remove();reject(new Error('Google Apps Script 回應逾時'));},18000);});}
async function apiGet(action,params){
  return jsonp(action,Object.assign({},params||{},{cbust:Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}));
}
async function apiPost(payload){
  const body=JSON.stringify(Object.assign({},payload,{_client_ts:Date.now(),_nocache:uid('W')}));
  try{
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,keepalive:true});
    return {success:true,uncertain:true};
  }catch(e){
    try{
      if(navigator.sendBeacon && navigator.sendBeacon(GAS_URL,new Blob([body],{type:'text/plain;charset=utf-8'}))) return {success:true,uncertain:true,beacon:true};
    }catch(_e){}
    throw e;
  }
}
async function refreshData(initial){
  if(refreshPromise)return refreshPromise;
  refreshPromise=(async function(){
    if(initial){state.loading=true;state.errors=[];render();}
    const stamp=Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    try{
      const j=await apiGet('getAll',{cb:'fresh_'+stamp});
      if(!j||j.success===false||!j.data)throw new Error((j&&j.message)||'getAll 讀取失敗');
      const errors=[];
      SHEETS.forEach(function(sheet){
        if(Array.isArray(j.data[sheet])) state.data[sheet]=j.data[sheet].map(function(r){return normalizeRow(sheet,r);});
        else errors.push((LABELS[sheet]||sheet)+'：沒有收到資料');
      });
      state.loading=false;state.errors=errors;state.lastSync=new Date();render();
      return errors.length===0;
    }catch(allErr){
      const results=await Promise.all(SHEETS.map(async function(sheet){
        try{
          const j=await apiGet('getSheet',{sheet:sheet,cb:stamp+'_'+sheet});
          if(!j||j.success===false)throw new Error((j&&j.message)||'讀取失敗');
          return {sheet:sheet,rows:(Array.isArray(j.data)?j.data:[]).map(function(r){return normalizeRow(sheet,r);})};
        }catch(e){return {sheet:sheet,error:e};}
      }));
      const errors=[];

      state.loading=false;state.errors=errors;state.lastSync=new Date();render();

    }
  })();

  if(k==='air_day_of_week')return '<select class="select" data-field="'+k+'"><option value="">未設定</option>'+H_WEEK.map(function(s){return '<option '+(clean(value)===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(k==='owner')return '<select class="select" data-field="owner"><option value="H" '+(clean(value)!=='Q'?'selected':'')+'>H／我</option><option value="Q" '+(clean(value)==='Q'?'selected':'')+'>Q／朋友</option></select>';

async function saveGeneric(sheet,record){

  if(sheet==='wishlist'){if(!has(rec.drama_id)){toast('Wishlist 必須指定劇集',true);return;}if(!has(rec.owner))rec.owner='H';}
  if(sheet==='dolls'){if(!has(rec.doll_name)){toast('娃娃名稱不能空白',true);return;}if(!has(rec.owner_member_id)){toast('請指定所屬 CP',true);return;}if(!record&&!has(rec.doll_id))rec.doll_id=uid('DOLL');}
  if(sheet==='actors'){await cpSaveFromForm(record);return;}
  let payload,keyField,keyValue;
  if(sheet==='wishlist'){keyField='composite_drama_owner';keyValue={drama_id:record?.drama_id,owner:record?.owner||'H'};payload=record?{action:'updateRecord',sheet:sheet,keyField:keyField,keyValue:keyValue,record:Object.assign({},record,rec)}:{action:'createRecord',sheet:sheet,keyField:keyField,record:rec};}
  else {keyField=sheet==='dolls'?'doll_id':'id';keyValue=record?record[keyField]:null;payload=record?{action:'updateRecord',sheet:sheet,keyField:keyField,keyValue:keyValue,record:Object.assign({},record,rec)}:{action:'createRecord',sheet:sheet,keyField:keyField,record:rec};}
  try{await mutate(payload,record?'已更新並同步':'已新增並同步');closeModal();}catch(e){}
}
function memberEditFields(prefix,m){const x=m||{};const all=['display_name','name_zh','name_th','name_en','nickname','birth_date','zodiac','height','occupation','company','photo_url','photo_url_2','photo_url_3','instagram','x','tiktok','facebook','youtube','support_color'];return '<div class="form-grid">'+all.map(function(k){return '<div class="field '+(LONG_FIELDS.has(k)?'full':'')+'"><label>'+esc(LABEL[k]||k)+'</label>'+fieldInputForPrefix(k,x[k],prefix)+'</div>';}).join('')+'</div>';}

function fieldInputForPrefix(k,v,p){const value=text(v),val=esc(value);if(k==='support_color')return '<div class="color-input-row"><input class="color-picker" type="color" data-'+p+'="support_color" value="'+esc(pickerColor(value,'#D88A8A'))+'"><span class="muted">'+esc(value||'選擇應援色')+'</span></div>';if(k==='birth_date')return '<input class="input" type="date" data-'+p+'="'+k+'" value="'+esc(dateObj(value)?iso(dateObj(value)):value.slice(0,10))+'">';if(k==='height')return '<input class="input" type="number" min="0" step="1" data-'+p+'="'+k+'" value="'+val+'">';if(LONG_FIELDS.has(k))return '<textarea class="textarea" data-'+p+'="'+k+'">'+val+'</textarea>';return '<input class="input" type="text" data-'+p+'="'+k+'" value="'+val+'">';}
function readPrefix(p){const o={};document.querySelectorAll('.modal [data-'+p+']').forEach(function(el){let v=el.value;if(el.dataset[p]==='my_favorite')v=v==='true';o[el.dataset[p]]=v;});return o;}
function memberLabel(m,fallback){const nick=clean(m&&m.nickname),en=clean(m&&m.name_en);if(nick&&en)return nick+' ('+en+')';return nick||en||clean(fallback)||'未命名成員';}
function memberSelectHtml(prefix,selectedId){return '<div class="field full"><label>'+(prefix==='m1'?'第 1 位成員':'第 2 位成員')+'（從 Members 既有資料選擇）</label><select class="select" data-'+prefix+'="member_id"><option value="">＋ 新建成員</option>'+state.data.members.map(function(m){const id=m.member_id||m.id,n=memberLabel(m,id);return '<option value="'+esc(id)+'" '+(clean(selectedId)===clean(id)?'selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select><small>綁定顯示格式：小名（英文全名）；沒有小名時才顯示英文全名。實際儲存仍使用 member_id，因此不會因名稱變更而失去綁定。</small></div>';}

function populateMemberFields(prefix,m){const x=m||{};document.querySelectorAll('.modal [data-'+prefix+']').forEach(function(el){const k=el.dataset[prefix];if(k==='member_id')return;if(k==='support_color'){el.value=pickerColor(x[k],'#D88A8A');return;}if(k==='my_favorite')el.value=bool(x[k])?'true':'false';else if(el.type==='date')el.value=dateObj(x[k])?iso(dateObj(x[k])):text(x[k]).slice(0,10);else el.value=text(x[k]);});}
function bindMemberSelector(prefix){const el=document.querySelector('.modal [data-'+prefix+'="member_id"]');if(!el)return;el.addEventListener('change',function(){populateMemberFields(prefix,findMember(el.value)||{});});}
function cpForm(actor){
  const base=actor||{},m1=actor?findMember(actor.member_1_id):null,m2=actor?findMember(actor.member_2_id):null;
  const cpName=clean(base.cp_name_en)||clean(base.cp_name);
  openModal('<div class="modal wide">'+commonModalHead((actor?'✏️ 編輯':'＋ 新增')+' CP ＋兩位成員')+'<div class="modal-body"><div class="notice">CP 只在網站顯示英文名稱。兩位成員不會獨立出現在網站，而是在 CP 裡直接管理；Members 資料用 member_id 與 CP 互通。你也可以從 Google Sheet 手動新增資料，下一次同步會直接讀進來。</div><section><div class="section-title" style="margin-top:14px"><h3>👭 CP 資料</h3></div><div class="form-grid"><div class="field"><label>CP 名稱</label><input class="input" data-cpfield="cp_name_en" value="'+esc(cpName)+'"><small>網站顯示使用 cp_name_en；資料也會保留 cp_name。</small></div><div class="field"><label>CP 照片 URL</label><input class="input" data-cpfield="photo_url" value="'+esc(base.photo_url||'')+'"></div><div class="field"><label>CP 現況</label><select class="select" data-cpfield="cp_status"><option value="">未設定</option>'+CP_STATUS.map(function(x){return '<option '+(clean(base.cp_status||base.status)===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select></div><div class="field"><label>首次合作作品（連動劇集）</label><select class="select" data-cpfield="first_work"><option value="">未設定</option>'+state.data.dramas.map(function(d){const t=titleOf(d);return '<option value="'+esc(t)+'" '+(clean(base.first_work)===clean(t)?'selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></div><div class="field full"><label>代表作品（可複選，連動劇集）</label><div class="check-grid" data-cpfield-group="representative_work">'+state.data.dramas.map(function(d){const t=titleOf(d),picked=(clean(base.representative_work)?clean(base.representative_work).split(/\s*\|\|\|\s*|\s*[、;；]\s*/).map(clean):[]).includes(clean(t));return '<label class="check-item"><input type="checkbox" data-cpfield="representative_work" value="'+esc(t)+'" '+(picked?'checked':'')+'><span>'+esc(t)+'</span></label>';}).join('')+'</div><small>勾選一部或多部代表作品即可。</small></div></div></section><div class="separator"></div><section><div class="section-title"><h3>第 1 位成員</h3></div>'+memberSelectHtml('m1',m1?.member_id||m1?.id)+memberEditFields('m1',m1||{})+'</section><div class="separator"></div><section><div class="section-title"><h3>第 2 位成員</h3></div>'+memberSelectHtml('m2',m2?.member_id||m2?.id)+memberEditFields('m2',m2||{})+'</section></div><div class="modal-footer"><button class="btn btn-light" data-close>取消</button><button class="btn btn-primary" id="saveCP">儲存 CP＋兩位成員</button></div></div>');bindMemberSelector('m1');bindMemberSelector('m2');document.getElementById('saveCP').onclick=function(){saveCPBundle(actor,m1,m2);};
}
async function cpSaveFromForm(actor){
  const saveBtn=document.getElementById('saveCP');if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='正在儲存…';}
  const cp={};document.querySelectorAll('.modal [data-cpfield]').forEach(function(el){const key=el.dataset.cpfield;if(el.type==='checkbox'){if(!cp[key])cp[key]=[];if(el.checked)cp[key].push(el.value);return;}let v=el.value;cp[key]=v;});if(Array.isArray(cp.representative_work))cp.representative_work=cp.representative_work.join('|||');if(!has(cp.cp_name)&&has(cp.cp_name_en))cp.cp_name=cp.cp_name_en;if(!has(cp.cp_name_en)&&has(cp.cp_name))cp.cp_name_en=cp.cp_name;
  const raw1=readPrefix('m1'),raw2=readPrefix('m2');
  if(!has(cp.cp_name)){toast('CP 名稱不能空白',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  if(!has(raw1.name_en)||!has(raw2.name_en)){toast('兩位成員都必須填英文名',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  if(has(raw1.member_id)&&has(raw2.member_id)&&clean(raw1.member_id)===clean(raw2.member_id)){toast('第 1、2 位成員不能使用相同 member_id',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  const duplicate=state.data.actors.find(function(a){const same=clean(a.cp_name).toLowerCase()===clean(cp.cp_name).toLowerCase();return same&&(!actor||recordKey('actors',a)!==recordKey('actors',actor));});
  if(duplicate){toast('已經有相同 CP 名稱，請不要重複建立。',true);if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='儲存 CP＋兩位成員';}return;}
  const oldMember1=has(raw1.member_id)?findMember(raw1.member_id):null,oldMember2=has(raw2.member_id)?findMember(raw2.member_id):null;
  const m1Id=clean(raw1.member_id)||uid('MEM'),m2Id=clean(raw2.member_id)||uid('MEM');
  const m1=buildMemberPayload(raw1,m1Id,oldMember1),m2=buildMemberPayload(raw2,m2Id,oldMember2);
  m1.support_color=pickerColor(raw1.support_color,'#D88A8A');m2.support_color=pickerColor(raw2.support_color,'#D88A8A');
  const actorPayload=buildActorPayload(cp,actor,m1,m2); // 不顯示的舊欄位保留原值，避免編輯時意外清空 Sheet 資料。
  try{
    // Single bundled write prevents partial CP/member saves when requests race each other.
    await apiPost({action:'saveCPBundle',actor:actorPayload,cp:actorPayload,member1:m1,member2:m2});
    await new Promise(function(resolve){setTimeout(resolve,900);});
    const ok=await refreshData(false);
    if(ok){toast(actor?'CP 與成員已更新並同步':'CP 與成員已建立並同步');closeModal();}
    else toast('已送出儲存要求，但重新讀取失敗；請按「同步最新資料」確認。',true);
  }catch(e){toast('儲存失敗：'+(e.message||String(e)),true);}
  finally{const b=document.getElementById('saveCP');if(b){b.disabled=false;b.textContent='儲存 CP＋兩位成員';}}
}

function buildMemberPayload(form,id,old){const x=Object.assign({},old||{});Object.keys(form||{}).forEach(function(k){if(k!=='member_id')x[k]=form[k];});x.member_id=id;x.display_name=x.display_name||x.nickname||x.name_en||'';x.photo_url=x.photo_url||'';x.photo_url_2=x.photo_url_2||'';x.photo_url_3=x.photo_url_3||'';x.support_color=text(x.support_color);return x;}
function buildActorPayload(cp,old,m1,m2){const x=Object.assign({},old||{});Object.keys(cp||{}).forEach(function(k){x[k]=cp[k];});x.id=x.id||uid('CP');x.cp_name=clean(cp.cp_name_en)||clean(cp.cp_name)||clean(old?.cp_name);x.cp_name_en=clean(cp.cp_name_en)||x.cp_name;x.member_1_id=m1.member_id;x.member_2_id=m2.member_id;x.actor_1=m1.name_en||m1.nickname||'';x.actor_2=m2.name_en||m2.nickname||'';x.cp_status=clean(cp.cp_status)||clean(old?.cp_status)||clean(old?.status);x.status=x.cp_status;return x;}

async function saveCPBundle(actor,old1,old2){await cpSaveFromForm(actor);} 

window.addEventListener('error',function(e){console.error(e.error||e.message);if(!state.loading){toast('頁面執行時發生錯誤：'+(e.message||'未知錯誤'),true);}});
window.addEventListener('unhandledrejection',function(e){console.error(e.reason);state.loading=false;const msg='資料處理失敗：'+(e.reason?.message||e.reason||'未知錯誤');state.errors=[msg];try{render();}catch(_e){toast(msg,true);}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(!state.lastSync||Date.now()-state.lastSync.getTime()>30000))refreshData(false);});
window.addEventListener('focus',function(){if(!state.lastSync||Date.now()-state.lastSync.getTime()>30000)refreshData(false);});

try{render();}catch(e){state.loading=false;state.errors=['頁面啟動失敗：'+(e&&e.message?e.message:String(e))];try{render();}catch(_e){const app=document.getElementById('app');if(app)app.innerHTML='<div class="shell"><div class="error-panel">頁面啟動失敗：'+esc(e&&e.message?e.message:String(e))+'</div></div>';}}
refreshData(true).catch(function(e){state.loading=false;state.errors=['Google Sheet 同步失敗：'+(e&&e.message?e.message:String(e))];state.lastSync=null;try{render();}catch(_e){const app=document.getElementById('app');if(app)app.innerHTML='<div class="shell"><div class="error-panel">Google Sheet 同步失敗：'+esc(e&&e.message?e.message:String(e))+'</div></div>';}});
})();
</script>
