<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 我們的泰百追劇宇宙 (GL Universe)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        cardBg: 'rgba(255, 255, 255, 0.85)',
                        accentPink: '#E8A5A5',
                        accentSoft: '#F9E4E4',
                        textDark: '#4A403A'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            background-color: #FDFBF7;
            color: #4A403A;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(232, 165, 165, 0.25);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 你的真實 Google 試算表 CSV 連結
        const SHEET_URLS = {
            dramas: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=0&single=true&output=csv',
            wishlist: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=216341491&single=true&output=csv',
            actors: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMZ47PrJewiLmvkOtVLSWaupYPuClWLjnJWTaMTaFtwKUreh4xOaRPVBnGs3t2lqcx32AEESztOn1e/pub?gid=832417858&single=true&output=csv'
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dramas');
            const [dramas, setDramas] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [actors, setActors] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                async function fetchData() {
                    try {
                        setLoading(true);

                        Papa.parse(SHEET_URLS.dramas, {
                            download: true,
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setDramas(results.data);
                            }
                        });

                        Papa.parse(SHEET_URLS.wishlist, {
                            download: true,
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setWishlist(results.data);
                            }
                        });

                        Papa.parse(SHEET_URLS.actors, {
                            download: true,
                            header: true,
                            skipEmptyLines: true,
                            complete: (results) => {
                                setActors(results.data);
                                setLoading(false);
                            }
                        });

                    } catch (error) {
                        console.error("讀取試算表失敗:", error);
                        setLoading(false);
                    }
                }
                fetchData();
            }, []);

            // 搜尋過濾劇集
            const filteredDramas = dramas.filter(d => {
                const titleZh = d.title_zh || '';
                const cpName = d.cp_name || '';
                return titleZh.toLowerCase().includes(searchTerm.toLowerCase()) || 
                       cpName.toLowerCase().includes(searchTerm.toLowerCase());
            });

            return (
                <div className="min-h-screen pb-16">
                    {/* 頂部標題與導航列 */}
                    <header className="glass-card sticky top-0 z-50 border-b border-rose-100 shadow-sm px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl">✨</span>
                            <div>
                                <h1 className="text-xl font-bold tracking-wide text-[#5C4033]">我們的泰百追劇宇宙</h1>
                                <p className="text-xs text-rose-400">雙人進度同步・即時讀取 Google 試算表</p>
                            </div>
                        </div>

                        {/* 分頁切換 Tabs */}
                        <div className="flex bg-rose-50/80 p-1 rounded-full border border-rose-200">
                            <button onClick={() => setActiveTab('dramas')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${activeTab === 'dramas' ? 'bg-[#D88A8A] text-white shadow-sm' : 'text-[#7C6359] hover:text-[#5C4033]'}`}>
                                📺 劇集總表 ({dramas.length})
                            </button>
                            <button onClick={() => setActiveTab('wishlist')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${activeTab === 'wishlist' ? 'bg-[#D88A8A] text-white shadow-sm' : 'text-[#7C6359] hover:text-[#5C4033]'}`}>
                                🎁 雙人 Wishlist ({wishlist.length})
                            </button>
                            <button onClick={() => setActiveTab('actors')} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${activeTab === 'actors' ? 'bg-[#D88A8A] text-white shadow-sm' : 'text-[#7C6359] hover:text-[#5C4033]'}`}>
                                👩‍❤‍👩 CP 專區 ({actors.length})
                            </button>
                        </div>
                    </header>

                    {/* 主內容區 */}
                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {loading ? (
                            <div className="text-center py-28 text-[#8C7369] font-medium text-lg">
                                🌸 正在從 Google 試算表同步資料中，請稍候...
                            </div>
                        ) : (
                            <>
                                {/* 1. 劇集總表分頁 */}
                                {activeTab === 'dramas' && (
                                    <div>
                                        {/* 本週開播日曆 Bar */}
                                        <div className="glass-card rounded-2xl p-4 mb-6 border border-rose-100 shadow-sm overflow-x-auto">
                                            <div className="flex items-center gap-2 mb-3">
                                                <span className="text-sm font-bold text-rose-700 bg-rose-100/80 px-3 py-1 rounded-xl">
                                                    📅 本週跟播鬧鐘 (Schedule)
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-7 gap-2 min-w-[700px]">
                                                {['週一', '週二', '週三', '週四', '週五', '週六', '週日'].map(day => (
                                                    <div key={day} className="bg-white/70 p-2.5 rounded-xl border border-rose-50 text-center">
                                                        <div className="text-xs font-bold text-rose-400">{day}</div>
                                                        <div className="text-xs text-[#6C5349] mt-1 space-y-1">
                                                            {dramas.filter(d => d.air_day_of_week && d.air_day_of_week.includes(day)).map((d, i) => (
                                                                <div key={i} className="bg-rose-50/60 p-1 rounded font-medium truncate" title={d.title_zh}>
                                                                    {d.title_zh} <span className="text-[10px] text-rose-400">({d.air_time})</span>
                                                                </div>
                                                            )) || <span className="text-stone-300">-</span>}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 搜尋列 */}
                                        <div className="mb-6 flex justify-between items-center">
                                            <input 
                                                type="text" 
                                                placeholder="🔍 搜尋中文劇名或 CP 名稱..." 
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="w-full md:w-80 px-4 py-2.5 rounded-2xl glass-card border border-rose-200 text-sm focus:outline-none focus:ring-2 focus:ring-rose-300"
                                            />
                                        </div>

                                        {/* 劇集卡片清單 */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {filteredDramas.map((drama, idx) => (
                                                <div key={drama.id || idx} className="glass-card rounded-3xl p-5 shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row gap-5">
                                                    <img 
                                                        src={drama.poster_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300'} 
                                                        alt={drama.title_zh} 
                                                        className="w-full sm:w-32 h-44 object-cover rounded-2xl shadow-inner bg-stone-200"
                                                        onError={(e)=>{e.target.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300'}}
                                                    />
                                                    <div className="flex-1 flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex justify-between items-start">
                                                                <div>
                                                                    <span className="text-xs px-2.5 py-0.5 bg-rose-100 text-rose-700 rounded-full font-medium">{drama.cp_name}</span>
                                                                    <h3 className="text-lg font-bold text-[#4A403A] mt-1">{drama.title_zh}</h3>
                                                                    <p className="text-xs text-stone-400">{drama.title_th} | 總 {drama.total_episodes} 集</p>
                                                                </div>
                                                                {drama.ott_link && (
                                                                    <a href={drama.ott_link} target="_blank" rel="noreferrer" className="text-xs bg-stone-800 text-white px-3 py-1.5 rounded-full hover:bg-stone-700 shadow-sm whitespace-nowrap">
                                                                        ▶ {drama.ott_plaform || 'OTT'}
                                                                    </a>
                                                                )}
                                                            </div>

                                                            {/* 雙人進度條對比 */}
                                                            <div className="mt-4 space-y-2 bg-white/60 p-3 rounded-2xl text-xs border border-rose-50">
                                                                <div className="flex justify-between items-center">
                                                                    <span className="font-semibold text-rose-600">👤 你：{drama.my_status} ({drama.my_propress}/{drama.total_episodes}集)</span>
                                                                    <span className="text-amber-500 font-bold">⭐ {drama.my_rating}分</span>
                                                                </div>
                                                                {drama.my_review && <p className="text-stone-600 italic">「{drama.my_review}」</p>}
                                                                
                                                                <hr className="border-rose-100 my-1" />
                                                                
                                                                <div className="flex justify-between items-center">
                                                                    <span className="font-semibold text-indigo-600">👥 朋友：{drama.friend_status} ({drama.friend_progress}/{drama.total_episodes}集)</span>
                                                                    <span className="text-amber-500 font-bold">⭐ {drama.friend_rating}分</span>
                                                                </div>
                                                                {drama.friend_review && <p className="text-stone-600 italic">「{drama.friend_review}」</p>}
                                                            </div>
                                                        </div>

                                                        {drama.ost_link && (
                                                            <div className="mt-3 text-right">
                                                                <a href={drama.ost_link} target="_blank" rel="noreferrer" className="text-[11px] text-rose-500 hover:underline">
                                                                    🎵 點此聽 OST
                                                                </a>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 2. Wishlist 願望清單分頁 */}
                                {activeTab === 'wishlist' && (
                                    <div className="glass-card rounded-3xl p-6 shadow-sm">
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-xl font-bold text-[#5C4033]">🎁 雙人待看與許願清單</h2>
                                            <span className="text-xs text-stone-500">隨手丟進去，下次開追不迷路！</span>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {wishlist.map((item, idx) => (
                                                <div key={item.id || idx} className="bg-white/75 p-4 rounded-2xl border border-rose-100 flex flex-col justify-between shadow-sm">
                                                    <div>
                                                        <span className={`text-[10px] px-2.5 py-0.5 rounded-full font-medium ${item.owner === '我' ? 'bg-rose-100 text-rose-600' : 'bg-indigo-100 text-indigo-600'}`}>
                                                            許願人：{item.owner}
                                                        </span>
                                                        <h3 className="font-bold text-[#4A403A] mt-2.5">{item.titles}</h3>
                                                        <p className="text-xs text-stone-500 mt-1.5">{item.note}</p>
                                                    </div>
                                                    {item.ource_link && (
                                                        <a href={item.ource_link} target="_blank" rel="noreferrer" className="mt-4 text-xs text-rose-500 hover:underline inline-block">
                                                            🔗 相關連結
                                                        </a>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 3. CP 與演員專區分頁 */}
                                {activeTab === 'actors' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                                        {actors.map((actor, idx) => (
                                            <div key={idx} className="glass-card rounded-3xl overflow-hidden shadow-sm text-center p-6 flex flex-col items-center">
                                                <img 
                                                    src={actor.photo_url || 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300'} 
                                                    alt={actor.cp_name} 
                                                    className="w-28 h-28 rounded-full object-cover shadow-md mb-4 border-2 border-white bg-stone-200"
                                                    onError={(e)=>{e.target.src='https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300'}}
                                                />
                                                <h3 className="text-lg font-bold text-[#5C4033]">{actor.cp_name}</h3>
                                                <p className="text-xs text-stone-500 mt-1">{actor.actor_1} & {actor.actor_2}</p>
                                                
                                                <div className="mt-5 flex justify-center gap-3 text-xs w-full">
                                                    <span className={`px-3 py-1.5 rounded-full font-medium flex-1 ${actor.my_favorite && actor.my_favorite.toUpperCase() === 'TRUE' ? 'bg-rose-100 text-rose-600' : 'bg-stone-100 text-stone-400'}`}>
                                                        {actor.my_favorite && actor.my_favorite.toUpperCase() === 'TRUE' ? '💖 我的最愛' : '🤍 未加入'}
                                                    </span>
                                                    <span className={`px-3 py-1.5 rounded-full font-medium flex-1 ${actor.friend_favorite && actor.friend_favorite.toUpperCase() === 'TRUE' ? 'bg-indigo-100 text-indigo-600' : 'bg-stone-100 text-stone-400'}`}>
                                                        {actor.friend_favorite && actor.friend_favorite.toUpperCase() === 'TRUE' ? '💙 朋友最愛' : '🤍 未加入'}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
