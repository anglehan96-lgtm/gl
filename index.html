/* ============================================================
   取得欄位
============================================================ */

function getField(row, ...names) {

    if (!row) {
        return '';
    }


    for (const name of names) {

        if (
            Object.prototype.hasOwnProperty.call(
                row,
                name
            )
        ) {

            const value =
                row[name];

            if (
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ''
            ) {

                return String(value).trim();

            }

        }

    }


    return '';
}


/* ============================================================
   TRUE 判斷
============================================================ */

function isTrue(value) {

    const text =
        String(value || '')
            .trim()
            .toUpperCase();


    return [

        'TRUE',
        '1',
        'YES',
        'Y',
        '是'

    ].includes(text);

}


/* ============================================================
   清理網址
============================================================ */

function cleanUrl(rawUrl) {

    if (!rawUrl) {
        return '';
    }


    let url =
        String(rawUrl)
            .trim();


    /*
        HYPERLINK
    */

    const hyperlinkMatch =
        url.match(
            /=HYPERLINK\(\s*["']([^"']+)["']/i
        );


    if (hyperlinkMatch) {

        url =
            hyperlinkMatch[1]
                .trim();

    }


    /*
        Markdown URL
    */

    const markdownMatch =
        url.match(
            /^\[[^\]]*\]\((https?:\/\/[^)]+)\)$/i
        );


    if (markdownMatch) {

        url =
            markdownMatch[1]
                .trim();

    }


    /*
        尖括號
    */

    if (
        url.startsWith('<') &&
        url.endsWith('>')
    ) {

        url =
            url
                .slice(1, -1)
                .trim();

    }


    /*
        補 https
    */

    if (
        url &&
        !url.startsWith('http://') &&
        !url.startsWith('https://') &&
        !url.startsWith('//') &&
        !url.startsWith('data:')
    ) {

        url =
            'https://' + url;

    }


    return url;
}


/* ============================================================
   Google Drive File ID
============================================================ */

function getGoogleDriveFileId(rawUrl) {

    if (!rawUrl) {
        return '';
    }


    const url =
        String(rawUrl)
            .trim();


    /*
        /file/d/FILE_ID/view
    */

    let match =
        url.match(
            /drive\.google\.com\/file\/d\/([^/?#]+)/i
        );


    if (match) {

        return match[1];

    }


    /*
        open?id=FILE_ID
    */

    match =
        url.match(
            /[?&]id=([^&#]+)/i
        );


    if (
        match &&
        /drive\.google\.com/i.test(url)
    ) {

        return match[1];

    }


    /*
        thumbnail?id=FILE_ID
    */

    match =
        url.match(
            /drive\.google\.com\/thumbnail\?[^#]*id=([^&#]+)/i
        );


    if (match) {

        return match[1];

    }


    return '';
}


/* ============================================================
   Google Drive 圖片候選網址
============================================================ */

function getImageCandidates(rawUrl) {

    if (!rawUrl) {
        return [];
    }


    const original =
        String(rawUrl)
            .trim();


    const candidates = [];


    const driveId =
        getGoogleDriveFileId(
            original
        );


    if (driveId) {

        candidates.push(

            'https://drive.google.com/thumbnail?id=' +
            encodeURIComponent(driveId) +
            '&sz=w1000'

        );


        candidates.push(

            'https://drive.google.com/uc?export=view&id=' +
            encodeURIComponent(driveId)

        );


        candidates.push(

            'https://drive.usercontent.google.com/download?id=' +
            encodeURIComponent(driveId) +
            '&export=view&authuser=0'

        );

    }


    const normalUrl =
        cleanUrl(
            original
        );


    if (
        normalUrl &&
        !candidates.includes(normalUrl)
    ) {

        candidates.push(
            normalUrl
        );

    }


    return candidates;
}


/* ============================================================
   網址判斷
============================================================ */

function isHttpUrl(url) {

    return !!(
        url &&
        (
            url.startsWith('http://') ||
            url.startsWith('https://')
        )
    );
}


/* ============================================================
   CSV
============================================================ */

function fetchCSV(url) {

    return new Promise(
        (resolve, reject) => {

            Papa.parse(
                url,
                {

                    download:
                        true,

                    header:
                        true,

                    skipEmptyLines:
                        true,

                    encoding:
                        'UTF-8',

                    complete:
                        function(results) {

                            if (
                                results.errors &&
                                results.errors.length
                            ) {

                                console.error(
                                    'CSV 解析錯誤:',
                                    results.errors
                                );

                                reject(
                                    results.errors
                                );

                                return;
                            }


                            resolve(
                                results.data || []
                            );

                        },


                    error:
                        function(error) {

                            console.error(
                                'CSV 載入錯誤:',
                                error
                            );

                            reject(
                                error
                            );

                        }

                }
            );

        }
    );

}


/* ============================================================
   星期標準化
============================================================ */

function normalizeDayText(value) {

    return String(
        value || ''
    )
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '');
}


/* ============================================================
   星期判斷
============================================================ */

function matchesDay(
    value,
    targetDay
) {

    if (!value) {
        return false;
    }


    const text =
        normalizeDayText(
            value
        );


    const aliases = {

        '週一': [
            '週一',
            '周一',
            '星期一',
            '禮拜一',
            'monday',
            'mon'
        ],

        '週二': [
            '週二',
            '周二',
            '星期二',
            '禮拜二',
            'tuesday',
            'tue',
            'tues'
        ],

        '週三': [
            '週三',
            '周三',
            '星期三',
            '禮拜三',
            'wednesday',
            'wed'
        ],

        '週四': [
            '週四',
            '周四',
            '星期四',
            '禮拜四',
            'thursday',
            'thu',
            'thur',
            'thurs'
        ],

        '週五': [
            '週五',
            '周五',
            '星期五',
            '禮拜五',
            'friday',
            'fri'
        ],

        '週六': [
            '週六',
            '周六',
            '星期六',
            '禮拜六',
            'saturday',
            'sat'
        ],

        '週日': [
            '週日',
            '周日',
            '星期日',
            '星期天',
            '禮拜日',
            '禮拜天',
            'sunday',
            'sun'
        ]

    };


    const list =
        aliases[targetDay] || [];


    /*
        多日格式：
        週一、週四
        週一／週四
        Mon/Thu
        Monday & Thursday
    */

    const normalized =
        text
            .replace(/[、，；;／/|&＆+]+/g, ',');


    const tokens =
        normalized
            .split(',')
            .map(
                item =>
                    item.trim()
            )
            .filter(Boolean);


    for (
        const token of tokens
    ) {

        for (
            const alias of list
        ) {

            if (
                token ===
                normalizeDayText(
                    alias
                )
            ) {

                return true;
            }

        }

    }


    /*
        最後再做 includes
        支援「每週一」這類寫法
    */

    return list.some(
        alias =>
            normalized.includes(
                normalizeDayText(
                    alias
                )
            )
    );
}


/* ============================================================
   OST 分割
       
   建議使用：
   |
   換行
   ;
   ；
   /
   ／

   不用逗號，避免 YouTube URL 中的參數被拆開。
============================================================ */

function parseOstLinks(rawValue) {

    if (!rawValue) {
        return [];
    }


    const parts =
        String(rawValue)
            .trim()
            .split(
                /[|\n;；\/／]+/
            )
            .map(
                item =>
                    item.trim()
            )
            .filter(Boolean);


    const links = [];


    for (
        const part of parts
    ) {

        const url =
            cleanUrl(part);


        if (
            isHttpUrl(url)
        ) {

            links.push(url);

        }

    }


    /*
        去重
    */

    return [
        ...new Set(
            links
        )
    ];
}


/* ============================================================

============================================================ */

function App() {

    /* ========================================================
       載入資料
    ======================================================== */

    async function loadAllData() {

        setLoading(true);

        const errors = [];


        /*
            三份分開處理
        */

        const dramaTask =
            fetchCSV(
                SHEET_URLS.dramas
            )
            .then(
                data =>
                    setDramas(data)
            )
            .catch(
                error => {

                    console.error(

                        error
                    );

                    errors.push(

                    );

            );

            fetchCSV(
                SHEET_URLS.wishlist
            )
            .then(
                data =>
                    setWishlist(data)
            )
            .catch(
                error => {

                    console.error(
                        'Wishlist 錯誤:',
                        error
                    );

                    errors.push(
                        'Wishlist'
                    );
                }
            );

            fetchCSV(
                SHEET_URLS.actors
            )
            .then(
                data =>
                    setActors(data)
            )
            .catch(
                error => {

                    console.error(
                        'CP 專區錯誤:',
                        error
                    );

                    errors.push(
                        'CP 專區'
                    );
                }
            );


        await Promise.all([
            dramaTask,
            wishlistTask,
            actorsTask
        ]);


        setLoadErrors(
            errors
        );


        setLastUpdated(
            new Date()
        );


        setLoading(false);
    }


    useEffect(
        () => {

            loadAllData();

        },
        []
    );


    /* ========================================================
       搜尋
    ======================================================== */

    const filteredDramas =
        useMemo(
            () => {

                const keyword =
                    searchTerm
                        .trim()
                        .toLowerCase();


                if (!keyword) {

                    return dramas;

                }


                return dramas.filter(
                    drama => {

                        const titleZh =
                            getField(
                                drama,
                                'title_zh',
                                '中文劇名',
                                '劇名'
                            )
                            .toLowerCase();


                        const titleTh =
                            getField(
                                drama,
                                'title_th',
                                '泰文劇名'
                            )
                            .toLowerCase();


                        const cpName =
                            getField(
                                drama,
                                'cp_name',
                                'CP名稱',
                                'CP 名稱'
                            )
                            .toLowerCase();


                        return (

                            titleZh.includes(
                                keyword
                            )

                            ||

                            titleTh.includes(
                                keyword
                            )

                            ||

                            cpName.includes(
                                keyword
                            )

                        );

                    }
                );

                searchTerm

    ======================================================== */

            setFailed

                    ) {

                        );

                    } else {

                                                                    </div>


                                                                    {myReview && (

                                                                        <p
                                                                            className="
                                                                                mt-2
                                                                                text-xs
                                                                                text-stone-600
                                                                                italic
                                                                                leading-relaxed
                                                                            "
                                                                        >
                                                                            「{myReview}」
                                                                        </p>

                                                                    )}

                                                                </div>


                                                                <div
                                                                    className="
                                                                        my-3
                                                                        border-t
                                                                        border-rose-100
                                                                    "
                                                                ></div>


                                                                {/* 錢 */}

                                                                <div>

                                                                    <div
                                                                        className="
                                                                            flex
                                                                            justify-between
                                                                            items-start
                                                                            gap-2
                                                                        "
                                                                    >

                                                                        <div
                                                                            className="
                                                                                text-sm
                                                                                font-bold
                                                                                text-indigo-600
                                                                            "
                                                                        >

                                                                            💙 錢

                                                                        </div>


                                                                        {friendRating && (

                                                                            <div
                                                                                className="
                                                                                    text-xs
                                                                                    font-bold
                                                                                    text-amber-500
                                                                                "
                                                                            >
                                                                                ⭐ {friendRating}
                                                                            </div>

                                                                        )}

                                                                    </div>


                                                                    <div
                                                                        className="
                                                                            text-xs
                                                                            text-[#6C5349]
                                                                            mt-1.5
                                                                        "
                                                                    >

                                                                        {friendStatus || '未設定'}

                                                                        {' · '}

                                                                        {friendProgress || 0}
                                                                        /
                                                                        {totalEpisodes || '?'}
                                                                        集

                                                                    </div>


                                                                    {friendReview && (

                                                                        <p
                                                                            className="
                                                                                mt-2
                                                                                text-xs
                                                                                text-stone-600
                                                                                italic
                                                                                leading-relaxed
                                                                            "
                                                                        >
                                                                            「{friendReview}」
                                                                        </p>

                                                                    )}

                                                                </div>

                                                            </div>


                                                            {/* =================================================
                                                                 多 OST
                                                            ================================================== */}

                                                            {ostLinks.length > 0 && (

                                                                <div
                                                                    className="
                                                                        mt-4
                                                                        rounded-2xl
                                                                        bg-rose-50/70
                                                                        border
                                                                        border-rose-100
                                                                        p-3.5
                                                                    "
                                                                >

                                                                    <div
                                                                        className="
                                                                            flex
                                                                            items-center
                                                                            justify-between
                                                                            gap-2
                                                                        "
                                                                    >

                                                                        <div
                                                                            className="
                                                                                text-sm
                                                                                font-bold
                                                                                text-rose-600
                                                                            "
                                                                        >
                                                                            🎵 OST
                                                                        </div>


                                                                        <span
                                                                            className="
                                                                                text-[11px]
                                                                                text-stone-400
                                                                            "
                                                                        >
                                                                            {ostLinks.length} 首
                                                                        </span>

                                                                    </div>


                                                                    <div
                                                                        className="
                                                                            grid
                                                                            grid-cols-1
                                                                            sm:grid-cols-2
                                                                            gap-2
                                                                            mt-3
                                                                        "
                                                                    >

                                                                        {ostLinks.map(
                                                                            (
                                                                                link,
                                                                                ostIndex
                                                                            ) => {


                                                                                const isTheme =
                                                                                    ostIndex === 0;


                                                                                return (

                                                                                    <a
                                                                                        key={
                                                                                            ostIndex
                                                                                        }
                                                                                        href={
                                                                                            link
                                                                                        }
                                                                                        target="_blank"
                                                                                        rel="noopener noreferrer"
                                                                                        title={
                                                                                            isTheme
                                                                                                ? '主題曲'
                                                                                                : `第 ${ostIndex + 1} 首插曲`
                                                                                        }
                                                                                        className={`
                                                                                            link-button
                                                                                            justify-start
                                                                                            w-full
                                                                                            bg-white
                                                                                            border
                                                                                            ${
                                                                                                isTheme
                                                                                                ? 'border-rose-300 text-rose-700'
                                                                                                : 'border-rose-100 text-rose-600'
                                                                                            }
                                                                                            text-xs
                                                                                            font-medium
                                                                                        `}
                                                                                    >

                                                                                        🎵

                                                                                        <span>
                                                                                            {
                                                                                                isTheme
                                                                                                ? '主題曲'
                                                                                                : '插曲'
                                                                                            }
                                                                                        </span>

                                                                                    </a>

                                                                                );

                                                                            }
                                                                        )}

                                                                    </div>

                                                                </div>

                                                            )}

                                                        </div>

                                                    </article>

                                                );
                                            }
                                        )}

                                    </div>

                                )}

                            </section>

                        )}


                        {/* =====================================================
                             Wishlist
                        ====================================================== */}

                        {activeTab === 'wishlist' && (

                            <section
                                className="
                                    glass-card
                                    rounded-3xl
                                    p-4
                                    sm:p-6
                                    shadow-sm
                                "
                            >

                                <div
                                    className="
                                        flex
                                        flex-col
                                        sm:flex-row
                                        sm:items-center
                                        sm:justify-between
                                        gap-2
                                        mb-5
                                    "
                                >

                                    <h2
                                        className="
                                            text-xl
                                            font-bold
                                            text-[#5C4033]
                                        "
                                    >
                                        🎁 待看清單
                                    </h2>


                                    <p
                                        className="
                                            text-xs
                                            text-stone-500
                                        "
                                    >
                                        想看什麼就丟進來
                                    </p>

                                </div>


                                {wishlist.length === 0 ? (

                                    <div
                                        className="
                                            py-16
                                            text-center
                                            text-stone-400
                                        "
                                    >

                                        <div
                                            className="
                                                text-5xl
                                                mb-3
                                            "
                                        >
                                            🎁
                                        </div>

                                        目前還沒有 Wishlist

                                    </div>

                                ) : (

                                    <div
                                        className="
                                            grid
                                            grid-cols-1
                                            sm:grid-cols-2
                                            lg:grid-cols-3
                                            gap-4
                                        "
                                    >

                                        {wishlist.map(
                                            (
                                                item,
                                                idx
                                            ) => {


                                                const owner =
                                                    getField(
                                                        item,
                                                        'owner',
                                                        '擁有人',
                                                        '許願人',
                                                        '提出人'
                                                    );


                                                const title =
                                                    getField(
                                                        item,
                                                        'titles',
                                                        'title',
                                                        '名稱',
                                                        '作品名稱'
                                                    );


                                                const note =
                                                    getField(
                                                        item,
                                                        'note',
                                                        '備註'
                                                    );


                                                const sourceLink =
                                                    cleanUrl(
                                                        getField(
                                                            item,
                                                            'source_link',
                                                            'ource_link',
                                                            'source_url',
                                                            '連結'
                                                        )
                                                    );


                                                return (

                                                    <article
                                                        key={
                                                            getField(
                                                                item,
                                                                'id'
                                                            ) ||
                                                            idx
                                                        }
                                                        className="
                                                            bg-white/75
                                                            border
                                                            border-rose-100
                                                            rounded-2xl
                                                            p-4
                                                            shadow-sm
                                                        "
                                                    >

                                                        <span
                                                            className={`
                                                                soft-badge
                                                                ${
                                                                    owner === '遙' ||
                                                                    owner === '我'
                                                                    ? 'bg-rose-100 text-rose-600'
                                                                    : 'bg-indigo-100 text-indigo-600'
                                                                }
                                                            `}
                                                        >

                                                            {
                                                                owner === '遙' ||
                                                                owner === '我'
                                                                ? '🧡 遙'
                                                                : '💙 錢'
                                                            }

                                                        </span>


                                                        <h3
                                                            className="
                                                                font-bold
                                                                text-lg
                                                                text-[#4A403A]
                                                                mt-3
                                                            "
                                                        >
                                                            {title || '未命名作品'}
                                                        </h3>


                                                        {note && (

                                                            <p
                                                                className="
                                                                    text-sm
                                                                    text-stone-500
                                                                    mt-2
                                                                    leading-relaxed
                                                                "
                                                            >
                                                                {note}
                                                            </p>

                                                        )}


                                                        {isHttpUrl(
                                                            sourceLink
                                                        ) && (

                                                            <a
                                                                href={
                                                                    sourceLink
                                                                }
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                className="
                                                                    link-button
                                                                    w-full
                                                                    mt-4
                                                                    border
                                                                    border-rose-200
                                                                    bg-rose-50
                                                                    text-rose-600
                                                                    text-xs
                                                                    font-semibold
                                                                "
                                                            >
                                                                🔗 開啟相關連結
                                                            </a>

                                                        )}

                                                    </article>

                                                );

                                            }
                                        )}

                                    </div>

                                )}

                            </section>

                        )}


                        {/* =====================================================
                             CP
                        ====================================================== */}

                        {activeTab === 'actors' && (

                            actors.length === 0 ? (

                                <div
                                    className="
                                        glass-card
                                        rounded-3xl
                                        p-12
                                        text-center
                                        text-stone-400
                                    "
                                >

                                    <div
                                        className="
                                            text-5xl
                                            mb-3
                                        "
                                    >
                                        👩‍❤️‍👩
                                    </div>

                                    目前還沒有 CP 資料

                                </div>

                            ) : (

                                <section
                                    className="
                                        grid
                                        grid-cols-1
                                        sm:grid-cols-2
                                        lg:grid-cols-3
                                        gap-5
                                    "
                                >

                                    {actors.map(
                                        (
                                            actor,
                                            idx
                                        ) => {


                                            const cpName =
                                                getField(
                                                    actor,
                                                    'cp_name',
                                                    'CP名稱',
                                                    'CP 名稱'
                                                );


                                            const actor1 =
                                                getField(
                                                    actor,
                                                    'actor_1',
                                                    '演員1',
                                                    '成員1'
                                                );


                                            const actor2 =
                                                getField(
                                                    actor,
                                                    'actor_2',
                                                    '演員2',
                                                    '成員2'
                                                );


                                            const photoUrl =
                                                getField(
                                                    actor,
                                                    'photo_url',
                                                    'photo',
                                                    'image_url',
                                                    '照片'
                                                );


                                            const myFavorite =
                                                isTrue(
                                                    getField(
                                                        actor,
                                                        'my_favorite',
                                                        '我的最愛'
                                                    )
                                                );


                                            const friendFavorite =
                                                isTrue(
                                                    getField(
                                                        actor,
                                                        'friend_favorite',
                                                        '朋友最愛'
                                                    )
                                                );


                                            return (

                                                <article
                                                    key={
                                                        getField(
                                                            actor,
                                                            'id'
                                                        ) ||
                                                        idx
                                                    }
                                                    className="
                                                        glass-card
                                                        rounded-3xl
                                                        p-5
                                                        shadow-sm
                                                        text-center
                                                    "
                                                >

                                                    {/* 圖片 */}

                                                    <div
                                                        className="
                                                            w-36
                                                            h-36
                                                            sm:w-32
                                                            sm:h-32
                                                            mx-auto
                                                            rounded-full
                                                            overflow-hidden
                                                            border-4
                                                            border-white
                                                            shadow-md
                                                            image-placeholder
                                                        "
                                                    >

                                                        <ActorImage
                                                            src={
                                                                photoUrl
                                                            }
                                                            alt={
                                                                cpName
                                                            }
                                                        />

                                                    </div>


                                                    {/* 名稱 */}

                                                    <h2
                                                        className="
                                                            mt-4
                                                            text-xl
                                                            font-bold
                                                            text-[#5C4033]
                                                        "
                                                    >
                                                        {cpName || '未命名 CP'}
                                                    </h2>


                                                    <p
                                                        className="
                                                            text-sm
                                                            text-stone-500
                                                            mt-1
                                                        "
                                                    >
                                                        {actor1 || '—'}
                                                        {' & '}
                                                        {actor2 || '—'}
                                                    </p>


                                                    {/* 狀態 */}

                                                    <div
                                                        className="
                                                            grid
                                                            grid-cols-1
                                                            gap-2
                                                            mt-5
                                                        "
                                                    >

                                                        <div
                                                            className={`
                                                                rounded-2xl
                                                                px-3
                                                                py-3
                                                                text-xs
                                                                font-semibold
                                                                ${
                                                                    myFavorite
                                                                    ? 'bg-rose-100 text-rose-600'
                                                                    : 'bg-stone-100 text-stone-400'
                                                                }
                                                            `}
                                                        >
                                                            {
                                                                myFavorite
                                                                ? '🧡 遙'
                                                                : '🤍 遙未加入'
                                                            }
                                                        </div>


                                                        <div
                                                            className={`
                                                                rounded-2xl
                                                                px-3
                                                                py-3
                                                                text-xs
                                                                font-semibold
                                                                ${
                                                                    friendFavorite
                                                                    ? 'bg-indigo-100 text-indigo-600'
                                                                    : 'bg-stone-100 text-stone-400'
                                                                }
                                                            `}
                                                        >
                                                            {
                                                                friendFavorite
                                                                ? '💙 錢'
                                                                : '🤍 錢未加入'
                                                            }
                                                        </div>

                                                    </div>

                                                </article>

                                            );

                                        }
                                    )}

                                </section>

                            )

                        )}

                    </div>

                )}

            </main>


            {/* Footer */}

            <footer
                className="
                    max-w-7xl
                    mx-auto
                    px-4
                    mt-12
                    text-center
                    text-[11px]
                    text-stone-400
                "
            >

                ✨ 泰百宇宙 · 遙 × 錢 ✨

            </footer>

        </div>

    );
}


/* ============================================================
   啟動
============================================================ */

const root =
    ReactDOM.createRoot(
        document.getElementById(
            'root'
        )
    );


root.render(
    <App />
);

</script>

</body>
</html>
